<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lean 数学分析入门</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="一本可以运行的数学分析入门教科书：每个定义、定理与习题都是由 Lean 4 检查的代码。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  /* 字体样式表异步加载：Google Fonts 不可用时直接使用系统字体，不阻塞页面。 */
  (function () {
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;900&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap';
    document.head.appendChild(l);
  })();
</script>
<style>
/* Layout: a fixed chapter rail on the left and a ~68ch reading column; exercises are framed worksheets,
   chapter numbers are cinnabar seal squares, Lean code reads like the editor's infoview. */
:root {
  --paper: #fafaf8;
  --paper-2: #f1f2f5;
  --paper-3: #e8eaf0;
  --ink: #1b2130;
  --ink-2: #4b5367;
  --ink-3: #737b90;
  --rule: #dcdfe6;
  --accent: #2b4c9b;
  --accent-ink: #ffffff;
  --accent-soft: #e5eaf6;
  --seal: #b23f2c;
  --seal-soft: #f6e7e3;
  --ok: #2c7a4d;
  --ok-soft: #e2f0e7;
  --warn-soft: #fbf1d9;
  --tok-kw: #7a3e9d;
  --tok-tac: #2b4c9b;
  --tok-ty: #0f7a6c;
  --tok-com: #6f7686;
  --tok-num: #a2541c;
  --tok-str: #2c7a4d;
  --tok-op: #5b6274;
  --tok-name: #1b2130;
  --shadow: 0 1px 2px rgba(27, 33, 48, .06), 0 4px 16px rgba(27, 33, 48, .06);

  --font-body: "STIX Two Text", "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-head: "Noto Serif SC", "STIX Two Text", "Songti SC", serif;
  --font-ui: "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-code: "JetBrains Mono", "Noto Sans Mono", "Menlo", "Consolas", "Noto Sans SC", monospace;

  --rail-w: 17.5rem;
  --measure: 44rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14171d; --paper-2: #1b1f27; --paper-3: #252a35; --ink: #e3e6ed; --ink-2: #a9afbd; --ink-3: #828a9c;
    --rule: #2c323e; --accent: #93abed; --accent-ink: #11151c; --accent-soft: #222b44; --seal: #e48a73; --seal-soft: #37231f;
    --ok: #7ec99c; --ok-soft: #1a3024; --warn-soft: #362d17;
    --tok-kw: #d0a3ef; --tok-tac: #93abed; --tok-ty: #6fd3c2; --tok-com: #8a92a3; --tok-num: #e6a676; --tok-str: #7ec99c; --tok-op: #a9afbd; --tok-name: #e3e6ed;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14171d; --paper-2: #1b1f27; --paper-3: #252a35; --ink: #e3e6ed; --ink-2: #a9afbd; --ink-3: #828a9c;
  --rule: #2c323e; --accent: #93abed; --accent-ink: #11151c; --accent-soft: #222b44; --seal: #e48a73; --seal-soft: #37231f;
  --ok: #7ec99c; --ok-soft: #1a3024; --warn-soft: #362d17;
  --tok-kw: #d0a3ef; --tok-tac: #93abed; --tok-ty: #6fd3c2; --tok-com: #8a92a3; --tok-num: #e6a676; --tok-str: #7ec99c; --tok-op: #a9afbd; --tok-name: #e3e6ed;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 4.5rem; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.8;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
code, pre { font-family: var(--font-code); }

/* ---------- rail ---------- */
#rail {
  position: fixed; inset: 0 auto 0 0; width: var(--rail-w);
  padding: calc(1.25rem + env(safe-area-inset-top, 0px)) 1rem calc(1rem + env(safe-area-inset-bottom, 0px)) max(1rem, env(safe-area-inset-left, 0px));
  border-right: 1px solid var(--rule);
  background: var(--paper);
  display: flex; flex-direction: column; gap: 1.25rem;
  overflow-y: auto;
  font-family: var(--font-ui);
  z-index: 20;
}
.brand { display: flex; gap: .75rem; align-items: center; text-decoration: none; color: var(--ink); }
.brand-mark {
  flex: none; width: 2.5rem; height: 2.5rem; display: grid; place-items: center;
  border: 2px solid var(--seal); color: var(--seal); border-radius: 4px;
  font-family: "STIX Two Text", serif; font-style: italic; font-size: 1.5rem; line-height: 1;
}
.brand b { display: block; font-family: var(--font-head); font-weight: 900; font-size: 1.05rem; letter-spacing: .02em; line-height: 1.3; }
.brand small { display: block; color: var(--ink-3); font-size: .78rem; line-height: 1.4; }

.overall { font-size: .8rem; color: var(--ink-2); display: grid; gap: .4rem; }
.overall .bar { height: 4px; border-radius: 2px; background: var(--paper-3); overflow: hidden; }
.overall .bar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s ease; }

#toc { display: grid; gap: 2px; }
.toc-label { font-size: .72rem; letter-spacing: .12em; color: var(--ink-3); margin: 0 0 .35rem .5rem; }
.toc-item {
  display: grid; grid-template-columns: 1.6rem 1fr auto; align-items: center; gap: .5rem;
  padding: .45rem .5rem; border-radius: 6px; text-decoration: none; color: var(--ink-2); font-size: .9rem; line-height: 1.35;
}
.toc-item:hover { background: var(--paper-2); color: var(--ink); }
.toc-item[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.toc-num { font-family: "STIX Two Text", serif; font-size: 1rem; color: var(--seal); text-align: center; font-variant-numeric: tabular-nums; }
.toc-prog { font-size: .72rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.toc-prog.full { color: var(--ok); font-weight: 700; }
.rail-foot { margin-top: auto; font-size: .78rem; color: var(--ink-3); display: grid; gap: .3rem; line-height: 1.5; }
.rail-foot a { color: var(--ink-2); }

/* ---------- top bar (narrow screens) ---------- */
#topbar { display: none; }
#scrim { display: none; }

/* ---------- main ---------- */
main {
  margin-left: var(--rail-w);
  padding-block: 2.5rem 6rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.col { max-width: var(--measure); margin: 0 auto; }

/* chapter header */
.ch-head { display: grid; grid-template-columns: auto 1fr; gap: 1.25rem; align-items: center; margin-bottom: 1.5rem; }
.seal {
  width: 4.25rem; height: 4.25rem; display: grid; place-items: center;
  border: 2.5px solid var(--seal); border-radius: 6px; color: var(--seal);
  font-family: "STIX Two Text", serif; font-size: 2.4rem; line-height: 1; font-variant-numeric: lining-nums;
}
.ch-eyebrow { font-family: var(--font-ui); font-size: .8rem; letter-spacing: .14em; color: var(--seal); margin: 0; }
.ch-title { font-family: var(--font-head); font-weight: 900; font-size: clamp(1.8rem, 4.5vw, 2.5rem); line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: .01em; }
.ch-meta {
  display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center;
  font-family: var(--font-ui); font-size: .85rem; color: var(--ink-2);
  padding: .75rem 0; border-block: 1px solid var(--rule); margin-bottom: 2rem;
}
.ch-meta .grow { flex: 1; }

.prose h2 { font-family: var(--font-head); font-weight: 700; font-size: 1.45rem; line-height: 1.4; margin: 2.75rem 0 .75rem; text-wrap: balance; }
.prose h3 { font-family: var(--font-head); font-weight: 600; font-size: 1.15rem; line-height: 1.5; margin: 2.25rem 0 .5rem; text-wrap: balance; }
.prose h4 { font-family: var(--font-head); font-weight: 600; font-size: 1.02rem; margin: 1.5rem 0 .4rem; }
.prose p, .prose li { text-align: justify; text-justify: inter-character; }
.prose p { margin: .75rem 0; }
.prose ul, .prose ol { padding-left: 1.4rem; margin: .75rem 0; }
.prose li { margin: .3rem 0; }
.prose li::marker { color: var(--ink-3); }
.prose strong { font-weight: 600; color: var(--ink); }
.prose code, .ex-name, .inline-code {
  font-size: .86em; background: var(--paper-2); border: 1px solid var(--rule);
  padding: .05em .35em; border-radius: 4px; white-space: break-spaces; word-break: break-word;
}
.math { font-family: "STIX Two Text", "Cambria Math", serif; white-space: nowrap; }
.math sub, .math sup { font-size: .72em; line-height: 0; }
.math-block .math { white-space: normal; }
.math-block { overflow-x: auto; margin: 1rem 0; text-align: center; }
.math-block math { font-size: 1.1em; }

.callout { margin: 1.25rem 0; padding: .9rem 1.1rem; border-radius: 0 8px 8px 0; border-left: 3px solid var(--rule); background: var(--paper-2); }
.callout > :first-child { margin-top: 0; }
.callout > :last-child { margin-bottom: 0; }
.callout-def { border-left-color: var(--accent); background: var(--accent-soft); }
.callout-thm { border-left-color: var(--seal); background: var(--seal-soft); }
.callout-thm strong:first-child { color: var(--seal); }
.callout-def strong:first-child { color: var(--accent); }
.callout-note { border-left-color: var(--ink-3); }
.callout-example { border-left-color: var(--tok-ty); }

.table-wrap { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--rule); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; line-height: 1.55; }
th, td { text-align: left; padding: .55rem .8rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-family: var(--font-ui); font-weight: 500; font-size: .8rem; letter-spacing: .06em; color: var(--ink-2); background: var(--paper-2); }
tr:last-child td { border-bottom: 0; }
td code { white-space: nowrap; }

/* code */
.code, .exercise { margin: 1.25rem 0; }
.code { border: 1px solid var(--rule); border-radius: 8px; background: var(--paper-2); overflow: hidden; }
.code-bar {
  display: flex; align-items: center; gap: .25rem; padding: .3rem .4rem .3rem .8rem;
  border-bottom: 1px solid var(--rule); font-family: var(--font-ui); font-size: .75rem; color: var(--ink-3);
}
.code-bar .lbl { letter-spacing: .1em; }
.spacer { flex: 1; }
pre.lean, pre.snippet {
  margin: 0; padding: .9rem 1rem; overflow-x: auto; font-size: .84rem; line-height: 1.65; tab-size: 2;
  background: var(--paper-2); color: var(--ink);
}
pre.snippet { border: 1px solid var(--rule); border-radius: 8px; margin: 1rem 0; }
pre code { font-family: inherit; background: none; border: 0; padding: 0; white-space: pre; }
.tk-k { color: var(--tok-kw); font-weight: 600; }
.tk-t { color: var(--tok-tac); }
.tk-ty { color: var(--tok-ty); }
.tk-c { color: var(--tok-com); font-style: italic; }
.tk-n { color: var(--tok-num); }
.tk-s { color: var(--tok-str); }
.tk-o { color: var(--tok-op); }
.tk-nm { color: var(--tok-name); font-weight: 600; }
.tk-sorry { color: var(--seal); background: var(--seal-soft); border-radius: 3px; padding: 0 .2em; font-weight: 600; }

/* buttons */
.btn, .btn-ghost {
  font-family: var(--font-ui); font-size: .82rem; line-height: 1.2; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; gap: .35rem; border-radius: 6px; white-space: nowrap;
}
.btn { padding: .5rem .85rem; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
.btn:hover { border-color: var(--ink-3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
.btn-ghost { padding: .3rem .55rem; border: 0; background: none; color: var(--ink-2); }
.btn-ghost:hover { background: var(--paper-3); color: var(--ink); }

/* exercise worksheet */
.exercise { border: 1.5px solid var(--ink-3); border-radius: 10px; background: var(--paper); overflow: hidden; }
.exercise.done { border-color: var(--ok); }
.ex-head { display: flex; align-items: center; gap: .6rem; padding: .55rem .6rem .55rem .9rem; font-family: var(--font-ui); font-size: .85rem; flex-wrap: wrap; }
.ex-tag { font-weight: 700; letter-spacing: .12em; color: var(--seal); }
.exercise.done .ex-tag { color: var(--ok); }
.ex-name { font-family: var(--font-code); }
.ex-done { font-family: var(--font-ui); font-size: .78rem; border: 1px solid var(--rule); background: var(--paper); color: var(--ink-2); border-radius: 999px; padding: .25rem .7rem; cursor: pointer; }
.ex-done[aria-pressed="true"] { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); font-weight: 600; }
.exercise pre.lean { border-block: 1px solid var(--rule); }
.ex-actions { display: flex; flex-wrap: wrap; gap: .5rem; padding: .7rem .9rem; }
details.solution { border-top: 1px dashed var(--rule); }
details.solution summary { cursor: pointer; padding: .6rem .9rem; font-family: var(--font-ui); font-size: .82rem; color: var(--ink-2); list-style: none; }
details.solution summary::-webkit-details-marker { display: none; }
details.solution summary::before { content: "▸"; display: inline-block; width: 1em; transition: transform .15s; }
details.solution[open] summary::before { transform: rotate(90deg); }
details.solution pre.lean { background: var(--ok-soft); border-top: 1px solid var(--rule); }

.toast { position: fixed; left: 50%; bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); font-family: var(--font-ui); font-size: .85rem; padding: .55rem 1rem; border-radius: 6px; z-index: 50; box-shadow: var(--shadow); }

/* chapter pager */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); font-family: var(--font-ui); }
.pager a { display: grid; gap: .15rem; padding: .9rem 1rem; border: 1px solid var(--rule); border-radius: 8px; text-decoration: none; color: var(--ink); min-width: 0; }
.pager a:hover { border-color: var(--accent); }
.pager small { color: var(--ink-3); font-size: .75rem; }
.pager .next { text-align: right; grid-column: 2; }

/* cover */
.cover-title { font-family: var(--font-head); font-weight: 900; font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1.15; letter-spacing: .02em; margin: .5rem 0 1rem; text-wrap: balance; }
.cover-title .eps { font-family: "STIX Two Text", serif; font-style: italic; font-weight: 400; color: var(--seal); }
.lede { font-size: 1.12rem; color: var(--ink-2); max-width: 38rem; margin: 0 0 1.75rem; }
.facts { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; font-family: var(--font-ui); font-size: .85rem; color: var(--ink-2); margin-bottom: 2rem; }
.facts b { font-family: "STIX Two Text", serif; font-size: 1.35rem; color: var(--ink); font-weight: 600; margin-right: .2rem; font-variant-numeric: tabular-nums; }

.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--paper-2); box-shadow: var(--shadow); }
.hero pre.lean { background: var(--paper-2); }
.infoview { border-left: 1px solid var(--rule); background: var(--paper); padding: .9rem 1rem; font-family: var(--font-code); font-size: .8rem; line-height: 1.65; min-width: 0; overflow-x: auto; }
.infoview .iv-h { font-family: var(--font-ui); font-size: .72rem; letter-spacing: .1em; color: var(--ink-3); margin-bottom: .5rem; }
.infoview .goal { white-space: pre; }
.infoview .turnstile { color: var(--seal); font-weight: 700; }
.hero-bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding: .7rem .9rem; border-top: 1px solid var(--rule); background: var(--paper); font-family: var(--font-ui); font-size: .82rem; color: var(--ink-2); }

.how { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin: 2.5rem 0; }
.how > div { border-top: 2px solid var(--ink); padding-top: .75rem; }
.how h3 { font-family: var(--font-head); font-size: 1.05rem; margin: 0 0 .35rem; }
.how p { margin: 0; color: var(--ink-2); font-size: .95rem; line-height: 1.7; }

.contents h2 { font-family: var(--font-head); font-size: 1.35rem; margin: 3rem 0 .75rem; }
.ch-list { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--rule); }
.ch-list a { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; gap: 1rem; align-items: center; padding: 1rem .25rem; border-bottom: 1px solid var(--rule); text-decoration: none; color: var(--ink); }
.ch-list a:hover .cl-title { color: var(--accent); }
.cl-num { width: 2.6rem; height: 2.6rem; display: grid; place-items: center; border: 1.5px solid var(--seal); border-radius: 4px; color: var(--seal); font-family: "STIX Two Text", serif; font-size: 1.35rem; }
.cl-title { font-family: var(--font-head); font-weight: 700; font-size: 1.08rem; line-height: 1.4; }
.cl-sum { display: block; color: var(--ink-2); font-size: .9rem; line-height: 1.55; margin-top: .15rem; }
.cl-prog { font-family: var(--font-ui); font-size: .78rem; color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cl-prog .bar { width: 4.5rem; height: 4px; border-radius: 2px; background: var(--paper-3); margin-top: .35rem; overflow: hidden; }
.cl-prog .bar i { display: block; height: 100%; background: var(--ok); }
.colophon { margin-top: 3rem; font-family: var(--font-ui); font-size: .8rem; color: var(--ink-3); line-height: 1.7; }

/* widgets */
.widget { margin: 1.5rem 0; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); overflow: hidden; font-family: var(--font-ui); }
.w-head { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding: .7rem .9rem; border-bottom: 1px solid var(--rule); background: var(--paper-2); font-size: .85rem; }
.w-head b { font-family: var(--font-head); font-size: .95rem; }
.w-controls { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: center; padding: .7rem .9rem; font-size: .85rem; color: var(--ink-2); }
.w-controls label { display: inline-flex; align-items: center; gap: .5rem; }
.w-controls input[type="range"] { width: min(14rem, 50vw); accent-color: var(--accent); }
.w-controls select { font: inherit; padding: .25rem .4rem; border: 1px solid var(--rule); border-radius: 5px; background: var(--paper); color: var(--ink); }
.w-canvas { display: block; width: 100%; height: 260px; }
.w-read { padding: .65rem .9rem; border-top: 1px solid var(--rule); font-size: .88rem; color: var(--ink); line-height: 1.6; font-variant-numeric: tabular-nums; }
.w-read .bad { color: var(--seal); font-weight: 600; }
.w-read .good { color: var(--ok); font-weight: 600; }

/* narrow screens: rail becomes a drawer under a sticky top bar */
@media (max-width: 960px) {
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
  #topbar {
    display: flex; align-items: center; gap: .75rem; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25;
    padding-block: .55rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--paper); border-bottom: 1px solid var(--rule); font-family: var(--font-ui); font-size: .9rem;
  }
  #topbar .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  #rail { transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--shadow); width: min(19rem, 86vw); }
  body.menu-open #rail { transform: none; }
  body.menu-open #scrim { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .3); z-index: 15; }
  main { margin-left: 0; padding-block: 1.5rem 5rem; }
}
@media (max-width: 640px) {
  body { font-size: 16px; }
  .hero { grid-template-columns: minmax(0, 1fr); }

<script type="application/json" id="book-data">{"chapters":[{"id":"ch00","num":0,"title":"欢迎：用 Lean 学数学分析","summary":"如何使用本书；norm_num、ring、linarith 等第一批策略。","file":"Analysis/Ch00_Welcome.lean","exercises":6,"source":"import Mathlib\n\n/-!\n# 第 0 章　欢迎：用 Lean 学数学分析\n\n数学分析是大学数学的第一道门槛。困难往往不在于计算，而在于**严格性**：\n\"任给 $\\varepsilon > 0$，存在 $N$，使得当 $n \\ge N$ 时……\"这样的句子，\n每一个量词的顺序、每一步不等式的放缩，都必须准确无误。\n\n传统的学习方式里，你写下证明，等老师批改后才知道哪里有漏洞。\n在本书中，你将使用 **Lean 4** —— 一个**交互式定理证明器**。\n它就像一位不知疲倦的助教：\n\n* 你每写一步，它立刻告诉你**当前还需要证明什么**（称为\"目标\"，goal）；\n* 证明中只要有一处跳步、一处符号错误，它都会**当场指出**；\n* 当屏幕上出现 `No goals`，你就**确定无疑地**完成了证明。\n\n本书的数学内容对应一门标准的\"数学分析（一）\"入门课：实数、数列极限、\n函数连续性、闭区间上连续函数的性质、导数与中值定理。我们使用 Lean 的数学库\n**Mathlib**，它已经定义好了实数 `ℝ` 以及大量基础结论。\n\n## 0.1 如何使用本书\n\n本书的每一章都是一个**可以运行的 Lean 文件**。文字讲解写在注释里，\n代码可以直接被 Lean 检查。你有两种方式阅读与练习：\n\n1. **在浏览器中**（推荐初学者）：在网页版教材中点击\"在线运行\"按钮，\n   代码会在 [Lean 4 Web](https://live.lean-lang.org) 中打开，无需安装任何东西。\n   首次加载 Mathlib 需要等待十几秒。\n2. **在本地**：安装 VS Code 与 Lean 4 扩展，克隆本项目，运行\n   `lake exe cache get` 下载预编译的 Mathlib，然后打开 `Analysis/` 目录下的章节文件。\n\n每章包含三种内容：\n\n* **讲解**：定义、定理与思路；\n* **例题**：已经写好的完整证明，请把光标放在每一行上，观察右侧目标的变化；\n* **练习**：以 `sorry` 结尾的证明。`sorry` 的意思是\"这里暂时先承认\"，\n  你的任务就是把它替换成真正的证明。练习的参考答案位于 `Analysis/Solutions/` 目录，\n  网页版中可以点击\"查看参考答案\"。\n\n> **提示**　不要急着看答案！Lean 的报错信息本身就是最好的老师。\n> 卡住时，先看清目标（`⊢` 后面的部分）是什么，再想用哪个策略。\n\n## 0.2 第一个证明\n\n下面是一个最简单的定理。`example` 表示\"一个不需要起名字的定理\"，\n冒号后面是要证明的命题，`:= by` 之后是证明，由一个个**策略**（tactic）组成。\n\n`(2 : ℝ)` 的意思是\"把 2 看作实数\"。如果不写，Lean 会默认它是自然数。\n-/\n\nexample : (2 : ℝ) + 2 = 4 := by\n  norm_num\n\n/-!\n把光标放在 `by` 后面，你会看到目标\n\n```text\n⊢ 2 + 2 = 4\n```\n\n`norm_num` 是一个专门处理**具体数值计算**的策略。执行之后目标消失，显示 `No goals`。\n\n## 0.3 代数恒等式：`ring`\n\n`ring` 策略可以证明任何**交换环中的恒等式**——也就是只用加、减、乘和乘方，\n展开后两边相同的等式。这省去了大量繁琐的展开与合并同类项。\n-/\n\nexample (a b : ℝ) : (a + b) ^ 2 = a ^ 2 + 2 * a * b + b ^ 2 := by\n  ring\n\nexample (x : ℝ) : (x - 1) * (x + 1) = x ^ 2 - 1 := by\n  ring\n\n/-!\n## 0.4 使用假设：`rw` 与 `exact`\n\n括号里的 `(h₁ : a = b)` 是一个**假设**：名字是 `h₁`，内容是 `a = b`。\n（`h₁` 中的下标可以输入 `h\\1` 得到。）\n\n* `rw [h₁]` 把目标中所有的 `a` **改写**成 `b`；\n* `exact h` 表示\"目标恰好就是假设 `h`\"。\n-/\n\nexample (a b c : ℝ) (h₁ : a = b) (h₂ : b = c) : a = c := by\n  rw [h₁]\n  exact h₂\n\n/-!\n## 0.5 线性不等式：`linarith`\n\n数学分析中最常见的论证是**不等式的串联**。`linarith` 可以自动完成\n\"由若干个线性不等式（或等式）推出另一个线性不等式\"的推理。\n它会自动使用上下文中所有的假设。\n-/\n\nexample (x y : ℝ) (h₁ : x \u003c y) (h₂ : y ≤ 3) : x \u003c 3 := by\n  linarith\n\nexample (ε : ℝ) (hε : 0 \u003c ε) : ε / 2 \u003c ε := by\n  linarith\n\n/-!\n`linarith` 只会做**线性**推理。若需要先得到某个非线性的事实，\n可以用 `have` 先证明它，再交给 `linarith`。\n`mul_nonneg` 是 Mathlib 中的一个定理：两个非负数的乘积非负。\n-/\n\nexample (a b : ℝ) (ha : 0 ≤ a) (hb : 0 ≤ b) : a ≤ a * b + a := by\n  have h : 0 ≤ a * b := mul_nonneg ha hb\n  linarith\n\n/-!\n## 0.6 正性：`positivity`\n\n分析中经常需要说明某个量是正的，比如 $\\varepsilon / 2 > 0$、$x^2 + 1 > 0$。\n`positivity` 专门证明形如 `0 \u003c e` 或 `0 ≤ e` 的目标。\n-/\n\nexample (x : ℝ) : 0 \u003c x ^ 2 + 1 := by\n  positivity\n\nexample (ε : ℝ) (hε : 0 \u003c ε) : 0 \u003c ε / 3 := by\n  positivity\n\n/-!\n## 0.7 链式推导：`calc`\n\n手写证明时我们常写 $a = b \\le c \u003c d$。Lean 中对应的是 `calc`，\n每一步后面用 `:= by ...` 给出理由。这是本书中最常用的书写格式之一。\n-/\n\nexample (a b : ℝ) (hab : a ≤ b) : a + 1 \u003c b + 2 := by\n  calc a + 1 ≤ b + 1 := by linarith\n    _ \u003c b + 2 := by linarith\n\n/-!\n## 练习\n\n下面每个练习都以 `sorry` 结束。把 `sorry` 删掉，换成你的证明。\n每道题都只需要本章介绍过的策略。\n\n### 练习 0.1\n用 `ring` 证明一个代数恒等式。\n-/\n\ntheorem ex0_1 (x : ℝ) : (x + 1) ^ 2 - 1 = x * (x + 2) := by\n  sorry\n\n/-!\n### 练习 0.2\n先用 `rw` 代入，再计算。\n-/\n\ntheorem ex0_2 (a b : ℝ) (h₁ : a = 2 * b) (h₂ : b = 3) : a = 6 := by\n  sorry\n\n/-!\n### 练习 0.3\n解一个二元一次方程组：由两个等式推出 $x = 2$。\n-/\n\ntheorem ex0_3 (x y : ℝ) (h₁ : 2 * x + y = 5) (h₂ : x - y = 1) : x = 2 := by\n  sorry\n\n/-!\n### 练习 0.4\n这个等式是\"$\\varepsilon/2$ 技巧\"的基础，后面会反复用到。\n-/\n\ntheorem ex0_4 (ε : ℝ) : ε / 2 + ε / 2 = ε := by\n  sorry\n\n/-!\n### 练习 0.5\n用 `calc` 写出一条不等式链。\n-/\n\ntheorem ex0_5 (x y : ℝ) (hx : x \u003c 1) (hy : y \u003c 2) : x + y \u003c 4 := by\n  sorry\n\n/-!\n### 练习 0.6\n提示：先用 `have` 得到 $0 \\le (a-b)^2$（Mathlib 中的 `sq_nonneg (a - b)`），\n再思考如何把它变形为目标。（`nlinarith` 是 `linarith` 的非线性加强版，\n你也可以试试 `nlinarith [sq_nonneg (a - b)]`。）\n-/\n\ntheorem ex0_6 (a b : ℝ) : 2 * a * b ≤ a ^ 2 + b ^ 2 := by\n  sorry\n\n/-!\n## 本章小结\n\n| 策略 | 作用 |\n|------|------|\n| `norm_num` | 具体数值计算 |\n| `ring` | 交换环恒等式 |\n| `rw [h]` | 用等式 `h` 改写目标 |\n| `exact h` | 目标恰好是 `h` |\n| `linarith` | 线性不等式推理 |\n| `nlinarith [...]` | 非线性不等式推理（可提供辅助事实） |\n| `positivity` | 证明 `0 \u003c e` 或 `0 ≤ e` |\n| `have h : P := ...` | 引入中间结论 |\n| `calc` | 链式推导 |\n\n下一章，我们学习如何处理\"对任意\"\"存在\"\"并且\"\"或者\"\"非\"这些逻辑结构——\n它们是 $\\varepsilon$-$N$ 语言的骨架。\n-/\n","blocks":[{"t":"p","html":"\u003cp>数学分析是大学数学的第一道门槛。困难往往不在于计算，而在于\u003cstrong>严格性\u003c/strong>：&quot;任给 \u003cspan class=\"math\" data-tex=\"\\varepsilon &gt; 0\">ε &gt; 0\u003c/span>，存在 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span>，使得当 \u003cspan class=\"math\" data-tex=\"n \\ge N\">\u003ci>n\u003c/i> ≥ \u003ci>N\u003c/i>\u003c/span> 时……&quot;这样的句子，每一个量词的顺序、每一步不等式的放缩，都必须准确无误。\u003c/p>\n\u003cp>传统的学习方式里，你写下证明，等老师批改后才知道哪里有漏洞。在本书中，你将使用 \u003cstrong>Lean 4\u003c/strong> —— 一个\u003cstrong>交互式定理证明器\u003c/strong>。它就像一位不知疲倦的助教：\u003c/p>\n\u003cul>\u003cli>你每写一步，它立刻告诉你\u003cstrong>当前还需要证明什么\u003c/strong>（称为&quot;目标&quot;，goal）；\u003c/li>\u003cli>证明中只要有一处跳步、一处符号错误，它都会\u003cstrong>当场指出\u003c/strong>；\u003c/li>\u003cli>当屏幕上出现 \u003ccode>No goals\u003c/code>，你就\u003cstrong>确定无疑地\u003c/strong>完成了证明。\u003c/li>\u003c/ul>\n\u003cp>本书的数学内容对应一门标准的&quot;数学分析（一）&quot;入门课：实数、数列极限、函数连续性、闭区间上连续函数的性质、导数与中值定理。我们使用 Lean 的数学库\u003cstrong>Mathlib\u003c/strong>，它已经定义好了实数 \u003ccode>ℝ\u003c/code> 以及大量基础结论。\u003c/p>\n\u003ch2 id=\"ch00-s1\">0.1 如何使用本书\u003c/h2>\n\u003cp>本书的每一章都是一个\u003cstrong>可以运行的 Lean 文件\u003c/strong>。文字讲解写在注释里，代码可以直接被 Lean 检查。你有两种方式阅读与练习：\u003c/p>\n\u003col>\u003cli>\u003cstrong>在浏览器中\u003c/strong>（推荐初学者）：在网页版教材中点击&quot;在线运行&quot;按钮，代码会在 \u003ca href=\"https://live.lean-lang.org\" target=\"_blank\" rel=\"noopener\">Lean 4 Web\u003c/a> 中打开，无需安装任何东西。首次加载 Mathlib 需要等待十几秒。\u003c/li>\u003cli>\u003cstrong>在本地\u003c/strong>：安装 VS Code 与 Lean 4 扩展，克隆本项目，运行\u003ccode>lake exe cache get\u003c/code> 下载预编译的 Mathlib，然后打开 \u003ccode>Analysis/\u003c/code> 目录下的章节文件。\u003c/li>\u003c/ol>\n\u003cp>每章包含三种内容：\u003c/p>\n\u003cul>\u003cli>\u003cstrong>讲解\u003c/strong>：定义、定理与思路；\u003c/li>\u003cli>\u003cstrong>例题\u003c/strong>：已经写好的完整证明，请把光标放在每一行上，观察右侧目标的变化；\u003c/li>\u003cli>\u003cstrong>练习\u003c/strong>：以 \u003ccode>sorry\u003c/code> 结尾的证明。\u003ccode>sorry\u003c/code> 的意思是&quot;这里暂时先承认&quot;，你的任务就是把它替换成真正的证明。练习的参考答案位于 \u003ccode>Analysis/Solutions/\u003c/code> 目录，网页版中可以点击&quot;查看参考答案&quot;。\u003c/li>\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003cp>\u003cstrong>提示\u003c/strong>　不要急着看答案！Lean 的报错信息本身就是最好的老师。卡住时，先看清目标（\u003ccode>⊢\u003c/code> 后面的部分）是什么，再想用哪个策略。\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"ch00-s2\">0.2 第一个证明\u003c/h2>\n\u003cp>下面是一个最简单的定理。\u003ccode>example\u003c/code> 表示&quot;一个不需要起名字的定理&quot;，冒号后面是要证明的命题，\u003ccode>:= by\u003c/code> 之后是证明，由一个个\u003cstrong>策略\u003c/strong>（tactic）组成。\u003c/p>\n\u003cp>\u003ccode>(2 : ℝ)\u003c/code> 的意思是&quot;把 2 看作实数&quot;。如果不写，Lean 会默认它是自然数。\u003c/p>"},{"t":"c","code":"example : (2 : ℝ) + 2 = 4 := by\n  norm_num","upto":1265},{"t":"p","html":"\u003cp>把光标放在 \u003ccode>by\u003c/code> 后面，你会看到目标\u003c/p>\n\u003cpre class=\"snippet\">\u003ccode>⊢ 2 + 2 = 4\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>norm_num\u003c/code> 是一个专门处理\u003cstrong>具体数值计算\u003c/strong>的策略。执行之后目标消失，显示 \u003ccode>No goals\u003c/code>。\u003c/p>\n\u003ch2 id=\"ch00-s3\">0.3 代数恒等式：\u003ccode>ring\u003c/code>\u003c/h2>\n\u003cp>\u003ccode>ring\u003c/code> 策略可以证明任何\u003cstrong>交换环中的恒等式\u003c/strong>——也就是只用加、减、乘和乘方，展开后两边相同的等式。这省去了大量繁琐的展开与合并同类项。\u003c/p>"},{"t":"c","code":"example (a b : ℝ) : (a + b) ^ 2 = a ^ 2 + 2 * a * b + b ^ 2 := by\n  ring\n\nexample (x : ℝ) : (x - 1) * (x + 1) = x ^ 2 - 1 := by\n  ring","upto":1608},{"t":"p","html":"\u003ch2 id=\"ch00-s4\">0.4 使用假设：\u003ccode>rw\u003c/code> 与 \u003ccode>exact\u003c/code>\u003c/h2>\n\u003cp>括号里的 \u003ccode>(h₁ : a = b)\u003c/code> 是一个\u003cstrong>假设\u003c/strong>：名字是 \u003ccode>h₁\u003c/code>，内容是 \u003ccode>a = b\u003c/code>。（\u003ccode>h₁\u003c/code> 中的下标可以输入 \u003ccode>h\\1\u003c/code> 得到。）\u003c/p>\n\u003cul>\u003cli>\u003ccode>rw [h₁]\u003c/code> 把目标中所有的 \u003ccode>a\u003c/code> \u003cstrong>改写\u003c/strong>成 \u003ccode>b\u003c/code>；\u003c/li>\u003cli>\u003ccode>exact h\u003c/code> 表示&quot;目标恰好就是假设 \u003ccode>h\u003c/code>&quot;。\u003c/li>\u003c/ul>"},{"t":"c","code":"example (a b c : ℝ) (h₁ : a = b) (h₂ : b = c) : a = c := by\n  rw [h₁]\n  exact h₂","upto":1872},{"t":"p","html":"\u003ch2 id=\"ch00-s5\">0.5 线性不等式：\u003ccode>linarith\u003c/code>\u003c/h2>\n\u003cp>数学分析中最常见的论证是\u003cstrong>不等式的串联\u003c/strong>。\u003ccode>linarith\u003c/code> 可以自动完成&quot;由若干个线性不等式（或等式）推出另一个线性不等式&quot;的推理。它会自动使用上下文中所有的假设。\u003c/p>"},{"t":"c","code":"example (x y : ℝ) (h₁ : x \u003c y) (h₂ : y ≤ 3) : x \u003c 3 := by\n  linarith\n\nexample (ε : ℝ) (hε : 0 \u003c ε) : ε / 2 \u003c ε := by\n  linarith","upto":2123},{"t":"p","html":"\u003cp>\u003ccode>linarith\u003c/code> 只会做\u003cstrong>线性\u003c/strong>推理。若需要先得到某个非线性的事实，可以用 \u003ccode>have\u003c/code> 先证明它，再交给 \u003ccode>linarith\u003c/code>。\u003ccode>mul_nonneg\u003c/code> 是 Mathlib 中的一个定理：两个非负数的乘积非负。\u003c/p>"},{"t":"c","code":"example (a b : ℝ) (ha : 0 ≤ a) (hb : 0 ≤ b) : a ≤ a * b + a := by\n  have h : 0 ≤ a * b := mul_nonneg ha hb\n  linarith","upto":2363},{"t":"p","html":"\u003ch2 id=\"ch00-s6\">0.6 正性：\u003ccode>positivity\u003c/code>\u003c/h2>\n\u003cp>分析中经常需要说明某个量是正的，比如 \u003cspan class=\"math\" data-tex=\"\\varepsilon / 2 &gt; 0\">ε / 2 &gt; 0\u003c/span>、\u003cspan class=\"math\" data-tex=\"x^2 + 1 &gt; 0\">\u003ci>x\u003c/i>\u003csup>2\u003c/sup> + 1 &gt; 0\u003c/span>。\u003ccode>positivity\u003c/code> 专门证明形如 \u003ccode>0 &lt; e\u003c/code> 或 \u003ccode>0 ≤ e\u003c/code> 的目标。\u003c/p>"},{"t":"c","code":"example (x : ℝ) : 0 \u003c x ^ 2 + 1 := by\n  positivity\n\nexample (ε : ℝ) (hε : 0 \u003c ε) : 0 \u003c ε / 3 := by\n  positivity","upto":2607},{"t":"p","html":"\u003ch2 id=\"ch00-s7\">0.7 链式推导：\u003ccode>calc\u003c/code>\u003c/h2>\n\u003cp>手写证明时我们常写 \u003cspan class=\"math\" data-tex=\"a = b \\le c &lt; d\">\u003ci>a\u003c/i> = \u003ci>b\u003c/i> ≤ \u003ci>c\u003c/i> &lt; \u003ci>d\u003c/i>\u003c/span>。Lean 中对应的是 \u003ccode>calc\u003c/code>，每一步后面用 \u003ccode>:= by ...\u003c/code> 给出理由。这是本书中最常用的书写格式之一。\u003c/p>"},{"t":"c","code":"example (a b : ℝ) (hab : a ≤ b) : a + 1 \u003c b + 2 := by\n  calc a + 1 ≤ b + 1 := by linarith\n    _ \u003c b + 2 := by linarith","upto":2843},{"t":"p","html":"\u003ch2 id=\"ch00-s8\">练习\u003c/h2>\n\u003cp>下面每个练习都以 \u003ccode>sorry\u003c/code> 结束。把 \u003ccode>sorry\u003c/code> 删掉，换成你的证明。每道题都只需要本章介绍过的策略。\u003c/p>\n\u003ch3 id=\"ch00-s9\">练习 0.1\u003c/h3>\n\u003cp>用 \u003ccode>ring\u003c/code> 证明一个代数恒等式。\u003c/p>"},{"t":"c","code":"theorem ex0_1 (x : ℝ) : (x + 1) ^ 2 - 1 = x * (x + 2) := by\n  sorry","upto":3017,"ex":{"id":"ch00:ex0_1","name":"ex0_1","solution":"theorem ex0_1 (x : ℝ) : (x + 1) ^ 2 - 1 = x * (x + 2) := by\n  ring"}},{"t":"p","html":"\u003ch3 id=\"ch00-s10\">练习 0.2\u003c/h3>\n\u003cp>先用 \u003ccode>rw\u003c/code> 代入，再计算。\u003c/p>"},{"t":"c","code":"theorem ex0_2 (a b : ℝ) (h₁ : a = 2 * b) (h₂ : b = 3) : a = 6 := by\n  sorry","upto":3129,"ex":{"id":"ch00:ex0_2","name":"ex0_2","solution":"theorem ex0_2 (a b : ℝ) (h₁ : a = 2 * b) (h₂ : b = 3) : a = 6 := by\n  rw [h₁, h₂]\n  norm_num"}},{"t":"p","html":"\u003ch3 id=\"ch00-s11\">练习 0.3\u003c/h3>\n\u003cp>解一个二元一次方程组：由两个等式推出 \u003cspan class=\"math\" data-tex=\"x = 2\">\u003ci>x\u003c/i> = 2\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem ex0_3 (x y : ℝ) (h₁ : 2 * x + y = 5) (h₂ : x - y = 1) : x = 2 := by\n  sorry","upto":3261,"ex":{"id":"ch00:ex0_3","name":"ex0_3","solution":"theorem ex0_3 (x y : ℝ) (h₁ : 2 * x + y = 5) (h₂ : x - y = 1) : x = 2 := by\n  linarith"}},{"t":"p","html":"\u003ch3 id=\"ch00-s12\">练习 0.4\u003c/h3>\n\u003cp>这个等式是&quot;\u003cspan class=\"math\" data-tex=\"\\varepsilon/2\">ε/2\u003c/span> 技巧&quot;的基础，后面会反复用到。\u003c/p>"},{"t":"c","code":"theorem ex0_4 (ε : ℝ) : ε / 2 + ε / 2 = ε := by\n  sorry","upto":3375,"ex":{"id":"ch00:ex0_4","name":"ex0_4","solution":"theorem ex0_4 (ε : ℝ) : ε / 2 + ε / 2 = ε := by\n  ring"}},{"t":"p","html":"\u003ch3 id=\"ch00-s13\">练习 0.5\u003c/h3>\n\u003cp>用 \u003ccode>calc\u003c/code> 写出一条不等式链。\u003c/p>"},{"t":"c","code":"theorem ex0_5 (x y : ℝ) (hx : x \u003c 1) (hy : y \u003c 2) : x + y \u003c 4 := by\n  sorry","upto":3490,"ex":{"id":"ch00:ex0_5","name":"ex0_5","solution":"theorem ex0_5 (x y : ℝ) (hx : x \u003c 1) (hy : y \u003c 2) : x + y \u003c 4 := by\n  calc x + y \u003c 1 + 2 := by linarith\n    _ \u003c 4 := by norm_num"}},{"t":"p","html":"\u003ch3 id=\"ch00-s14\">练习 0.6\u003c/h3>\n\u003cp>提示：先用 \u003ccode>have\u003c/code> 得到 \u003cspan class=\"math\" data-tex=\"0 \\le (a-b)^2\">0 ≤ (\u003ci>a\u003c/i>−\u003ci>b\u003c/i>)\u003csup>2\u003c/sup>\u003c/span>（Mathlib 中的 \u003ccode>sq_nonneg (a - b)\u003c/code>），再思考如何把它变形为目标。（\u003ccode>nlinarith\u003c/code> 是 \u003ccode>linarith\u003c/code> 的非线性加强版，你也可以试试 \u003ccode>nlinarith [sq_nonneg (a - b)]\u003c/code>。）\u003c/p>"},{"t":"c","code":"theorem ex0_6 (a b : ℝ) : 2 * a * b ≤ a ^ 2 + b ^ 2 := by\n  sorry","upto":3730,"ex":{"id":"ch00:ex0_6","name":"ex0_6","solution":"theorem ex0_6 (a b : ℝ) : 2 * a * b ≤ a ^ 2 + b ^ 2 := by\n  have h : 0 ≤ (a - b) ^ 2 := sq_nonneg (a - b)\n  nlinarith [h]"}},{"t":"p","html":"\u003ch2 id=\"ch00-s15\">本章小结\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>策略\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>norm_num\u003c/code>\u003c/td>\u003ctd>具体数值计算\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ring\u003c/code>\u003c/td>\u003ctd>交换环恒等式\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>rw [h]\u003c/code>\u003c/td>\u003ctd>用等式 \u003ccode>h\u003c/code> 改写目标\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>exact h\u003c/code>\u003c/td>\u003ctd>目标恰好是 \u003ccode>h\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>linarith\u003c/code>\u003c/td>\u003ctd>线性不等式推理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>nlinarith [...]\u003c/code>\u003c/td>\u003ctd>非线性不等式推理（可提供辅助事实）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>positivity\u003c/code>\u003c/td>\u003ctd>证明 \u003ccode>0 &lt; e\u003c/code> 或 \u003ccode>0 ≤ e\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>have h : P := ...\u003c/code>\u003c/td>\u003ctd>引入中间结论\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>calc\u003c/code>\u003c/td>\u003ctd>链式推导\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>下一章，我们学习如何处理&quot;对任意&quot;&quot;存在&quot;&quot;并且&quot;&quot;或者&quot;&quot;非&quot;这些逻辑结构——它们是 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>-\u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span> 语言的骨架。\u003c/p>"}]},{"id":"ch01","num":1,"title":"逻辑：命题、量词与证明","summary":"蕴含、合取、析取、量词与否定：ε-N 语言的骨架。","file":"Analysis/Ch01_Logic.lean","exercises":8,"source":"import Mathlib\n\n/-!\n# 第 1 章　逻辑：命题、量词与证明\n\n数列极限的定义是\n\n$$\\forall \\varepsilon > 0,\\ \\exists N,\\ \\forall n \\ge N,\\ |a_n - L| \u003c \\varepsilon.$$\n\n这一句话里有三个量词、一个蕴含和一个不等式。要熟练地证明分析中的定理，\n首先要熟练地**拆解**和**构造**这些逻辑结构。本章介绍每一种逻辑联结词在\nLean 中对应的策略。\n\n在 Lean 中，命题的类型是 `Prop`。`P : Prop` 表示\"$P$ 是一个命题\"，\n`h : P` 表示\"$h$ 是 $P$ 的一个证明\"。\n\n## 1.1 蕴含 `→`\n\n* **证明** $P \\to Q$：用 `intro h` 假设 $P$ 成立（得到 `h : P`），然后证明 $Q$。\n* **使用** `h : P → Q`：如果目标是 $Q$，`apply h` 会把目标变成 $P$；\n  也可以直接写 `h hp` 得到 $Q$ 的证明（这里 `hp : P`）。\n-/\n\nnamespace Ch01\n\nexample (P Q : Prop) (hP : P) (hPQ : P → Q) : Q := by\n  apply hPQ\n  exact hP\n\nexample (P Q : Prop) (hQ : Q) : P → Q := by\n  intro _hP\n  exact hQ\n\n/-!\n## 1.2 合取 `∧`（并且）\n\n* **证明** $P \\land Q$：`constructor` 把目标拆成两个，分别证明 $P$ 与 $Q$。\n  两个子目标用 `·` 分开书写（输入 `\\.`）。\n* **使用** `h : P ∧ Q`：`obtain ⟨hP, hQ⟩ := h` 把它拆成两个假设。\n  也可以用 `h.1` 和 `h.2`。（尖括号 `⟨ ⟩` 输入 `\\\u003c` 和 `\\>`。）\n-/\n\nexample (x : ℝ) (h : 0 \u003c x ∧ x \u003c 1) : x ^ 2 \u003c 1 := by\n  obtain ⟨h₀, h₁⟩ := h\n  nlinarith\n\nexample (x : ℝ) (hx : 2 \u003c x) : 0 \u003c x ∧ 1 \u003c x := by\n  constructor\n  · linarith\n  · linarith\n\n/-!\n## 1.3 析取 `∨`（或者）\n\n* **证明** $P \\lor Q$：用 `left` 选择证明 $P$，或用 `right` 选择证明 $Q$。\n* **使用** `h : P ∨ Q`：`rcases h with hP | hQ` 进行**分类讨论**，\n  得到两个目标，分别在 $P$ 成立和 $Q$ 成立的情况下证明。\n-/\n\nexample (x : ℝ) (h : x \u003c -1 ∨ 1 \u003c x) : 1 \u003c x ^ 2 := by\n  rcases h with h | h\n  · nlinarith\n  · nlinarith\n\n/-!\n`le_or_gt a b : a ≤ b ∨ b \u003c a` 是一个非常有用的定理，它让我们可以对任意两个实数\n进行分类讨论。\n-/\n\nexample (x : ℝ) : 0 ≤ x ^ 2 := by\n  rcases le_or_gt 0 x with h | h\n  · positivity\n  · nlinarith\n\n/-!\n## 1.4 全称量词 `∀`（对任意）\n\n* **证明** $\\forall x, P(x)$：`intro x`，然后对这个\"任意的\" $x$ 证明 $P(x)$。\n* **使用** `h : ∀ x, P x`：`h a` 就是 $P(a)$ 的证明。也可以 `specialize h a`。\n\n注意：$\\forall \\varepsilon > 0, P(\\varepsilon)$ 是 $\\forall \\varepsilon, \\varepsilon > 0 \\to P(\\varepsilon)$\n的缩写，因此要用 `intro ε hε` 引入**两个**东西。\n-/\n\nexample (f : ℝ → ℝ) (h : ∀ x, f x ≤ 3) : f 1 + f 2 ≤ 6 := by\n  have h1 := h 1\n  have h2 := h 2\n  linarith\n\nexample : ∀ ε > (0 : ℝ), ε / 2 \u003c ε := by\n  intro ε hε\n  linarith\n\n/-!\n## 1.5 存在量词 `∃`（存在）\n\n* **证明** $\\exists x, P(x)$：用 `use a` 给出一个具体的 $a$，然后证明 $P(a)$。\n  **构造一个合适的对象**——这是分析证明中最需要创造力的一步。\n* **使用** `h : ∃ x, P x`：`obtain ⟨x, hx⟩ := h` 取出这样一个 $x$ 以及 `hx : P x`。\n-/\n\nexample : ∃ x : ℝ, x ^ 2 = 4 := by\n  use 2\n  norm_num\n\nexample (f : ℝ → ℝ) (h : ∃ x, f x > 5) : ∃ x, f x > 4 := by\n  obtain ⟨x, hx⟩ := h\n  use x\n  linarith\n\n/-!\n## 1.6 否定 `¬` 与 `push Not`\n\n在 Lean 中 $\\lnot P$ 定义为 $P \\to \\text{False}$。因此：\n\n* **证明** $\\lnot P$：`intro h` 假设 $P$，推出矛盾（目标是 `False`）。\n* `by_contra h`：**反证法**，假设目标的否定，推出 `False`。\n* `push Not`：把否定号\"推进\"量词内部，例如\n  $\\lnot (\\forall x, P x)$ 变为 $\\exists x, \\lnot P x$，\n  $\\lnot (a \\le b)$ 变为 $b \u003c a$。\n\n写出一个命题的**否定**，是分析中最基本也最容易出错的技能。\n`push Not` 可以帮你检查自己写得对不对。\n（在较旧版本的 Mathlib 中，这个策略叫做 `push_neg`。）\n-/\n\nexample (f : ℝ → ℝ) : ¬ (∀ x, f x ≤ 0) ↔ ∃ x, 0 \u003c f x := by\n  push Not\n  rfl\n\n/-!\n## 1.7 分析中的第一个定义：有上界的函数\n\n我们说函数 $f$ **有上界**，如果存在 $M$ 使得对一切 $x$ 都有 $f(x) \\le M$。\n\n下面用 `def` 给出这个定义。之后 Lean 会把 `BddAboveFn f` 理解为\n`∃ M, ∀ x, f x ≤ M`，所以可以对它使用 `obtain`、`use` 等策略。\n-/\n\n/-- 函数 `f` 有上界。 -/\ndef BddAboveFn (f : ℝ → ℝ) : Prop :=\n  ∃ M, ∀ x, f x ≤ M\n\n/-!\n> **定理 1.1**　若 $f$ 与 $g$ 都有上界，则 $f + g$ 也有上界。\n\n**证明思路**：设 $f \\le M$，$g \\le N$，则 $f + g \\le M + N$。\n注意 Lean 证明的结构与手写证明完全对应：取出 $M$、取出 $N$、给出 $M + N$、\n对任意 $x$ 验证不等式。\n-/\n\ntheorem bddAboveFn_add {f g : ℝ → ℝ} (hf : BddAboveFn f) (hg : BddAboveFn g) :\n    BddAboveFn (fun x ↦ f x + g x) := by\n  obtain ⟨M, hM⟩ := hf\n  obtain ⟨N, hN⟩ := hg\n  use M + N\n  intro x\n  have h1 := hM x\n  have h2 := hN x\n  show f x + g x ≤ M + N\n  linarith\n\n/-!\n上面的 `show` 把目标 `(fun x ↦ f x + g x) x ≤ M + N` 写成更易读的等价形式\n`f x + g x ≤ M + N`（两者只差一步代入，Lean 能自动识别）。\n\n> **定理 1.2**　恒等函数 $x \\mapsto x$ 没有上界。\n\n**证明**：假设有上界 $M$，取 $x = M + 1$，得到 $M + 1 \\le M$，矛盾。\n-/\n\ntheorem not_bddAboveFn_id : ¬ BddAboveFn (fun x ↦ x) := by\n  intro h\n  obtain ⟨M, hM⟩ := h\n  have h1 : M + 1 ≤ M := hM (M + 1)\n  linarith\n\n/-!\n## 练习\n\n### 练习 1.1　蕴含的传递性\n-/\n\ntheorem ex1_1 (P Q R : Prop) (hPQ : P → Q) (hQR : Q → R) : P → R := by\n  sorry\n\n/-!\n### 练习 1.2　合取的交换律\n-/\n\ntheorem ex1_2 (P Q : Prop) : P ∧ Q → Q ∧ P := by\n  sorry\n\n/-!\n### 练习 1.3　析取的交换律\n-/\n\ntheorem ex1_3 (P Q : Prop) : P ∨ Q → Q ∨ P := by\n  sorry\n\n/-!\n### 练习 1.4　实数没有最大元\n对任意实数 $x$，都存在比它更大的实数。\n-/\n\ntheorem ex1_4 : ∀ x : ℝ, ∃ y : ℝ, x \u003c y := by\n  sorry\n\n/-!\n### 练习 1.5　量词的顺序\n\"存在一个 $x$ 对所有 $y$ 都成立\"蕴含\"对每个 $y$ 都存在 $x$ 成立\"。\n（反过来对吗？想一想 $P(x, y) := x > y$。）\n-/\n\ntheorem ex1_5 (P : ℝ → ℝ → Prop) (h : ∃ x, ∀ y, P x y) : ∀ y, ∃ x, P x y := by\n  sorry\n\n/-!\n### 练习 1.6　有上界的数乘\n若 $f$ 有上界且 $c \\ge 0$，则 $c f$ 也有上界。\n\n提示：Mathlib 中的 `mul_le_mul_of_nonneg_left : b ≤ c → 0 ≤ a → a * b ≤ a * c`。\n-/\n\ntheorem ex1_6 {f : ℝ → ℝ} {c : ℝ} (hc : 0 ≤ c) (hf : BddAboveFn f) :\n    BddAboveFn (fun x ↦ c * f x) := by\n  sorry\n\n/-!\n### 练习 1.7　无上界的刻画\n用 `push Not` 写出\"没有上界\"的含义。先用 `unfold BddAboveFn` 展开定义。\n-/\n\ntheorem ex1_7 (f : ℝ → ℝ) : ¬ BddAboveFn f ↔ ∀ M, ∃ x, M \u003c f x := by\n  sorry\n\n/-!\n### 练习 1.8　平方函数没有上界\n提示：对给定的 $M$，取 $x = |M| + 1$ 试试，并利用 `le_abs_self M : M ≤ |M|`。\n-/\n\ntheorem ex1_8 : ¬ BddAboveFn (fun x ↦ x ^ 2) := by\n  sorry\n\n/-!\n## 本章小结\n\n| 逻辑结构 | 证明它 | 使用它 |\n|---------|--------|--------|\n| $P \\to Q$ | `intro h` | `apply h`、`h hp` |\n| $P \\land Q$ | `constructor` | `obtain ⟨h₁, h₂⟩ := h` |\n| $P \\lor Q$ | `left` / `right` | `rcases h with h₁ \\| h₂` |\n| $\\forall x, P x$ | `intro x` | `h a` |\n| $\\exists x, P x$ | `use a` | `obtain ⟨x, hx⟩ := h` |\n| $\\lnot P$ | `intro h`（推出 `False`） | `exact absurd hp h` |\n| 反证法 | `by_contra h` | |\n| 否定化简 | `push Not` | `push Not at h` |\n-/\n\nend Ch01\n","blocks":[{"t":"p","html":"\u003cp>数列极限的定义是\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"\\forall \\varepsilon &gt; 0,\\ \\exists N,\\ \\forall n \\ge N,\\ |a_n - L| &lt; \\varepsilon.\">∀ ε &gt; 0, ∃ \u003ci>N\u003c/i>, ∀ \u003ci>n\u003c/i> ≥ \u003ci>N\u003c/i>, |\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>L\u003c/i>| &lt; ε.\u003c/span>\u003c/div>\n\u003cp>这一句话里有三个量词、一个蕴含和一个不等式。要熟练地证明分析中的定理，首先要熟练地\u003cstrong>拆解\u003c/strong>和\u003cstrong>构造\u003c/strong>这些逻辑结构。本章介绍每一种逻辑联结词在Lean 中对应的策略。\u003c/p>\n\u003cp>在 Lean 中，命题的类型是 \u003ccode>Prop\u003c/code>。\u003ccode>P : Prop\u003c/code> 表示&quot;\u003cspan class=\"math\" data-tex=\"P\">\u003ci>P\u003c/i>\u003c/span> 是一个命题&quot;，\u003ccode>h : P\u003c/code> 表示&quot;\u003cspan class=\"math\" data-tex=\"h\">\u003ci>h\u003c/i>\u003c/span> 是 \u003cspan class=\"math\" data-tex=\"P\">\u003ci>P\u003c/i>\u003c/span> 的一个证明&quot;。\u003c/p>\n\u003ch2 id=\"ch01-s1\">1.1 蕴含 \u003ccode>→\u003c/code>\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>证明\u003c/strong> \u003cspan class=\"math\" data-tex=\"P \\to Q\">\u003ci>P\u003c/i> → \u003ci>Q\u003c/i>\u003c/span>：用 \u003ccode>intro h\u003c/code> 假设 \u003cspan class=\"math\" data-tex=\"P\">\u003ci>P\u003c/i>\u003c/span> 成立（得到 \u003ccode>h : P\u003c/code>），然后证明 \u003cspan class=\"math\" data-tex=\"Q\">\u003ci>Q\u003c/i>\u003c/span>。\u003c/li>\u003cli>\u003cstrong>使用\u003c/strong> \u003ccode>h : P → Q\u003c/code>：如果目标是 \u003cspan class=\"math\" data-tex=\"Q\">\u003ci>Q\u003c/i>\u003c/span>，\u003ccode>apply h\u003c/code> 会把目标变成 \u003cspan class=\"math\" data-tex=\"P\">\u003ci>P\u003c/i>\u003c/span>；也可以直接写 \u003ccode>h hp\u003c/code> 得到 \u003cspan class=\"math\" data-tex=\"Q\">\u003ci>Q\u003c/i>\u003c/span> 的证明（这里 \u003ccode>hp : P\u003c/code>）。\u003c/li>\u003c/ul>"},{"t":"c","code":"example (P Q : Prop) (hP : P) (hPQ : P → Q) : Q := by\n  apply hPQ\n  exact hP\n\nexample (P Q : Prop) (hQ : Q) : P → Q := by\n  intro _hP\n  exact hQ","upto":644},{"t":"p","html":"\u003ch2 id=\"ch01-s2\">1.2 合取 \u003ccode>∧\u003c/code>（并且）\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>证明\u003c/strong> \u003cspan class=\"math\" data-tex=\"P \\land Q\">\u003ci>P\u003c/i> ∧ \u003ci>Q\u003c/i>\u003c/span>：\u003ccode>constructor\u003c/code> 把目标拆成两个，分别证明 \u003cspan class=\"math\" data-tex=\"P\">\u003ci>P\u003c/i>\u003c/span> 与 \u003cspan class=\"math\" data-tex=\"Q\">\u003ci>Q\u003c/i>\u003c/span>。两个子目标用 \u003ccode>·\u003c/code> 分开书写（输入 \u003ccode>\\.\u003c/code>）。\u003c/li>\u003cli>\u003cstrong>使用\u003c/strong> \u003ccode>h : P ∧ Q\u003c/code>：\u003ccode>obtain ⟨hP, hQ⟩ := h\u003c/code> 把它拆成两个假设。也可以用 \u003ccode>h.1\u003c/code> 和 \u003ccode>h.2\u003c/code>。（尖括号 \u003ccode>⟨ ⟩\u003c/code> 输入 \u003ccode>\\&lt;\u003c/code> 和 \u003ccode>\\&gt;\u003c/code>。）\u003c/li>\u003c/ul>"},{"t":"c","code":"example (x : ℝ) (h : 0 \u003c x ∧ x \u003c 1) : x ^ 2 \u003c 1 := by\n  obtain ⟨h₀, h₁⟩ := h\n  nlinarith\n\nexample (x : ℝ) (hx : 2 \u003c x) : 0 \u003c x ∧ 1 \u003c x := by\n  constructor\n  · linarith\n  · linarith","upto":1043},{"t":"p","html":"\u003ch2 id=\"ch01-s3\">1.3 析取 \u003ccode>∨\u003c/code>（或者）\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>证明\u003c/strong> \u003cspan class=\"math\" data-tex=\"P \\lor Q\">\u003ci>P\u003c/i> ∨ \u003ci>Q\u003c/i>\u003c/span>：用 \u003ccode>left\u003c/code> 选择证明 \u003cspan class=\"math\" data-tex=\"P\">\u003ci>P\u003c/i>\u003c/span>，或用 \u003ccode>right\u003c/code> 选择证明 \u003cspan class=\"math\" data-tex=\"Q\">\u003ci>Q\u003c/i>\u003c/span>。\u003c/li>\u003cli>\u003cstrong>使用\u003c/strong> \u003ccode>h : P ∨ Q\u003c/code>：\u003ccode>rcases h with hP | hQ\u003c/code> 进行\u003cstrong>分类讨论\u003c/strong>，得到两个目标，分别在 \u003cspan class=\"math\" data-tex=\"P\">\u003ci>P\u003c/i>\u003c/span> 成立和 \u003cspan class=\"math\" data-tex=\"Q\">\u003ci>Q\u003c/i>\u003c/span> 成立的情况下证明。\u003c/li>\u003c/ul>"},{"t":"c","code":"example (x : ℝ) (h : x \u003c -1 ∨ 1 \u003c x) : 1 \u003c x ^ 2 := by\n  rcases h with h | h\n  · nlinarith\n  · nlinarith","upto":1327},{"t":"p","html":"\u003cp>\u003ccode>le_or_gt a b : a ≤ b ∨ b &lt; a\u003c/code> 是一个非常有用的定理，它让我们可以对任意两个实数进行分类讨论。\u003c/p>"},{"t":"c","code":"example (x : ℝ) : 0 ≤ x ^ 2 := by\n  rcases le_or_gt 0 x with h | h\n  · positivity\n  · nlinarith","upto":1496},{"t":"p","html":"\u003ch2 id=\"ch01-s4\">1.4 全称量词 \u003ccode>∀\u003c/code>（对任意）\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>证明\u003c/strong> \u003cspan class=\"math\" data-tex=\"\\forall x, P(x)\">∀ \u003ci>x\u003c/i>, \u003ci>P\u003c/i>(\u003ci>x\u003c/i>)\u003c/span>：\u003ccode>intro x\u003c/code>，然后对这个&quot;任意的&quot; \u003cspan class=\"math\" data-tex=\"x\">\u003ci>x\u003c/i>\u003c/span> 证明 \u003cspan class=\"math\" data-tex=\"P(x)\">\u003ci>P\u003c/i>(\u003ci>x\u003c/i>)\u003c/span>。\u003c/li>\u003cli>\u003cstrong>使用\u003c/strong> \u003ccode>h : ∀ x, P x\u003c/code>：\u003ccode>h a\u003c/code> 就是 \u003cspan class=\"math\" data-tex=\"P(a)\">\u003ci>P\u003c/i>(\u003ci>a\u003c/i>)\u003c/span> 的证明。也可以 \u003ccode>specialize h a\u003c/code>。\u003c/li>\u003c/ul>\n\u003cp>注意：\u003cspan class=\"math\" data-tex=\"\\forall \\varepsilon &gt; 0, P(\\varepsilon)\">∀ ε &gt; 0, \u003ci>P\u003c/i>(ε)\u003c/span> 是 \u003cspan class=\"math\" data-tex=\"\\forall \\varepsilon, \\varepsilon &gt; 0 \\to P(\\varepsilon)\">∀ ε, ε &gt; 0 → \u003ci>P\u003c/i>(ε)\u003c/span>的缩写，因此要用 \u003ccode>intro ε hε\u003c/code> 引入\u003cstrong>两个\u003c/strong>东西。\u003c/p>"},{"t":"c","code":"example (f : ℝ → ℝ) (h : ∀ x, f x ≤ 3) : f 1 + f 2 ≤ 6 := by\n  have h1 := h 1\n  have h2 := h 2\n  linarith\n\nexample : ∀ ε > (0 : ℝ), ε / 2 \u003c ε := by\n  intro ε hε\n  linarith","upto":1968},{"t":"p","html":"\u003ch2 id=\"ch01-s5\">1.5 存在量词 \u003ccode>∃\u003c/code>（存在）\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>证明\u003c/strong> \u003cspan class=\"math\" data-tex=\"\\exists x, P(x)\">∃ \u003ci>x\u003c/i>, \u003ci>P\u003c/i>(\u003ci>x\u003c/i>)\u003c/span>：用 \u003ccode>use a\u003c/code> 给出一个具体的 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span>，然后证明 \u003cspan class=\"math\" data-tex=\"P(a)\">\u003ci>P\u003c/i>(\u003ci>a\u003c/i>)\u003c/span>。\u003cstrong>构造一个合适的对象\u003c/strong>——这是分析证明中最需要创造力的一步。\u003c/li>\u003cli>\u003cstrong>使用\u003c/strong> \u003ccode>h : ∃ x, P x\u003c/code>：\u003ccode>obtain ⟨x, hx⟩ := h\u003c/code> 取出这样一个 \u003cspan class=\"math\" data-tex=\"x\">\u003ci>x\u003c/i>\u003c/span> 以及 \u003ccode>hx : P x\u003c/code>。\u003c/li>\u003c/ul>"},{"t":"c","code":"example : ∃ x : ℝ, x ^ 2 = 4 := by\n  use 2\n  norm_num\n\nexample (f : ℝ → ℝ) (h : ∃ x, f x > 5) : ∃ x, f x > 4 := by\n  obtain ⟨x, hx⟩ := h\n  use x\n  linarith","upto":2323},{"t":"p","html":"\u003ch2 id=\"ch01-s6\">1.6 否定 \u003ccode>¬\u003c/code> 与 \u003ccode>push Not\u003c/code>\u003c/h2>\n\u003cp>在 Lean 中 \u003cspan class=\"math\" data-tex=\"\\lnot P\">¬ \u003ci>P\u003c/i>\u003c/span> 定义为 \u003cspan class=\"math\" data-tex=\"P \\to \\text{False}\">\u003ci>P\u003c/i> → False\u003c/span>。因此：\u003c/p>\n\u003cul>\u003cli>\u003cstrong>证明\u003c/strong> \u003cspan class=\"math\" data-tex=\"\\lnot P\">¬ \u003ci>P\u003c/i>\u003c/span>：\u003ccode>intro h\u003c/code> 假设 \u003cspan class=\"math\" data-tex=\"P\">\u003ci>P\u003c/i>\u003c/span>，推出矛盾（目标是 \u003ccode>False\u003c/code>）。\u003c/li>\u003cli>\u003ccode>by_contra h\u003c/code>：\u003cstrong>反证法\u003c/strong>，假设目标的否定，推出 \u003ccode>False\u003c/code>。\u003c/li>\u003cli>\u003ccode>push Not\u003c/code>：把否定号&quot;推进&quot;量词内部，例如\u003cspan class=\"math\" data-tex=\"\\lnot (\\forall x, P x)\">¬ (∀ \u003ci>x\u003c/i>, \u003ci>P\u003c/i> \u003ci>x\u003c/i>)\u003c/span> 变为 \u003cspan class=\"math\" data-tex=\"\\exists x, \\lnot P x\">∃ \u003ci>x\u003c/i>, ¬ \u003ci>P\u003c/i> \u003ci>x\u003c/i>\u003c/span>，\u003cspan class=\"math\" data-tex=\"\\lnot (a \\le b)\">¬ (\u003ci>a\u003c/i> ≤ \u003ci>b\u003c/i>)\u003c/span> 变为 \u003cspan class=\"math\" data-tex=\"b &lt; a\">\u003ci>b\u003c/i> &lt; \u003ci>a\u003c/i>\u003c/span>。\u003c/li>\u003c/ul>\n\u003cp>写出一个命题的\u003cstrong>否定\u003c/strong>，是分析中最基本也最容易出错的技能。\u003ccode>push Not\u003c/code> 可以帮你检查自己写得对不对。（在较旧版本的 Mathlib 中，这个策略叫做 \u003ccode>push_neg\u003c/code>。）\u003c/p>"},{"t":"c","code":"example (f : ℝ → ℝ) : ¬ (∀ x, f x ≤ 0) ↔ ∃ x, 0 \u003c f x := by\n  push Not\n  rfl","upto":2797},{"t":"p","html":"\u003ch2 id=\"ch01-s7\">1.7 分析中的第一个定义：有上界的函数\u003c/h2>\n\u003cp>我们说函数 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> \u003cstrong>有上界\u003c/strong>，如果存在 \u003cspan class=\"math\" data-tex=\"M\">\u003ci>M\u003c/i>\u003c/span> 使得对一切 \u003cspan class=\"math\" data-tex=\"x\">\u003ci>x\u003c/i>\u003c/span> 都有 \u003cspan class=\"math\" data-tex=\"f(x) \\le M\">\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) ≤ \u003ci>M\u003c/i>\u003c/span>。\u003c/p>\n\u003cp>下面用 \u003ccode>def\u003c/code> 给出这个定义。之后 Lean 会把 \u003ccode>BddAboveFn f\u003c/code> 理解为\u003ccode>∃ M, ∀ x, f x ≤ M\u003c/code>，所以可以对它使用 \u003ccode>obtain\u003c/code>、\u003ccode>use\u003c/code> 等策略。\u003c/p>"},{"t":"c","code":"/-- 函数 `f` 有上界。 -/\ndef BddAboveFn (f : ℝ → ℝ) : Prop :=\n  ∃ M, ∀ x, f x ≤ M","upto":3058},{"t":"p","html":"\u003cblockquote class=\"callout callout-thm\">\u003cp>\u003cstrong>定理 1.1\u003c/strong>　若 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 与 \u003cspan class=\"math\" data-tex=\"g\">\u003ci>g\u003c/i>\u003c/span> 都有上界，则 \u003cspan class=\"math\" data-tex=\"f + g\">\u003ci>f\u003c/i> + \u003ci>g\u003c/i>\u003c/span> 也有上界。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>证明思路\u003c/strong>：设 \u003cspan class=\"math\" data-tex=\"f \\le M\">\u003ci>f\u003c/i> ≤ \u003ci>M\u003c/i>\u003c/span>，\u003cspan class=\"math\" data-tex=\"g \\le N\">\u003ci>g\u003c/i> ≤ \u003ci>N\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"f + g \\le M + N\">\u003ci>f\u003c/i> + \u003ci>g\u003c/i> ≤ \u003ci>M\u003c/i> + \u003ci>N\u003c/i>\u003c/span>。注意 Lean 证明的结构与手写证明完全对应：取出 \u003cspan class=\"math\" data-tex=\"M\">\u003ci>M\u003c/i>\u003c/span>、取出 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span>、给出 \u003cspan class=\"math\" data-tex=\"M + N\">\u003ci>M\u003c/i> + \u003ci>N\u003c/i>\u003c/span>、对任意 \u003cspan class=\"math\" data-tex=\"x\">\u003ci>x\u003c/i>\u003c/span> 验证不等式。\u003c/p>"},{"t":"c","code":"theorem bddAboveFn_add {f g : ℝ → ℝ} (hf : BddAboveFn f) (hg : BddAboveFn g) :\n    BddAboveFn (fun x ↦ f x + g x) := by\n  obtain ⟨M, hM⟩ := hf\n  obtain ⟨N, hN⟩ := hg\n  use M + N\n  intro x\n  have h1 := hM x\n  have h2 := hN x\n  show f x + g x ≤ M + N\n  linarith","upto":3490},{"t":"p","html":"\u003cp>上面的 \u003ccode>show\u003c/code> 把目标 \u003ccode>(fun x ↦ f x + g x) x ≤ M + N\u003c/code> 写成更易读的等价形式\u003ccode>f x + g x ≤ M + N\u003c/code>（两者只差一步代入，Lean 能自动识别）。\u003c/p>\n\u003cblockquote class=\"callout callout-thm\">\u003cp>\u003cstrong>定理 1.2\u003c/strong>　恒等函数 \u003cspan class=\"math\" data-tex=\"x \\mapsto x\">\u003ci>x\u003c/i> ↦ \u003ci>x\u003c/i>\u003c/span> 没有上界。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>证明\u003c/strong>：假设有上界 \u003cspan class=\"math\" data-tex=\"M\">\u003ci>M\u003c/i>\u003c/span>，取 \u003cspan class=\"math\" data-tex=\"x = M + 1\">\u003ci>x\u003c/i> = \u003ci>M\u003c/i> + 1\u003c/span>，得到 \u003cspan class=\"math\" data-tex=\"M + 1 \\le M\">\u003ci>M\u003c/i> + 1 ≤ \u003ci>M\u003c/i>\u003c/span>，矛盾。\u003c/p>"},{"t":"c","code":"theorem not_bddAboveFn_id : ¬ BddAboveFn (fun x ↦ x) := by\n  intro h\n  obtain ⟨M, hM⟩ := h\n  have h1 : M + 1 ≤ M := hM (M + 1)\n  linarith","upto":3829},{"t":"p","html":"\u003ch2 id=\"ch01-s8\">练习\u003c/h2>\n\u003ch3 id=\"ch01-s9\">练习 1.1　蕴含的传递性\u003c/h3>"},{"t":"c","code":"theorem ex1_1 (P Q R : Prop) (hPQ : P → Q) (hQR : Q → R) : P → R := by\n  sorry","upto":3942,"ex":{"id":"ch01:ex1_1","name":"ex1_1","solution":"theorem ex1_1 (P Q R : Prop) (hPQ : P → Q) (hQR : Q → R) : P → R := by\n  intro hP\n  apply hQR\n  apply hPQ\n  exact hP"}},{"t":"p","html":"\u003ch3 id=\"ch01-s10\">练习 1.2　合取的交换律\u003c/h3>"},{"t":"c","code":"theorem ex1_2 (P Q : Prop) : P ∧ Q → Q ∧ P := by\n  sorry","upto":4026,"ex":{"id":"ch01:ex1_2","name":"ex1_2","solution":"theorem ex1_2 (P Q : Prop) : P ∧ Q → Q ∧ P := by\n  intro h\n  obtain ⟨hP, hQ⟩ := h\n  constructor\n  · exact hQ\n  · exact hP"}},{"t":"p","html":"\u003ch3 id=\"ch01-s11\">练习 1.3　析取的交换律\u003c/h3>"},{"t":"c","code":"theorem ex1_3 (P Q : Prop) : P ∨ Q → Q ∨ P := by\n  sorry","upto":4110,"ex":{"id":"ch01:ex1_3","name":"ex1_3","solution":"theorem ex1_3 (P Q : Prop) : P ∨ Q → Q ∨ P := by\n  intro h\n  rcases h with hP | hQ\n  · right\n    exact hP\n  · left\n    exact hQ"}},{"t":"p","html":"\u003ch3 id=\"ch01-s12\">练习 1.4　实数没有最大元\u003c/h3>\n\u003cp>对任意实数 \u003cspan class=\"math\" data-tex=\"x\">\u003ci>x\u003c/i>\u003c/span>，都存在比它更大的实数。\u003c/p>"},{"t":"c","code":"theorem ex1_4 : ∀ x : ℝ, ∃ y : ℝ, x \u003c y := by\n  sorry","upto":4214,"ex":{"id":"ch01:ex1_4","name":"ex1_4","solution":"theorem ex1_4 : ∀ x : ℝ, ∃ y : ℝ, x \u003c y := by\n  intro x\n  use x + 1\n  linarith"}},{"t":"p","html":"\u003ch3 id=\"ch01-s13\">练习 1.5　量词的顺序\u003c/h3>\n\u003cp>&quot;存在一个 \u003cspan class=\"math\" data-tex=\"x\">\u003ci>x\u003c/i>\u003c/span> 对所有 \u003cspan class=\"math\" data-tex=\"y\">\u003ci>y\u003c/i>\u003c/span> 都成立&quot;蕴含&quot;对每个 \u003cspan class=\"math\" data-tex=\"y\">\u003ci>y\u003c/i>\u003c/span> 都存在 \u003cspan class=\"math\" data-tex=\"x\">\u003ci>x\u003c/i>\u003c/span> 成立&quot;。（反过来对吗？想一想 \u003cspan class=\"math\" data-tex=\"P(x, y) := x &gt; y\">\u003ci>P\u003c/i>(\u003ci>x\u003c/i>, \u003ci>y\u003c/i>) := \u003ci>x\u003c/i> &gt; \u003ci>y\u003c/i>\u003c/span>。）\u003c/p>"},{"t":"c","code":"theorem ex1_5 (P : ℝ → ℝ → Prop) (h : ∃ x, ∀ y, P x y) : ∀ y, ∃ x, P x y := by\n  sorry","upto":4405,"ex":{"id":"ch01:ex1_5","name":"ex1_5","solution":"theorem ex1_5 (P : ℝ → ℝ → Prop) (h : ∃ x, ∀ y, P x y) : ∀ y, ∃ x, P x y := by\n  intro y\n  obtain ⟨x, hx⟩ := h\n  use x\n  exact hx y"}},{"t":"p","html":"\u003ch3 id=\"ch01-s14\">练习 1.6　有上界的数乘\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 有上界且 \u003cspan class=\"math\" data-tex=\"c \\ge 0\">\u003ci>c\u003c/i> ≥ 0\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"c f\">\u003ci>c\u003c/i> \u003ci>f\u003c/i>\u003c/span> 也有上界。\u003c/p>\n\u003cp>提示：Mathlib 中的 \u003ccode>mul_le_mul_of_nonneg_left : b ≤ c → 0 ≤ a → a * b ≤ a * c\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem ex1_6 {f : ℝ → ℝ} {c : ℝ} (hc : 0 ≤ c) (hf : BddAboveFn f) :\n    BddAboveFn (fun x ↦ c * f x) := by\n  sorry","upto":4659,"ex":{"id":"ch01:ex1_6","name":"ex1_6","solution":"theorem ex1_6 {f : ℝ → ℝ} {c : ℝ} (hc : 0 ≤ c) (hf : BddAboveFn f) :\n    BddAboveFn (fun x ↦ c * f x) := by\n  obtain ⟨M, hM⟩ := hf\n  use c * M\n  intro x\n  show c * f x ≤ c * M\n  exact mul_le_mul_of_nonneg_left (hM x) hc"}},{"t":"p","html":"\u003ch3 id=\"ch01-s15\">练习 1.7　无上界的刻画\u003c/h3>\n\u003cp>用 \u003ccode>push Not\u003c/code> 写出&quot;没有上界&quot;的含义。先用 \u003ccode>unfold BddAboveFn\u003c/code> 展开定义。\u003c/p>"},{"t":"c","code":"theorem ex1_7 (f : ℝ → ℝ) : ¬ BddAboveFn f ↔ ∀ M, ∃ x, M \u003c f x := by\n  sorry","upto":4817,"ex":{"id":"ch01:ex1_7","name":"ex1_7","solution":"theorem ex1_7 (f : ℝ → ℝ) : ¬ BddAboveFn f ↔ ∀ M, ∃ x, M \u003c f x := by\n  unfold BddAboveFn\n  push Not\n  rfl"}},{"t":"p","html":"\u003ch3 id=\"ch01-s16\">练习 1.8　平方函数没有上界\u003c/h3>\n\u003cp>提示：对给定的 \u003cspan class=\"math\" data-tex=\"M\">\u003ci>M\u003c/i>\u003c/span>，取 \u003cspan class=\"math\" data-tex=\"x = |M| + 1\">\u003ci>x\u003c/i> = |\u003ci>M\u003c/i>| + 1\u003c/span> 试试，并利用 \u003ccode>le_abs_self M : M ≤ |M|\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem ex1_8 : ¬ BddAboveFn (fun x ↦ x ^ 2) := by\n  sorry","upto":4967,"ex":{"id":"ch01:ex1_8","name":"ex1_8","solution":"theorem ex1_8 : ¬ BddAboveFn (fun x ↦ x ^ 2) := by\n  intro h\n  obtain ⟨M, hM⟩ := h\n  have h1 : (|M| + 1) ^ 2 ≤ M := hM (|M| + 1)\n  have h2 : M ≤ |M| := le_abs_self M\n  nlinarith [abs_nonneg M]"}},{"t":"p","html":"\u003ch2 id=\"ch01-s17\">本章小结\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>逻辑结构\u003c/th>\u003cth>证明它\u003c/th>\u003cth>使用它\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cspan class=\"math\" data-tex=\"P \\to Q\">\u003ci>P\u003c/i> → \u003ci>Q\u003c/i>\u003c/span>\u003c/td>\u003ctd>\u003ccode>intro h\u003c/code>\u003c/td>\u003ctd>\u003ccode>apply h\u003c/code>、\u003ccode>h hp\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"math\" data-tex=\"P \\land Q\">\u003ci>P\u003c/i> ∧ \u003ci>Q\u003c/i>\u003c/span>\u003c/td>\u003ctd>\u003ccode>constructor\u003c/code>\u003c/td>\u003ctd>\u003ccode>obtain ⟨h₁, h₂⟩ := h\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"math\" data-tex=\"P \\lor Q\">\u003ci>P\u003c/i> ∨ \u003ci>Q\u003c/i>\u003c/span>\u003c/td>\u003ctd>\u003ccode>left\u003c/code> / \u003ccode>right\u003c/code>\u003c/td>\u003ctd>\u003ccode>rcases h with h₁ | h₂\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"math\" data-tex=\"\\forall x, P x\">∀ \u003ci>x\u003c/i>, \u003ci>P\u003c/i> \u003ci>x\u003c/i>\u003c/span>\u003c/td>\u003ctd>\u003ccode>intro x\u003c/code>\u003c/td>\u003ctd>\u003ccode>h a\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"math\" data-tex=\"\\exists x, P x\">∃ \u003ci>x\u003c/i>, \u003ci>P\u003c/i> \u003ci>x\u003c/i>\u003c/span>\u003c/td>\u003ctd>\u003ccode>use a\u003c/code>\u003c/td>\u003ctd>\u003ccode>obtain ⟨x, hx⟩ := h\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"math\" data-tex=\"\\lnot P\">¬ \u003ci>P\u003c/i>\u003c/span>\u003c/td>\u003ctd>\u003ccode>intro h\u003c/code>（推出 \u003ccode>False\u003c/code>）\u003c/td>\u003ctd>\u003ccode>exact absurd hp h\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>反证法\u003c/td>\u003ctd>\u003ccode>by_contra h\u003c/code>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>否定化简\u003c/td>\u003ctd>\u003ccode>push Not\u003c/code>\u003c/td>\u003ctd>\u003ccode>push Not at h\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"ch02","num":2,"title":"实数：不等式与绝对值","summary":"有序域中的不等式，绝对值与三角不等式，伯努利不等式。","file":"Analysis/Ch02_Reals.lean","exercises":6,"source":"import Mathlib\n\n/-!\n# 第 2 章　实数：不等式与绝对值\n\n数学分析的舞台是实数集 $\\mathbb{R}$。从代数的角度看，$\\mathbb{R}$ 是一个\n**有序域**：可以做加减乘除，并且有一个与运算相容的大小关系 $\\le$。\n（实数区别于有理数的关键性质——**完备性**——留到下一章。）\n\n分析中的证明，绝大部分篇幅都是**不等式的估计**。而估计\"距离\"最基本的工具\n是**绝对值** $|x|$：$|x - a|$ 表示 $x$ 与 $a$ 在数轴上的距离。\n\n在 Lean 中，绝对值写作 `|x|`（竖线直接用键盘输入）。\n\n## 2.1 有序域中的不等式\n\n上一章的 `linarith`、`nlinarith`、`positivity` 是处理不等式的主力。\n对于非线性的不等式，经典技巧是\"配方\"：$(a - b)^2 \\ge 0$。\n`nlinarith` 接受一个提示列表，把这些事实加入推理。\n-/\n\nnamespace Ch02\n\nexample (a b : ℝ) : a * b ≤ (a ^ 2 + b ^ 2) / 2 := by\n  nlinarith [sq_nonneg (a - b)]\n\n/-!\n有时需要用到乘法的单调性。Mathlib 中的命名规则相当有规律：\n\n* `mul_pos : 0 \u003c a → 0 \u003c b → 0 \u003c a * b`\n* `mul_le_mul_of_nonneg_left : b ≤ c → 0 ≤ a → a * b ≤ a * c`\n* `div_le_div_of_nonneg_left`、`div_lt_iff₀`……\n\n记不住名字不要紧：在 Lean 中输入 `exact?`，它会自动搜索能直接证明目标的定理。\n\n## 2.2 绝对值\n\n> **定义 2.1**　$|x| = \\begin{cases} x, & x \\ge 0 \\\\ -x, & x \u003c 0 \\end{cases}$\n\nMathlib 中关于绝对值的常用定理：\n\n| 定理 | 内容 |\n|------|------|\n| `abs_nonneg x` | $0 \\le \\lvert x \\rvert$ |\n| `abs_of_nonneg` | $0 \\le x \\Rightarrow \\lvert x \\rvert = x$ |\n| `abs_of_neg` | $x \u003c 0 \\Rightarrow \\lvert x \\rvert = -x$ |\n| `le_abs_self x` | $x \\le \\lvert x \\rvert$ |\n| `neg_abs_le x` | $-\\lvert x \\rvert \\le x$ |\n| `abs_mul x y` | $\\lvert xy \\rvert = \\lvert x \\rvert \\lvert y \\rvert$ |\n| `abs_sub_comm x y` | $\\lvert x - y \\rvert = \\lvert y - x \\rvert$ |\n| `abs_lt` | $\\lvert x \\rvert \u003c b \\iff -b \u003c x \\land x \u003c b$ |\n| `abs_le` | $\\lvert x \\rvert \\le b \\iff -b \\le x \\land x \\le b$ |\n\n其中 `abs_lt` 与 `abs_le` 最为重要：它们把绝对值不等式转化为两个普通不等式，\n之后就可以交给 `linarith`。\n\n> **定理 2.2（三角不等式）**　$|a + b| \\le |a| + |b|$。\n\n**证明**：由 `abs_le`，只需证明 $-(|a| + |b|) \\le a + b \\le |a| + |b|$，\n而这由 $-|a| \\le a \\le |a|$ 与 $-|b| \\le b \\le |b|$ 相加即得。\n-/\n\ntheorem triangle (a b : ℝ) : |a + b| ≤ |a| + |b| := by\n  rw [abs_le]\n  constructor\n  · linarith [neg_abs_le a, neg_abs_le b]\n  · linarith [le_abs_self a, le_abs_self b]\n\n/-!\n`linarith [h₁, h₂]` 的写法表示\"把 `h₁`、`h₂` 也加入推理\"，效果和先用 `have` 引入一样。\n\nMathlib 中三角不等式的名字是 `abs_add_le a b`。之后的章节我们直接使用它。\n\n## 2.3 \"任意小\"的论证\n\n分析中最重要的思想之一：**要证明 $x \\le y$，只需证明对任意 $\\varepsilon > 0$ 有\n$x \u003c y + \\varepsilon$**。直观上，如果 $x$ 比 $y$ 大，那么取 $\\varepsilon = x - y$ 就矛盾了。\n-/\n\ntheorem le_of_forall_lt_add {x y : ℝ} (h : ∀ ε > 0, x \u003c y + ε) : x ≤ y := by\n  by_contra hxy\n  push Not at hxy\n  have h1 := h (x - y) (by linarith)\n  linarith\n\n/-!\n这个证明展示了分析中的典型模式：**反证 + 选取一个特殊的 $\\varepsilon$**。\n\n## 练习\n\n### 练习 2.1　距离的三角不等式\n$|a - c| \\le |a - b| + |b - c|$：从 $a$ 到 $c$ 的距离不超过经过 $b$ 绕路的距离。\n\n提示：利用 `triangle (a - b) (b - c)`。你可能需要 `calc` 和\n`congr 1; ring` 来说明 $|a - c| = |(a - b) + (b - c)|$。\n-/\n\ntheorem ex2_1 (a b c : ℝ) : |a - c| ≤ |a - b| + |b - c| := by\n  sorry\n\n/-!\n### 练习 2.2　反向三角不等式\n$|a| - |b| \\le |a - b|$。\n\n提示：$a = (a - b) + b$。\n-/\n\ntheorem ex2_2 (a b : ℝ) : |a| - |b| ≤ |a - b| := by\n  sorry\n\n/-!\n### 练习 2.3　邻域的刻画\n$|x - a| \u003c \\varepsilon$ 当且仅当 $a - \\varepsilon \u003c x \u003c a + \\varepsilon$。\n\n提示：`rw [abs_lt]`，然后 `constructor` 分别证明两个方向。\n-/\n\ntheorem ex2_3 (x a ε : ℝ) : |x - a| \u003c ε ↔ a - ε \u003c x ∧ x \u003c a + ε := by\n  sorry\n\n/-!\n### 练习 2.4　任意小的数等于零\n若对任意 $\\varepsilon > 0$ 都有 $|x| \u003c \\varepsilon$，则 $x = 0$。\n这个引理将用来证明**极限的唯一性**。\n\n提示：反证，若 $x \\ne 0$，则 $|x| > 0$（`abs_pos.mpr`），取 $\\varepsilon = |x|$。\n-/\n\ntheorem ex2_4 (x : ℝ) (h : ∀ ε > 0, |x| \u003c ε) : x = 0 := by\n  sorry\n\n/-!\n### 练习 2.5　绝对值的乘法估计\n若 $|x| \u003c 1$，则 $|x \\cdot y| \\le |y|$。\n\n提示：`rw [abs_mul]`，然后用 `nlinarith` 并提供 `abs_nonneg y`。\n-/\n\ntheorem ex2_5 (x y : ℝ) (hx : |x| \u003c 1) : |x * y| ≤ |y| := by\n  sorry\n\n/-!\n### 练习 2.6 ★　伯努利不等式\n对 $x \\ge -1$ 与自然数 $n$，$(1 + x)^n \\ge 1 + n x$。\n\n这是我们第一次使用**数学归纳法**。`induction n with` 产生两个情形：\n`zero`（$n = 0$）与 `succ k ih`（由 $n = k$ 推 $n = k + 1$，`ih` 是归纳假设）。\n\n提示：在 `succ` 情形，先 `push_cast` 把 `((k + 1 : ℕ) : ℝ)` 变为 `(k : ℝ) + 1`，\n再 `rw [pow_succ]`。关键事实是 $(1+x)^k(1+x) \\ge (1 + kx)(1 + x)$，\n它来自 `mul_le_mul_of_nonneg_right ih (_ : 0 ≤ 1 + x)`。\n最后还需要 $k x^2 \\ge 0$。\n-/\n\ntheorem ex2_6 (x : ℝ) (hx : -1 ≤ x) (n : ℕ) : 1 + n * x ≤ (1 + x) ^ n := by\n  induction n with\n  | zero => sorry\n  | succ k ih => sorry\n\n/-!\n## 本章小结\n\n* 实数是有序域，`linarith` / `nlinarith` / `positivity` 处理大部分不等式；\n* 绝对值不等式用 `abs_lt`、`abs_le` 拆成两个普通不等式；\n* 三角不等式 `abs_add_le` 是一切估计的基础；\n* \"对任意 $\\varepsilon > 0$ 成立\"的论证，常配合反证法与特殊的 $\\varepsilon$。\n-/\n\nend Ch02\n","blocks":[{"t":"p","html":"\u003cp>数学分析的舞台是实数集 \u003cspan class=\"math\" data-tex=\"\\mathbb{R}\">ℝ\u003c/span>。从代数的角度看，\u003cspan class=\"math\" data-tex=\"\\mathbb{R}\">ℝ\u003c/span> 是一个\u003cstrong>有序域\u003c/strong>：可以做加减乘除，并且有一个与运算相容的大小关系 \u003cspan class=\"math\" data-tex=\"\\le\">≤\u003c/span>。（实数区别于有理数的关键性质——\u003cstrong>完备性\u003c/strong>——留到下一章。）\u003c/p>\n\u003cp>分析中的证明，绝大部分篇幅都是\u003cstrong>不等式的估计\u003c/strong>。而估计&quot;距离&quot;最基本的工具是\u003cstrong>绝对值\u003c/strong> \u003cspan class=\"math\" data-tex=\"|x|\">|\u003ci>x\u003c/i>|\u003c/span>：\u003cspan class=\"math\" data-tex=\"|x - a|\">|\u003ci>x\u003c/i> − \u003ci>a\u003c/i>|\u003c/span> 表示 \u003cspan class=\"math\" data-tex=\"x\">\u003ci>x\u003c/i>\u003c/span> 与 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> 在数轴上的距离。\u003c/p>\n\u003cp>在 Lean 中，绝对值写作 \u003ccode>|x|\u003c/code>（竖线直接用键盘输入）。\u003c/p>\n\u003ch2 id=\"ch02-s1\">2.1 有序域中的不等式\u003c/h2>\n\u003cp>上一章的 \u003ccode>linarith\u003c/code>、\u003ccode>nlinarith\u003c/code>、\u003ccode>positivity\u003c/code> 是处理不等式的主力。对于非线性的不等式，经典技巧是&quot;配方&quot;：\u003cspan class=\"math\" data-tex=\"(a - b)^2 \\ge 0\">(\u003ci>a\u003c/i> − \u003ci>b\u003c/i>)\u003csup>2\u003c/sup> ≥ 0\u003c/span>。\u003ccode>nlinarith\u003c/code> 接受一个提示列表，把这些事实加入推理。\u003c/p>"},{"t":"c","code":"example (a b : ℝ) : a * b ≤ (a ^ 2 + b ^ 2) / 2 := by\n  nlinarith [sq_nonneg (a - b)]","upto":532},{"t":"p","html":"\u003cp>有时需要用到乘法的单调性。Mathlib 中的命名规则相当有规律：\u003c/p>\n\u003cul>\u003cli>\u003ccode>mul_pos : 0 &lt; a → 0 &lt; b → 0 &lt; a * b\u003c/code>\u003c/li>\u003cli>\u003ccode>mul_le_mul_of_nonneg_left : b ≤ c → 0 ≤ a → a * b ≤ a * c\u003c/code>\u003c/li>\u003cli>\u003ccode>div_le_div_of_nonneg_left\u003c/code>、\u003ccode>div_lt_iff₀\u003c/code>……\u003c/li>\u003c/ul>\n\u003cp>记不住名字不要紧：在 Lean 中输入 \u003ccode>exact?\u003c/code>，它会自动搜索能直接证明目标的定理。\u003c/p>\n\u003ch2 id=\"ch02-s2\">2.2 绝对值\u003c/h2>\n\u003cblockquote class=\"callout callout-def\">\u003cp>\u003cstrong>定义 2.1\u003c/strong>　\u003cspan class=\"math\" data-tex=\"|x| = \\begin{cases} x, &amp; x \\ge 0 \\\\ -x, &amp; x &lt; 0 \\end{cases}\">|\u003ci>x\u003c/i>| = \u003ci>x\u003c/i>, \u003ci>x\u003c/i> ≥ 0；−\u003ci>x\u003c/i>, \u003ci>x\u003c/i> &lt; 0\u003c/span>\u003c/p>\u003c/blockquote>\n\u003cp>Mathlib 中关于绝对值的常用定理：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>定理\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>abs_nonneg x\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"math\" data-tex=\"0 \\le \\lvert x \\rvert\">0 ≤ | \u003ci>x\u003c/i> |\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>abs_of_nonneg\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"math\" data-tex=\"0 \\le x \\Rightarrow \\lvert x \\rvert = x\">0 ≤ \u003ci>x\u003c/i> ⇒ | \u003ci>x\u003c/i> | = \u003ci>x\u003c/i>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>abs_of_neg\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"math\" data-tex=\"x &lt; 0 \\Rightarrow \\lvert x \\rvert = -x\">\u003ci>x\u003c/i> &lt; 0 ⇒ | \u003ci>x\u003c/i> | = −\u003ci>x\u003c/i>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>le_abs_self x\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"math\" data-tex=\"x \\le \\lvert x \\rvert\">\u003ci>x\u003c/i> ≤ | \u003ci>x\u003c/i> |\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>neg_abs_le x\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"math\" data-tex=\"-\\lvert x \\rvert \\le x\">−| \u003ci>x\u003c/i> | ≤ \u003ci>x\u003c/i>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>abs_mul x y\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"math\" data-tex=\"\\lvert xy \\rvert = \\lvert x \\rvert \\lvert y \\rvert\">| xy | = | \u003ci>x\u003c/i> | | \u003ci>y\u003c/i> |\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>abs_sub_comm x y\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"math\" data-tex=\"\\lvert x - y \\rvert = \\lvert y - x \\rvert\">| \u003ci>x\u003c/i> − \u003ci>y\u003c/i> | = | \u003ci>y\u003c/i> − \u003ci>x\u003c/i> |\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>abs_lt\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"math\" data-tex=\"\\lvert x \\rvert &lt; b \\iff -b &lt; x \\land x &lt; b\">| \u003ci>x\u003c/i> | &lt; \u003ci>b\u003c/i> ⇔ −\u003ci>b\u003c/i> &lt; \u003ci>x\u003c/i> ∧ \u003ci>x\u003c/i> &lt; \u003ci>b\u003c/i>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>abs_le\u003c/code>\u003c/td>\u003ctd>\u003cspan class=\"math\" data-tex=\"\\lvert x \\rvert \\le b \\iff -b \\le x \\land x \\le b\">| \u003ci>x\u003c/i> | ≤ \u003ci>b\u003c/i> ⇔ −\u003ci>b\u003c/i> ≤ \u003ci>x\u003c/i> ∧ \u003ci>x\u003c/i> ≤ \u003ci>b\u003c/i>\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>其中 \u003ccode>abs_lt\u003c/code> 与 \u003ccode>abs_le\u003c/code> 最为重要：它们把绝对值不等式转化为两个普通不等式，之后就可以交给 \u003ccode>linarith\u003c/code>。\u003c/p>\n\u003cblockquote class=\"callout callout-thm\">\u003cp>\u003cstrong>定理 2.2（三角不等式）\u003c/strong>　\u003cspan class=\"math\" data-tex=\"|a + b| \\le |a| + |b|\">|\u003ci>a\u003c/i> + \u003ci>b\u003c/i>| ≤ |\u003ci>a\u003c/i>| + |\u003ci>b\u003c/i>|\u003c/span>。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>证明\u003c/strong>：由 \u003ccode>abs_le\u003c/code>，只需证明 \u003cspan class=\"math\" data-tex=\"-(|a| + |b|) \\le a + b \\le |a| + |b|\">−(|\u003ci>a\u003c/i>| + |\u003ci>b\u003c/i>|) ≤ \u003ci>a\u003c/i> + \u003ci>b\u003c/i> ≤ |\u003ci>a\u003c/i>| + |\u003ci>b\u003c/i>|\u003c/span>，而这由 \u003cspan class=\"math\" data-tex=\"-|a| \\le a \\le |a|\">−|\u003ci>a\u003c/i>| ≤ \u003ci>a\u003c/i> ≤ |\u003ci>a\u003c/i>|\u003c/span> 与 \u003cspan class=\"math\" data-tex=\"-|b| \\le b \\le |b|\">−|\u003ci>b\u003c/i>| ≤ \u003ci>b\u003c/i> ≤ |\u003ci>b\u003c/i>|\u003c/span> 相加即得。\u003c/p>"},{"t":"c","code":"theorem triangle (a b : ℝ) : |a + b| ≤ |a| + |b| := by\n  rw [abs_le]\n  constructor\n  · linarith [neg_abs_le a, neg_abs_le b]\n  · linarith [le_abs_self a, le_abs_self b]","upto":1845},{"t":"p","html":"\u003cp>\u003ccode>linarith [h₁, h₂]\u003c/code> 的写法表示&quot;把 \u003ccode>h₁\u003c/code>、\u003ccode>h₂\u003c/code> 也加入推理&quot;，效果和先用 \u003ccode>have\u003c/code> 引入一样。\u003c/p>\n\u003cp>Mathlib 中三角不等式的名字是 \u003ccode>abs_add_le a b\u003c/code>。之后的章节我们直接使用它。\u003c/p>\n\u003ch2 id=\"ch02-s3\">2.3 &quot;任意小&quot;的论证\u003c/h2>\n\u003cp>分析中最重要的思想之一：\u003cstrong>要证明 \u003cspan class=\"math\" data-tex=\"x \\le y\">\u003ci>x\u003c/i> ≤ \u003ci>y\u003c/i>\u003c/span>，只需证明对任意 \u003cspan class=\"math\" data-tex=\"\\varepsilon &gt; 0\">ε &gt; 0\u003c/span> 有\u003cspan class=\"math\" data-tex=\"x &lt; y + \\varepsilon\">\u003ci>x\u003c/i> &lt; \u003ci>y\u003c/i> + ε\u003c/span>\u003c/strong>。直观上，如果 \u003cspan class=\"math\" data-tex=\"x\">\u003ci>x\u003c/i>\u003c/span> 比 \u003cspan class=\"math\" data-tex=\"y\">\u003ci>y\u003c/i>\u003c/span> 大，那么取 \u003cspan class=\"math\" data-tex=\"\\varepsilon = x - y\">ε = \u003ci>x\u003c/i> − \u003ci>y\u003c/i>\u003c/span> 就矛盾了。\u003c/p>"},{"t":"c","code":"theorem le_of_forall_lt_add {x y : ℝ} (h : ∀ ε > 0, x \u003c y + ε) : x ≤ y := by\n  by_contra hxy\n  push Not at hxy\n  have h1 := h (x - y) (by linarith)\n  linarith","upto":2277},{"t":"p","html":"\u003cp>这个证明展示了分析中的典型模式：\u003cstrong>反证 + 选取一个特殊的 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>\u003c/strong>。\u003c/p>\n\u003ch2 id=\"ch02-s4\">练习\u003c/h2>\n\u003ch3 id=\"ch02-s5\">练习 2.1　距离的三角不等式\u003c/h3>\n\u003cp>\u003cspan class=\"math\" data-tex=\"|a - c| \\le |a - b| + |b - c|\">|\u003ci>a\u003c/i> − \u003ci>c\u003c/i>| ≤ |\u003ci>a\u003c/i> − \u003ci>b\u003c/i>| + |\u003ci>b\u003c/i> − \u003ci>c\u003c/i>|\u003c/span>：从 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> 到 \u003cspan class=\"math\" data-tex=\"c\">\u003ci>c\u003c/i>\u003c/span> 的距离不超过经过 \u003cspan class=\"math\" data-tex=\"b\">\u003ci>b\u003c/i>\u003c/span> 绕路的距离。\u003c/p>\n\u003cp>提示：利用 \u003ccode>triangle (a - b) (b - c)\u003c/code>。你可能需要 \u003ccode>calc\u003c/code> 和\u003ccode>congr 1; ring\u003c/code> 来说明 \u003cspan class=\"math\" data-tex=\"|a - c| = |(a - b) + (b - c)|\">|\u003ci>a\u003c/i> − \u003ci>c\u003c/i>| = |(\u003ci>a\u003c/i> − \u003ci>b\u003c/i>) + (\u003ci>b\u003c/i> − \u003ci>c\u003c/i>)|\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem ex2_1 (a b c : ℝ) : |a - c| ≤ |a - b| + |b - c| := by\n  sorry","upto":2598,"ex":{"id":"ch02:ex2_1","name":"ex2_1","solution":"theorem ex2_1 (a b c : ℝ) : |a - c| ≤ |a - b| + |b - c| := by\n  calc |a - c| = |(a - b) + (b - c)| := by congr 1; ring\n    _ ≤ |a - b| + |b - c| := triangle (a - b) (b - c)"}},{"t":"p","html":"\u003ch3 id=\"ch02-s6\">练习 2.2　反向三角不等式\u003c/h3>\n\u003cp>\u003cspan class=\"math\" data-tex=\"|a| - |b| \\le |a - b|\">|\u003ci>a\u003c/i>| − |\u003ci>b\u003c/i>| ≤ |\u003ci>a\u003c/i> − \u003ci>b\u003c/i>|\u003c/span>。\u003c/p>\n\u003cp>提示：\u003cspan class=\"math\" data-tex=\"a = (a - b) + b\">\u003ci>a\u003c/i> = (\u003ci>a\u003c/i> − \u003ci>b\u003c/i>) + \u003ci>b\u003c/i>\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem ex2_2 (a b : ℝ) : |a| - |b| ≤ |a - b| := by\n  sorry","upto":2734,"ex":{"id":"ch02:ex2_2","name":"ex2_2","solution":"theorem ex2_2 (a b : ℝ) : |a| - |b| ≤ |a - b| := by\n  have h : |a| ≤ |a - b| + |b| := by\n    calc |a| = |(a - b) + b| := by congr 1; ring\n      _ ≤ |a - b| + |b| := triangle (a - b) b\n  linarith"}},{"t":"p","html":"\u003ch3 id=\"ch02-s7\">练习 2.3　邻域的刻画\u003c/h3>\n\u003cp>\u003cspan class=\"math\" data-tex=\"|x - a| &lt; \\varepsilon\">|\u003ci>x\u003c/i> − \u003ci>a\u003c/i>| &lt; ε\u003c/span> 当且仅当 \u003cspan class=\"math\" data-tex=\"a - \\varepsilon &lt; x &lt; a + \\varepsilon\">\u003ci>a\u003c/i> − ε &lt; \u003ci>x\u003c/i> &lt; \u003ci>a\u003c/i> + ε\u003c/span>。\u003c/p>\n\u003cp>提示：\u003ccode>rw [abs_lt]\u003c/code>，然后 \u003ccode>constructor\u003c/code> 分别证明两个方向。\u003c/p>"},{"t":"c","code":"theorem ex2_3 (x a ε : ℝ) : |x - a| \u003c ε ↔ a - ε \u003c x ∧ x \u003c a + ε := by\n  sorry","upto":2953,"ex":{"id":"ch02:ex2_3","name":"ex2_3","solution":"theorem ex2_3 (x a ε : ℝ) : |x - a| \u003c ε ↔ a - ε \u003c x ∧ x \u003c a + ε := by\n  rw [abs_lt]\n  constructor\n  · intro h\n    obtain ⟨h₁, h₂⟩ := h\n    constructor\n    · linarith\n    · linarith\n  · intro h\n    obtain ⟨h₁, h₂⟩ := h\n    constructor\n    · linarith\n    · linarith"}},{"t":"p","html":"\u003ch3 id=\"ch02-s8\">练习 2.4　任意小的数等于零\u003c/h3>\n\u003cp>若对任意 \u003cspan class=\"math\" data-tex=\"\\varepsilon &gt; 0\">ε &gt; 0\u003c/span> 都有 \u003cspan class=\"math\" data-tex=\"|x| &lt; \\varepsilon\">|\u003ci>x\u003c/i>| &lt; ε\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"x = 0\">\u003ci>x\u003c/i> = 0\u003c/span>。这个引理将用来证明\u003cstrong>极限的唯一性\u003c/strong>。\u003c/p>\n\u003cp>提示：反证，若 \u003cspan class=\"math\" data-tex=\"x \\ne 0\">\u003ci>x\u003c/i> ≠ 0\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"|x| &gt; 0\">|\u003ci>x\u003c/i>| &gt; 0\u003c/span>（\u003ccode>abs_pos.mpr\u003c/code>），取 \u003cspan class=\"math\" data-tex=\"\\varepsilon = |x|\">ε = |\u003ci>x\u003c/i>|\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem ex2_4 (x : ℝ) (h : ∀ ε > 0, |x| \u003c ε) : x = 0 := by\n  sorry","upto":3196,"ex":{"id":"ch02:ex2_4","name":"ex2_4","solution":"theorem ex2_4 (x : ℝ) (h : ∀ ε > 0, |x| \u003c ε) : x = 0 := by\n  by_contra hx\n  have hpos : 0 \u003c |x| := abs_pos.mpr hx\n  have h1 := h |x| hpos\n  linarith"}},{"t":"p","html":"\u003ch3 id=\"ch02-s9\">练习 2.5　绝对值的乘法估计\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"|x| &lt; 1\">|\u003ci>x\u003c/i>| &lt; 1\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"|x \\cdot y| \\le |y|\">|\u003ci>x\u003c/i> · \u003ci>y\u003c/i>| ≤ |\u003ci>y\u003c/i>|\u003c/span>。\u003c/p>\n\u003cp>提示：\u003ccode>rw [abs_mul]\u003c/code>，然后用 \u003ccode>nlinarith\u003c/code> 并提供 \u003ccode>abs_nonneg y\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem ex2_5 (x y : ℝ) (hx : |x| \u003c 1) : |x * y| ≤ |y| := by\n  sorry","upto":3386,"ex":{"id":"ch02:ex2_5","name":"ex2_5","solution":"theorem ex2_5 (x y : ℝ) (hx : |x| \u003c 1) : |x * y| ≤ |y| := by\n  rw [abs_mul]\n  nlinarith [abs_nonneg x, abs_nonneg y]"}},{"t":"p","html":"\u003ch3 id=\"ch02-s10\">练习 2.6 ★　伯努利不等式\u003c/h3>\n\u003cp>对 \u003cspan class=\"math\" data-tex=\"x \\ge -1\">\u003ci>x\u003c/i> ≥ −1\u003c/span> 与自然数 \u003cspan class=\"math\" data-tex=\"n\">\u003ci>n\u003c/i>\u003c/span>，\u003cspan class=\"math\" data-tex=\"(1 + x)^n \\ge 1 + n x\">(1 + \u003ci>x\u003c/i>)\u003csup>\u003ci>n\u003c/i>\u003c/sup> ≥ 1 + \u003ci>n\u003c/i> \u003ci>x\u003c/i>\u003c/span>。\u003c/p>\n\u003cp>这是我们第一次使用\u003cstrong>数学归纳法\u003c/strong>。\u003ccode>induction n with\u003c/code> 产生两个情形：\u003ccode>zero\u003c/code>（\u003cspan class=\"math\" data-tex=\"n = 0\">\u003ci>n\u003c/i> = 0\u003c/span>）与 \u003ccode>succ k ih\u003c/code>（由 \u003cspan class=\"math\" data-tex=\"n = k\">\u003ci>n\u003c/i> = \u003ci>k\u003c/i>\u003c/span> 推 \u003cspan class=\"math\" data-tex=\"n = k + 1\">\u003ci>n\u003c/i> = \u003ci>k\u003c/i> + 1\u003c/span>，\u003ccode>ih\u003c/code> 是归纳假设）。\u003c/p>\n\u003cp>提示：在 \u003ccode>succ\u003c/code> 情形，先 \u003ccode>push_cast\u003c/code> 把 \u003ccode>((k + 1 : ℕ) : ℝ)\u003c/code> 变为 \u003ccode>(k : ℝ) + 1\u003c/code>，再 \u003ccode>rw [pow_succ]\u003c/code>。关键事实是 \u003cspan class=\"math\" data-tex=\"(1+x)^k(1+x) \\ge (1 + kx)(1 + x)\">(1+\u003ci>x\u003c/i>)\u003csup>\u003ci>k\u003c/i>\u003c/sup>(1+\u003ci>x\u003c/i>) ≥ (1 + kx)(1 + \u003ci>x\u003c/i>)\u003c/span>，它来自 \u003ccode>mul_le_mul_of_nonneg_right ih (_ : 0 ≤ 1 + x)\u003c/code>。最后还需要 \u003cspan class=\"math\" data-tex=\"k x^2 \\ge 0\">\u003ci>k\u003c/i> \u003ci>x\u003c/i>\u003csup>2\u003c/sup> ≥ 0\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem ex2_6 (x : ℝ) (hx : -1 ≤ x) (n : ℕ) : 1 + n * x ≤ (1 + x) ^ n := by\n  induction n with\n  | zero => sorry\n  | succ k ih => sorry","upto":3915,"ex":{"id":"ch02:ex2_6","name":"ex2_6","solution":"theorem ex2_6 (x : ℝ) (hx : -1 ≤ x) (n : ℕ) : 1 + n * x ≤ (1 + x) ^ n := by\n  induction n with\n  | zero => simp\n  | succ k ih =>\n    push_cast\n    rw [pow_succ]\n    have h1 : 0 ≤ 1 + x := by linarith\n    have h2 : (1 + k * x) * (1 + x) ≤ (1 + x) ^ k * (1 + x) :=\n      mul_le_mul_of_nonneg_right ih h1\n    have h3 : 0 ≤ (k : ℝ) * x ^ 2 := by positivity\n    nlinarith [h2, h3]"}},{"t":"p","html":"\u003ch2 id=\"ch02-s11\">本章小结\u003c/h2>\n\u003cul>\u003cli>实数是有序域，\u003ccode>linarith\u003c/code> / \u003ccode>nlinarith\u003c/code> / \u003ccode>positivity\u003c/code> 处理大部分不等式；\u003c/li>\u003cli>绝对值不等式用 \u003ccode>abs_lt\u003c/code>、\u003ccode>abs_le\u003c/code> 拆成两个普通不等式；\u003c/li>\u003cli>三角不等式 \u003ccode>abs_add_le\u003c/code> 是一切估计的基础；\u003c/li>\u003cli>&quot;对任意 \u003cspan class=\"math\" data-tex=\"\\varepsilon &gt; 0\">ε &gt; 0\u003c/span> 成立&quot;的论证，常配合反证法与特殊的 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>。\u003c/li>\u003c/ul>"}]},{"id":"ch03","num":3,"title":"完备性：上确界与阿基米德性质","summary":"确界原理、上确界的 ε 刻画与阿基米德性质。","file":"Analysis/Ch03_Completeness.lean","exercises":5,"source":"import Mathlib\n\n/-!\n# 第 3 章　完备性：上确界与阿基米德性质\n\n有理数 $\\mathbb{Q}$ 也是有序域，为什么分析要建立在实数上？因为 $\\mathbb{Q}$ 有\"空隙\"：\n集合 $\\{x \\in \\mathbb{Q} \\mid x^2 \u003c 2\\}$ 在 $\\mathbb{Q}$ 中有上界，却没有**最小的**上界——\n那个位置本该是 $\\sqrt{2}$。实数填补了所有这样的空隙，这就是**完备性**。\n\n完备性是数学分析的基石：单调收敛定理、柯西收敛准则、介值定理、最值定理……\n全都依赖于它。\n\n## 3.1 上界与上确界\n-/\n\nnamespace Ch03\n\n/-- `M` 是集合 `S` 的一个上界。 -/\ndef IsUB (S : Set ℝ) (M : ℝ) : Prop :=\n  ∀ x ∈ S, x ≤ M\n\n/-- `s` 是集合 `S` 的上确界（最小上界）。 -/\ndef IsSup (S : Set ℝ) (s : ℝ) : Prop :=\n  IsUB S s ∧ ∀ M, IsUB S M → s ≤ M\n\n/-!\n> **定义 3.1**　$s$ 称为 $S$ 的**上确界**，记作 $s = \\sup S$，如果\n> (1) $s$ 是 $S$ 的上界；(2) $S$ 的任意上界 $M$ 都满足 $s \\le M$。\n\n`Set ℝ` 是实数集合的类型，`x ∈ S` 表示 $x$ 属于 $S$。\n集合 `{x : ℝ | x \u003c 1}` 的写法与数学中完全一样。\n\n## 3.2 完备性公理\n\n> **公理 3.2（确界原理）**　$\\mathbb{R}$ 的每个**非空**、**有上界**的子集都有上确界。\n\n在 Mathlib 中，实数是由柯西序列严格构造出来的，确界原理是一个**定理**。\n它的上确界记作 `sSup S`。下面我们把 Mathlib 的版本翻译成本章的定义——\n从此以后，我们只通过 `completeness` 来使用实数的完备性。\n-/\n\ntheorem completeness (S : Set ℝ) (hne : S.Nonempty) (hbdd : ∃ M, IsUB S M) :\n    ∃ s, IsSup S s := by\n  obtain ⟨M, hM⟩ := hbdd\n  have hb : BddAbove S := ⟨M, hM⟩\n  refine ⟨sSup S, ?_, ?_⟩\n  · intro x hx\n    exact le_csSup hb hx\n  · intro M' hM'\n    exact csSup_le hne hM'\n\n/-!\n`refine ⟨sSup S, ?_, ?_⟩` 的意思是：给出 $s = $ `sSup S`，\n而 `IsSup` 的两个条件留作两个新目标（`?_` 表
