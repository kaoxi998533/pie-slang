示\"待证\"）。\n\n## 3.3 上确界的 $\\varepsilon$ 刻画\n\n上确界的第二个条件\"是最小的上界\"有一个等价的、更好用的形式：\n\n> **定理 3.3**　若 $s = \\sup S$，则对任意 $\\varepsilon > 0$，存在 $x \\in S$ 使得 $x > s - \\varepsilon$。\n\n也就是说，$s - \\varepsilon$ 不再是上界，$S$ 中的元素可以任意接近 $s$。\n\n**证明**：反证。若对所有 $x \\in S$ 都有 $x \\le s - \\varepsilon$，则 $s - \\varepsilon$ 是上界，\n于是 $s \\le s - \\varepsilon$，与 $\\varepsilon > 0$ 矛盾。\n-/\n\ntheorem IsSup.approx {S : Set ℝ} {s : ℝ} (hs : IsSup S s) :\n    ∀ ε > 0, ∃ x ∈ S, s - ε \u003c x := by\n  intro ε hε\n  by_contra h\n  push Not at h\n  have h1 : s ≤ s - ε := hs.2 (s - ε) h\n  linarith\n\n/-!\n注意定理名字 `IsSup.approx`：这样命名之后，若 `hs : IsSup S s`，\n就可以用 `hs.approx` 调用它。\n\n## 3.4 阿基米德性质\n\n> **定理 3.4（阿基米德性质）**　对任意实数 $x$，存在自然数 $n > x$。\n\n这看起来\"显然\"，但它其实依赖于完备性（存在不满足阿基米德性质的有序域！）。\n\n**证明**：反证。若所有自然数都 $\\le x$，则 $\\mathbb{N}$ 有上界，设其上确界为 $s$。\n由定理 3.3，存在自然数 $n > s - 1$，于是 $n + 1 > s$。但 $n + 1$ 也是自然数，\n应当 $\\le s$，矛盾。\n\n`(n : ℝ)` 表示把自然数 `n` 看作实数（称为**类型转换**，coercion）。\n`Set.range (fun n : ℕ ↦ (n : ℝ))` 就是集合 $\\{0, 1, 2, \\ldots\\} \\subseteq \\mathbb{R}$。\n`push_cast` 负责化简类型转换，例如把 `((n + 1 : ℕ) : ℝ)` 变成 `(n : ℝ) + 1`。\n-/\n\ntheorem archimedean (x : ℝ) : ∃ n : ℕ, x \u003c n := by\n  by_contra h\n  push Not at h\n  -- h : ∀ (n : ℕ), (n : ℝ) ≤ x\n  have hne : (Set.range (fun n : ℕ ↦ (n : ℝ))).Nonempty := ⟨_, 0, rfl⟩\n  have hbdd : ∃ M, IsUB (Set.range (fun n : ℕ ↦ (n : ℝ))) M := by\n    use x\n    rintro _ ⟨n, rfl⟩\n    exact h n\n  obtain ⟨s, hs⟩ := completeness _ hne hbdd\n  obtain ⟨_, ⟨n, rfl⟩, hn⟩ := hs.approx 1 one_pos\n  have h1 : ((n + 1 : ℕ) : ℝ) ≤ s := hs.1 _ ⟨n + 1, rfl⟩\n  push_cast at h1\n  linarith\n\n/-!\n`rintro _ ⟨n, rfl⟩` 是 `intro` 与 `obtain` 的组合：引入 `range` 中的一个元素，\n它必然形如 `(n : ℝ)`，`rfl` 直接把它代入。\n\nMathlib 中同样的结论叫做 `exists_nat_gt`。\n\n## 练习\n\n### 练习 3.1　上确界的唯一性\n提示：`IsSup` 是一个合取，`h₁.1` 是\"上界\"，`h₁.2` 是\"最小\"。用 `le_antisymm`。\n-/\n\ntheorem ex3_1 {S : Set ℝ} {s t : ℝ} (h₁ : IsSup S s) (h₂ : IsSup S t) : s = t := by\n  sorry\n\n/-!\n### 练习 3.2　最大元就是上确界\n若 $s \\in S$ 且 $s$ 是 $S$ 的上界，则 $s = \\sup S$。\n-/\n\ntheorem ex3_2 {S : Set ℝ} {s : ℝ} (hs : s ∈ S) (hub : IsUB S s) : IsSup S s := by\n  sorry\n\n/-!\n### 练习 3.3　开区间的上确界\n$\\sup \\{x \\mid x \u003c 1\\} = 1$。注意 $1$ 并不属于这个集合！\n\n提示：第二部分用反证法。若某个上界 $M \u003c 1$，考虑 $\\frac{M + 1}{2}$。\n`x ∈ {x : ℝ | x \u003c 1}` 与 `x \u003c 1` 是一回事，可以用 `show` 转换。\n-/\n\ntheorem ex3_3 : IsSup {x : ℝ | x \u003c 1} 1 := by\n  sorry\n\n/-!\n### 练习 3.4　$\\frac{1}{n+1}$ 可以任意小\n对任意 $\\varepsilon > 0$，存在自然数 $n$ 使 $\\frac{1}{n + 1} \u003c \\varepsilon$。\n这是证明数列极限时最常用的工具之一。\n\n提示：对 $\\frac{1}{\\varepsilon}$ 用阿基米德性质。`div_lt_iff₀ (hc : 0 \u003c c) : a / c \u003c b ↔ a \u003c b * c`\n可以帮你去分母。\n-/\n\ntheorem ex3_4 (ε : ℝ) (hε : 0 \u003c ε) : ∃ n : ℕ, 1 / ((n : ℝ) + 1) \u003c ε := by\n  sorry\n\n/-!\n### 练习 3.5 ★　下确界\n仿照上确界，定义下界和下确界，并证明：若 $s = \\sup S$，则 $-s$ 是集合\n$-S = \\{-x \\mid x \\in S\\}$ 的下确界。这里我们用 `{y | -y ∈ S}` 来表示 $-S$。\n-/\n\n/-- `m` 是集合 `S` 的一个下界。 -/\ndef IsLB (S : Set ℝ) (m : ℝ) : Prop :=\n  ∀ x ∈ S, m ≤ x\n\n/-- `s` 是集合 `S` 的下确界（最大下界）。 -/\ndef IsInf (S : Set ℝ) (s : ℝ) : Prop :=\n  IsLB S s ∧ ∀ m, IsLB S m → m ≤ s\n\ntheorem ex3_5 {S : Set ℝ} {s : ℝ} (h : IsSup S s) : IsInf {y | -y ∈ S} (-s) := by\n  sorry\n\n/-!\n## 本章小结\n\n* 确界原理：非空有上界的实数集有上确界（`completeness`，Mathlib 中为 `sSup`）；\n* 上确界的 $\\varepsilon$ 刻画：$\\sup S - \\varepsilon$ 不是上界；\n* 阿基米德性质：自然数无上界，从而 $\\frac{1}{n+1}$ 可以任意小。\n\n这些就是下一章证明数列极限所需的全部\"弹药\"。\n-/\n\nend Ch03\n","blocks":[{"t":"p","html":"\u003cp>有理数 \u003cspan class=\"math\" data-tex=\"\\mathbb{Q}\">ℚ\u003c/span> 也是有序域，为什么分析要建立在实数上？因为 \u003cspan class=\"math\" data-tex=\"\\mathbb{Q}\">ℚ\u003c/span> 有&quot;空隙&quot;：集合 \u003cspan class=\"math\" data-tex=\"\\{x \\in \\mathbb{Q} \\mid x^2 &lt; 2\\}\">{\u003ci>x\u003c/i> ∈ ℚ | \u003ci>x\u003c/i>\u003csup>2\u003c/sup> &lt; 2}\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"\\mathbb{Q}\">ℚ\u003c/span> 中有上界，却没有\u003cstrong>最小的\u003c/strong>上界——那个位置本该是 \u003cspan class=\"math\" data-tex=\"\\sqrt{2}\">√2\u003c/span>。实数填补了所有这样的空隙，这就是\u003cstrong>完备性\u003c/strong>。\u003c/p>\n\u003cp>完备性是数学分析的基石：单调收敛定理、柯西收敛准则、介值定理、最值定理……全都依赖于它。\u003c/p>\n\u003ch2 id=\"ch03-s1\">3.1 上界与上确界\u003c/h2>"},{"t":"c","code":"/-- `M` 是集合 `S` 的一个上界。 -/\ndef IsUB (S : Set ℝ) (M : ℝ) : Prop :=\n  ∀ x ∈ S, x ≤ M\n\n/-- `s` 是集合 `S` 的上确界（最小上界）。 -/\ndef IsSup (S : Set ℝ) (s : ℝ) : Prop :=\n  IsUB S s ∧ ∀ M, IsUB S M → s ≤ M","upto":493},{"t":"p","html":"\u003cblockquote class=\"callout callout-def\">\u003cp>\u003cstrong>定义 3.1\u003c/strong>　\u003cspan class=\"math\" data-tex=\"s\">\u003ci>s\u003c/i>\u003c/span> 称为 \u003cspan class=\"math\" data-tex=\"S\">\u003ci>S\u003c/i>\u003c/span> 的\u003cstrong>上确界\u003c/strong>，记作 \u003cspan class=\"math\" data-tex=\"s = \\sup S\">\u003ci>s\u003c/i> = sup \u003ci>S\u003c/i>\u003c/span>，如果(1) \u003cspan class=\"math\" data-tex=\"s\">\u003ci>s\u003c/i>\u003c/span> 是 \u003cspan class=\"math\" data-tex=\"S\">\u003ci>S\u003c/i>\u003c/span> 的上界；(2) \u003cspan class=\"math\" data-tex=\"S\">\u003ci>S\u003c/i>\u003c/span> 的任意上界 \u003cspan class=\"math\" data-tex=\"M\">\u003ci>M\u003c/i>\u003c/span> 都满足 \u003cspan class=\"math\" data-tex=\"s \\le M\">\u003ci>s\u003c/i> ≤ \u003ci>M\u003c/i>\u003c/span>。\u003c/p>\u003c/blockquote>\n\u003cp>\u003ccode>Set ℝ\u003c/code> 是实数集合的类型，\u003ccode>x ∈ S\u003c/code> 表示 \u003cspan class=\"math\" data-tex=\"x\">\u003ci>x\u003c/i>\u003c/span> 属于 \u003cspan class=\"math\" data-tex=\"S\">\u003ci>S\u003c/i>\u003c/span>。集合 \u003ccode>{x : ℝ | x &lt; 1}\u003c/code> 的写法与数学中完全一样。\u003c/p>\n\u003ch2 id=\"ch03-s2\">3.2 完备性公理\u003c/h2>\n\u003cblockquote class=\"callout callout-thm\">\u003cp>\u003cstrong>公理 3.2（确界原理）\u003c/strong>　\u003cspan class=\"math\" data-tex=\"\\mathbb{R}\">ℝ\u003c/span> 的每个\u003cstrong>非空\u003c/strong>、\u003cstrong>有上界\u003c/strong>的子集都有上确界。\u003c/p>\u003c/blockquote>\n\u003cp>在 Mathlib 中，实数是由柯西序列严格构造出来的，确界原理是一个\u003cstrong>定理\u003c/strong>。它的上确界记作 \u003ccode>sSup S\u003c/code>。下面我们把 Mathlib 的版本翻译成本章的定义——从此以后，我们只通过 \u003ccode>completeness\u003c/code> 来使用实数的完备性。\u003c/p>"},{"t":"c","code":"theorem completeness (S : Set ℝ) (hne : S.Nonempty) (hbdd : ∃ M, IsUB S M) :\n    ∃ s, IsSup S s := by\n  obtain ⟨M, hM⟩ := hbdd\n  have hb : BddAbove S := ⟨M, hM⟩\n  refine ⟨sSup S, ?_, ?_⟩\n  · intro x hx\n    exact le_csSup hb hx\n  · intro M' hM'\n    exact csSup_le hne hM'","upto":1153},{"t":"p","html":"\u003cp>\u003ccode>refine ⟨sSup S, ?_, ?_⟩\u003c/code> 的意思是：给出 \u003cspan class=\"math\" data-tex=\"s = \">\u003ci>s\u003c/i> =\u003c/span> \u003ccode>sSup S\u003c/code>，而 \u003ccode>IsSup\u003c/code> 的两个条件留作两个新目标（\u003ccode>?_\u003c/code> 表示&quot;待证&quot;）。\u003c/p>\n\u003ch2 id=\"ch03-s3\">3.3 上确界的 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span> 刻画\u003c/h2>\n\u003cp>上确界的第二个条件&quot;是最小的上界&quot;有一个等价的、更好用的形式：\u003c/p>\n\u003cblockquote class=\"callout callout-thm\">\u003cp>\u003cstrong>定理 3.3\u003c/strong>　若 \u003cspan class=\"math\" data-tex=\"s = \\sup S\">\u003ci>s\u003c/i> = sup \u003ci>S\u003c/i>\u003c/span>，则对任意 \u003cspan class=\"math\" data-tex=\"\\varepsilon &gt; 0\">ε &gt; 0\u003c/span>，存在 \u003cspan class=\"math\" data-tex=\"x \\in S\">\u003ci>x\u003c/i> ∈ \u003ci>S\u003c/i>\u003c/span> 使得 \u003cspan class=\"math\" data-tex=\"x &gt; s - \\varepsilon\">\u003ci>x\u003c/i> &gt; \u003ci>s\u003c/i> − ε\u003c/span>。\u003c/p>\u003c/blockquote>\n\u003cp>也就是说，\u003cspan class=\"math\" data-tex=\"s - \\varepsilon\">\u003ci>s\u003c/i> − ε\u003c/span> 不再是上界，\u003cspan class=\"math\" data-tex=\"S\">\u003ci>S\u003c/i>\u003c/span> 中的元素可以任意接近 \u003cspan class=\"math\" data-tex=\"s\">\u003ci>s\u003c/i>\u003c/span>。\u003c/p>\n\u003cp>\u003cstrong>证明\u003c/strong>：反证。若对所有 \u003cspan class=\"math\" data-tex=\"x \\in S\">\u003ci>x\u003c/i> ∈ \u003ci>S\u003c/i>\u003c/span> 都有 \u003cspan class=\"math\" data-tex=\"x \\le s - \\varepsilon\">\u003ci>x\u003c/i> ≤ \u003ci>s\u003c/i> − ε\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"s - \\varepsilon\">\u003ci>s\u003c/i> − ε\u003c/span> 是上界，于是 \u003cspan class=\"math\" data-tex=\"s \\le s - \\varepsilon\">\u003ci>s\u003c/i> ≤ \u003ci>s\u003c/i> − ε\u003c/span>，与 \u003cspan class=\"math\" data-tex=\"\\varepsilon &gt; 0\">ε &gt; 0\u003c/span> 矛盾。\u003c/p>"},{"t":"c","code":"theorem IsSup.approx {S : Set ℝ} {s : ℝ} (hs : IsSup S s) :\n    ∀ ε > 0, ∃ x ∈ S, s - ε \u003c x := by\n  intro ε hε\n  by_contra h\n  push Not at h\n  have h1 : s ≤ s - ε := hs.2 (s - ε) h\n  linarith","upto":1775},{"t":"p","html":"\u003cp>注意定理名字 \u003ccode>IsSup.approx\u003c/code>：这样命名之后，若 \u003ccode>hs : IsSup S s\u003c/code>，就可以用 \u003ccode>hs.approx\u003c/code> 调用它。\u003c/p>\n\u003ch2 id=\"ch03-s4\">3.4 阿基米德性质\u003c/h2>\n\u003cblockquote class=\"callout callout-thm\">\u003cp>\u003cstrong>定理 3.4（阿基米德性质）\u003c/strong>　对任意实数 \u003cspan class=\"math\" data-tex=\"x\">\u003ci>x\u003c/i>\u003c/span>，存在自然数 \u003cspan class=\"math\" data-tex=\"n &gt; x\">\u003ci>n\u003c/i> &gt; \u003ci>x\u003c/i>\u003c/span>。\u003c/p>\u003c/blockquote>\n\u003cp>这看起来&quot;显然&quot;，但它其实依赖于完备性（存在不满足阿基米德性质的有序域！）。\u003c/p>\n\u003cp>\u003cstrong>证明\u003c/strong>：反证。若所有自然数都 \u003cspan class=\"math\" data-tex=\"\\le x\">≤ \u003ci>x\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"\\mathbb{N}\">ℕ\u003c/span> 有上界，设其上确界为 \u003cspan class=\"math\" data-tex=\"s\">\u003ci>s\u003c/i>\u003c/span>。由定理 3.3，存在自然数 \u003cspan class=\"math\" data-tex=\"n &gt; s - 1\">\u003ci>n\u003c/i> &gt; \u003ci>s\u003c/i> − 1\u003c/span>，于是 \u003cspan class=\"math\" data-tex=\"n + 1 &gt; s\">\u003ci>n\u003c/i> + 1 &gt; \u003ci>s\u003c/i>\u003c/span>。但 \u003cspan class=\"math\" data-tex=\"n + 1\">\u003ci>n\u003c/i> + 1\u003c/span> 也是自然数，应当 \u003cspan class=\"math\" data-tex=\"\\le s\">≤ \u003ci>s\u003c/i>\u003c/span>，矛盾。\u003c/p>\n\u003cp>\u003ccode>(n : ℝ)\u003c/code> 表示把自然数 \u003ccode>n\u003c/code> 看作实数（称为\u003cstrong>类型转换\u003c/strong>，coercion）。\u003ccode>Set.range (fun n : ℕ ↦ (n : ℝ))\u003c/code> 就是集合 \u003cspan class=\"math\" data-tex=\"\\{0, 1, 2, \\ldots\\} \\subseteq \\mathbb{R}\">{0, 1, 2, …} ⊆ ℝ\u003c/span>。\u003ccode>push_cast\u003c/code> 负责化简类型转换，例如把 \u003ccode>((n + 1 : ℕ) : ℝ)\u003c/code> 变成 \u003ccode>(n : ℝ) + 1\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem archimedean (x : ℝ) : ∃ n : ℕ, x \u003c n := by\n  by_contra h\n  push Not at h\n  -- h : ∀ (n : ℕ), (n : ℝ) ≤ x\n  have hne : (Set.range (fun n : ℕ ↦ (n : ℝ))).Nonempty := ⟨_, 0, rfl⟩\n  have hbdd : ∃ M, IsUB (Set.range (fun n : ℕ ↦ (n : ℝ))) M := by\n    use x\n    rintro _ ⟨n, rfl⟩\n    exact h n\n  obtain ⟨s, hs⟩ := completeness _ hne hbdd\n  obtain ⟨_, ⟨n, rfl⟩, hn⟩ := hs.approx 1 one_pos\n  have h1 : ((n + 1 : ℕ) : ℝ) ≤ s := hs.1 _ ⟨n + 1, rfl⟩\n  push_cast at h1\n  linarith","upto":2759},{"t":"p","html":"\u003cp>\u003ccode>rintro _ ⟨n, rfl⟩\u003c/code> 是 \u003ccode>intro\u003c/code> 与 \u003ccode>obtain\u003c/code> 的组合：引入 \u003ccode>range\u003c/code> 中的一个元素，它必然形如 \u003ccode>(n : ℝ)\u003c/code>，\u003ccode>rfl\u003c/code> 直接把它代入。\u003c/p>\n\u003cp>Mathlib 中同样的结论叫做 \u003ccode>exists_nat_gt\u003c/code>。\u003c/p>\n\u003ch2 id=\"ch03-s5\">练习\u003c/h2>\n\u003ch3 id=\"ch03-s6\">练习 3.1　上确界的唯一性\u003c/h3>\n\u003cp>提示：\u003ccode>IsSup\u003c/code> 是一个合取，\u003ccode>h₁.1\u003c/code> 是&quot;上界&quot;，\u003ccode>h₁.2\u003c/code> 是&quot;最小&quot;。用 \u003ccode>le_antisymm\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem ex3_1 {S : Set ℝ} {s t : ℝ} (h₁ : IsSup S s) (h₂ : IsSup S t) : s = t := by\n  sorry","upto":3076,"ex":{"id":"ch03:ex3_1","name":"ex3_1","solution":"theorem ex3_1 {S : Set ℝ} {s t : ℝ} (h₁ : IsSup S s) (h₂ : IsSup S t) : s = t := by\n  apply le_antisymm\n  · exact h₁.2 t h₂.1\n  · exact h₂.2 s h₁.1"}},{"t":"p","html":"\u003ch3 id=\"ch03-s7\">练习 3.2　最大元就是上确界\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"s \\in S\">\u003ci>s\u003c/i> ∈ \u003ci>S\u003c/i>\u003c/span> 且 \u003cspan class=\"math\" data-tex=\"s\">\u003ci>s\u003c/i>\u003c/span> 是 \u003cspan class=\"math\" data-tex=\"S\">\u003ci>S\u003c/i>\u003c/span> 的上界，则 \u003cspan class=\"math\" data-tex=\"s = \\sup S\">\u003ci>s\u003c/i> = sup \u003ci>S\u003c/i>\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem ex3_2 {S : Set ℝ} {s : ℝ} (hs : s ∈ S) (hub : IsUB S s) : IsSup S s := by\n  sorry","upto":3239,"ex":{"id":"ch03:ex3_2","name":"ex3_2","solution":"theorem ex3_2 {S : Set ℝ} {s : ℝ} (hs : s ∈ S) (hub : IsUB S s) : IsSup S s := by\n  constructor\n  · exact hub\n  · intro M hM\n    exact hM s hs"}},{"t":"p","html":"\u003ch3 id=\"ch03-s8\">练习 3.3　开区间的上确界\u003c/h3>\n\u003cp>\u003cspan class=\"math\" data-tex=\"\\sup \\{x \\mid x &lt; 1\\} = 1\">sup {\u003ci>x\u003c/i> | \u003ci>x\u003c/i> &lt; 1} = 1\u003c/span>。注意 \u003cspan class=\"math\" data-tex=\"1\">1\u003c/span> 并不属于这个集合！\u003c/p>\n\u003cp>提示：第二部分用反证法。若某个上界 \u003cspan class=\"math\" data-tex=\"M &lt; 1\">\u003ci>M\u003c/i> &lt; 1\u003c/span>，考虑 \u003cspan class=\"math\" data-tex=\"\\frac{M + 1}{2}\">(\u003ci>M\u003c/i> + 1)/2\u003c/span>。\u003ccode>x ∈ {x : ℝ | x &lt; 1}\u003c/code> 与 \u003ccode>x &lt; 1\u003c/code> 是一回事，可以用 \u003ccode>show\u003c/code> 转换。\u003c/p>"},{"t":"c","code":"theorem ex3_3 : IsSup {x : ℝ | x \u003c 1} 1 := by\n  sorry","upto":3467,"ex":{"id":"ch03:ex3_3","name":"ex3_3","solution":"theorem ex3_3 : IsSup {x : ℝ | x \u003c 1} 1 := by\n  constructor\n  · intro x hx\n    have hx' : x \u003c 1 := hx\n    linarith\n  · intro M hM\n    by_contra h\n    push Not at h\n    -- h : M \u003c 1，考虑 (M + 1) / 2\n    have hmem : (M + 1) / 2 ∈ {x : ℝ | x \u003c 1} := by\n      show (M + 1) / 2 \u003c 1\n      linarith\n    have h1 := hM ((M + 1) / 2) hmem\n    linarith"}},{"t":"p","html":"\u003ch3 id=\"ch03-s9\">练习 3.4　\u003cspan class=\"math\" data-tex=\"\\frac{1}{n+1}\">1/(\u003ci>n\u003c/i>+1)\u003c/span> 可以任意小\u003c/h3>\n\u003cp>对任意 \u003cspan class=\"math\" data-tex=\"\\varepsilon &gt; 0\">ε &gt; 0\u003c/span>，存在自然数 \u003cspan class=\"math\" data-tex=\"n\">\u003ci>n\u003c/i>\u003c/span> 使 \u003cspan class=\"math\" data-tex=\"\\frac{1}{n + 1} &lt; \\varepsilon\">1/(\u003ci>n\u003c/i> + 1) &lt; ε\u003c/span>。这是证明数列极限时最常用的工具之一。\u003c/p>\n\u003cp>提示：对 \u003cspan class=\"math\" data-tex=\"\\frac{1}{\\varepsilon}\">1/ε\u003c/span> 用阿基米德性质。\u003ccode>div_lt_iff₀ (hc : 0 &lt; c) : a / c &lt; b ↔ a &lt; b * c\u003c/code>可以帮你去分母。\u003c/p>"},{"t":"c","code":"theorem ex3_4 (ε : ℝ) (hε : 0 \u003c ε) : ∃ n : ℕ, 1 / ((n : ℝ) + 1) \u003c ε := by\n  sorry","upto":3775,"ex":{"id":"ch03:ex3_4","name":"ex3_4","solution":"theorem ex3_4 (ε : ℝ) (hε : 0 \u003c ε) : ∃ n : ℕ, 1 / ((n : ℝ) + 1) \u003c ε := by\n  obtain ⟨n, hn⟩ := archimedean (1 / ε)\n  use n\n  have hpos : (0 : ℝ) \u003c n + 1 := by positivity\n  rw [div_lt_iff₀ hpos]\n  rw [div_lt_iff₀ hε] at hn\n  linarith"}},{"t":"p","html":"\u003ch3 id=\"ch03-s10\">练习 3.5 ★　下确界\u003c/h3>\n\u003cp>仿照上确界，定义下界和下确界，并证明：若 \u003cspan class=\"math\" data-tex=\"s = \\sup S\">\u003ci>s\u003c/i> = sup \u003ci>S\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"-s\">−\u003ci>s\u003c/i>\u003c/span> 是集合\u003cspan class=\"math\" data-tex=\"-S = \\{-x \\mid x \\in S\\}\">−\u003ci>S\u003c/i> = {−\u003ci>x\u003c/i> | \u003ci>x\u003c/i> ∈ \u003ci>S\u003c/i>}\u003c/span> 的下确界。这里我们用 \u003ccode>{y | -y ∈ S}\u003c/code> 来表示 \u003cspan class=\"math\" data-tex=\"-S\">−\u003ci>S\u003c/i>\u003c/span>。\u003c/p>"},{"t":"c","code":"/-- `m` 是集合 `S` 的一个下界。 -/\ndef IsLB (S : Set ℝ) (m : ℝ) : Prop :=\n  ∀ x ∈ S, m ≤ x\n\n/-- `s` 是集合 `S` 的下确界（最大下界）。 -/\ndef IsInf (S : Set ℝ) (s : ℝ) : Prop :=\n  IsLB S s ∧ ∀ m, IsLB S m → m ≤ s\n\ntheorem ex3_5 {S : Set ℝ} {s : ℝ} (h : IsSup S s) : IsInf {y | -y ∈ S} (-s) := by\n  sorry","upto":4189,"ex":{"id":"ch03:ex3_5","name":"ex3_5","solution":"theorem ex3_5 {S : Set ℝ} {s : ℝ} (h : IsSup S s) : IsInf {y | -y ∈ S} (-s) := by\n  constructor\n  · intro y hy\n    have h1 : -y ≤ s := h.1 (-y) hy\n    linarith\n  · intro m hm\n    -- -m 是 S 的上界\n    have hub : IsUB S (-m) := by\n      intro x hx\n      have hx' : -(-x) ∈ S := by simpa using hx\n      have h1 : m ≤ -x := hm (-x) hx'\n      linarith\n    have h2 : s ≤ -m := h.2 (-m) hub\n    linarith"}},{"t":"p","html":"\u003ch2 id=\"ch03-s11\">本章小结\u003c/h2>\n\u003cul>\u003cli>确界原理：非空有上界的实数集有上确界（\u003ccode>completeness\u003c/code>，Mathlib 中为 \u003ccode>sSup\u003c/code>）；\u003c/li>\u003cli>上确界的 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span> 刻画：\u003cspan class=\"math\" data-tex=\"\\sup S - \\varepsilon\">sup \u003ci>S\u003c/i> − ε\u003c/span> 不是上界；\u003c/li>\u003cli>阿基米德性质：自然数无上界，从而 \u003cspan class=\"math\" data-tex=\"\\frac{1}{n+1}\">1/(\u003ci>n\u003c/i>+1)\u003c/span> 可以任意小。\u003c/li>\u003c/ul>\n\u003cp>这些就是下一章证明数列极限所需的全部&quot;弹药&quot;。\u003c/p>"}]},{"id":"ch04","num":4,"title":"数列极限","summary":"ε-N 定义，1/(n+1) → 0，极限的唯一性。","file":"Analysis/Ch04_SeqLimit.lean","exercises":8,"source":"import Mathlib\n\n/-!\n# 第 4 章　数列极限\n\n终于来到了分析的核心概念：**极限**。\n\n一个实数数列 $a_0, a_1, a_2, \\ldots$ 就是一个函数 $a : \\mathbb{N} \\to \\mathbb{R}$，\n在 Lean 中它的类型是 `ℕ → ℝ`，第 $n$ 项写作 `a n`。\n（注意：本书的数列从第 $0$ 项开始。）\n\n## 4.1 $\\varepsilon$-$N$ 定义\n\n> **定义 4.1**　称数列 $(a_n)$ **收敛**到 $L$，记作 $a_n \\to L$，如果\n> $$\\forall \\varepsilon > 0,\\ \\exists N \\in \\mathbb{N},\\ \\forall n \\ge N,\\ |a_n - L| \u003c \\varepsilon.$$\n\n可以把这个定义理解为一个**游戏**：\n\n1. 对手先给出一个误差范围 $\\varepsilon > 0$（可能非常小）；\n2. 你需要找到一个 $N$；\n3. 然后对手可以任选 $n \\ge N$，而你必须保证 $|a_n - L| \u003c \\varepsilon$。\n\n如果无论对手给出什么 $\\varepsilon$，你总能赢，那么 $a_n \\to L$。\n证明的关键永远是第 2 步：**根据 $\\varepsilon$ 构造 $N$**。\n\n\u003c!-- widget:eps-n -->\n\n（网页版在这里有一个交互演示：拖动 $\\varepsilon$，观察需要的 $N$ 如何变化。\n$\\varepsilon$ 越小，$N$ 就要越大——但只要总能找到，数列就收敛。）\n-/\n\nnamespace Ch04\n\n/-- 数列 `a` 收敛到 `L`。 -/\ndef TendsTo (a : ℕ → ℝ) (L : ℝ) : Prop :=\n  ∀ ε > 0, ∃ N : ℕ, ∀ n ≥ N, |a n - L| \u003c ε\n\n/-!\n`TendsTo a L` 的证明总是以 `intro ε hε` 开始（接受对手的 $\\varepsilon$），\n然后 `use N`（给出你的 $N$），再 `intro n hn`（接受对手的 $n$），最后估计不等式。\n\n## 4.2 第一个例子：$\\frac{1}{n+1} \\to 0$\n\n> **例 4.2**　$\\lim\\limits_{n \\to \\infty} \\frac{1}{n + 1} = 0$。\n\n**草稿**（找 $N$）：我们需要 $\\frac{1}{n+1} \u003c \\varepsilon$，即 $n + 1 > \\frac{1}{\\varepsilon}$。\n由阿基米德性质，取自然数 $N > \\frac{1}{\\varepsilon}$，则 $n \\ge N$ 时 $n + 1 > N > \\frac{1}{\\varepsilon}$。\n\n**证明**：下面每一步都与草稿对应。`exists_nat_gt` 是 Mathlib 中的阿基米德性质，\n`exact_mod_cast` 把自然数的不等式 `N ≤ n` 转化为实数的不等式。\n-/\n\ntheorem tendsTo_one_div : TendsTo (fun n ↦ 1 / ((n : ℝ) + 1)) 0 := by\n  intro ε hε\n  obtain ⟨N, hN⟩ := exists_nat_gt (1 / ε)\n  use N\n  intro n hn\n  have hn' : (N : ℝ) ≤ n := by exact_mod_cast hn\n  have hpos : (0 : ℝ) \u003c n + 1 := by positivity\n  show |1 / ((n : ℝ) + 1) - 0| \u003c ε\n  rw [sub_zero, abs_of_pos (by positivity), div_lt_iff₀ hpos]\n  -- 目标：1 \u003c ε * (n + 1)\n  have h1 : 1 / ε \u003c n + 1 := by linarith\n  rw [div_lt_iff₀ hε] at h1\n  linarith\n\n/-!\n## 4.3 极限的唯一性\n\n> **定理 4.3**　收敛数列的极限是唯一的：若 $a_n \\to L$ 且 $a_n \\to M$，则 $L = M$。\n\n**证明**：反证，设 $L \\ne M$，令 $\\varepsilon = \\frac{|L - M|}{2} > 0$。\n取 $N_1$、$N_2$ 分别对应两个极限，令 $n = \\max(N_1, N_2)$，则\n$$|L - M| \\le |L - a_n| + |a_n - M| \u003c \\varepsilon + \\varepsilon = |L - M|,$$\n矛盾。直观上：$a_n$ 不可能同时离两个不同的点都很近。\n-/\n\ntheorem tendsTo_unique {a : ℕ → ℝ} {L M : ℝ} (hL : TendsTo a L) (hM : TendsTo a M) :\n    L = M := by\n  by_contra hne\n  have hpos : 0 \u003c |L - M| := abs_pos.mpr (sub_ne_zero.mpr hne)\n  obtain ⟨N₁, hN₁⟩ := hL (|L - M| / 2) (by positivity)\n  obtain ⟨N₂, hN₂⟩ := hM (|L - M| / 2) (by positivity)\n  let n := max N₁ N₂\n  have h1 : |a n - L| \u003c |L - M| / 2 := hN₁ n (le_max_left _ _)\n  have h2 : |a n - M| \u003c |L - M| / 2 := hN₂ n (le_max_right _ _)\n  have h3 : |L - M| ≤ |a n - L| + |a n - M| := by\n    calc |L - M| = |(L - a n) + (a n - M)| := by congr 1; ring\n      _ ≤ |L - a n| + |a n - M| := abs_add_le _ _\n      _ = |a n - L| + |a n - M| := by rw [abs_sub_comm L]\n  linarith\n\n/-!\n这里的 `max N₁ N₂` 是一个反复出现的技巧：**同时满足多个\"充分大\"的条件**，\n只需取各个 $N$ 的最大值。`le_max_left a b : a ≤ max a b`。\n\n## 练习\n\n### 练习 4.1　常数列\n常数列 $c, c, c, \\ldots$ 收敛到 $c$。任何 $N$ 都可以！\n\n提示：`intro ε hε`，`use 0`，`intro n _`，然后 `simp`（它知道 $|c - c| = 0$），\n可能还需要 `exact hε` 或 `simpa using hε`。\n-/\n\ntheorem tendsTo_const (c : ℝ) : TendsTo (fun _ ↦ c) c := by\n  sorry\n\n/-!\n### 练习 4.2　加上常数\n若 $a_n \\to L$，则 $a_n + c \\to L + c$。\n\n提示：用 `obtain ⟨N, hN⟩ := h ε hε` 取出 $N$。\n注意 $a_n + c - (L + c) = a_n - L$。\n-/\n\ntheorem tendsTo_add_const {a : ℕ → ℝ} {L : ℝ} (c : ℝ) (h : TendsTo a L) :\n    TendsTo (fun n ↦ a n + c) (L + c) := by\n  sorry\n\n/-!\n### 练习 4.3　取负\n若 $a_n \\to L$，则 $-a_n \\to -L$。\n\n提示：$|-x| = |x|$ 在 Mathlib 中叫 `abs_neg`。\n-/\n\ntheorem tendsTo_neg {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) :\n    TendsTo (fun n ↦ -a n) (-L) := by\n  sorry\n\n/-!\n### 练习 4.4　平移不改变极限\n若 $a_n \\to L$，则对任意固定的 $k$，$a_{n+k} \\to L$。（去掉有限项不影响收敛性。）\n\n提示：`omega` 策略可以自动证明自然数之间的线性不等式，如 `n + k ≥ N`。\n-/\n\ntheorem tendsTo_shift {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) (k : ℕ) :\n    TendsTo (fun n ↦ a (n + k)) L := by\n  sorry\n\n/-!\n### 练习 4.5　综合运用\n利用例 4.2 和练习 4.2，证明 $\\frac{1}{n+1} + 3 \\to 3$。\n\n提示：`have h := tendsTo_add_const 3 tendsTo_one_div` 得到的极限是 `0 + 3`，\n用 `simpa using h` 化简。\n-/\n\ntheorem ex4_5 : TendsTo (fun n ↦ 1 / ((n : ℝ) + 1) + 3) 3 := by\n  sorry\n\n/-!\n### 练习 4.6　极限为零的等价刻画\n$a_n \\to L$ 当且仅当 $a_n - L \\to 0$。\n\n提示：`constructor` 分两个方向。每个方向里都是\"同一个 $N$ 就行\"。\n-/\n\ntheorem tendsTo_iff_sub {a : ℕ → ℝ} {L : ℝ} :\n    TendsTo a L ↔ TendsTo (fun n ↦ a n - L) 0 := by\n  sorry\n\n/-!\n### 练习 4.7 ★　绝对值的极限\n若 $a_n \\to L$，则 $|a_n| \\to |L|$。反过来对吗？（想一想 $a_n = (-1)^n$。）\n\n提示：Mathlib 中的 `abs_abs_sub_abs_le_abs_sub x y : |(|x| - |y|)| ≤ |x - y|`。\n-/\n\ntheorem tendsTo_abs {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) :\n    TendsTo (fun n ↦ |a n|) |L| := by\n  sorry\n\n/-!\n### 练习 4.8 ★　发散数列\n数列 $0, 1, 0, 1, \\ldots$ 不收敛到 $0$。\n\n提示：取 $\\varepsilon = \\frac12$。对手给出 $N$ 之后，考虑奇数项 $n = 2N + 1$，\n它 $\\ge N$ 且值为 $1$。`Nat.odd_iff`、`Nat.add_mod` 等可能有用，\n不过最简单的是用 `show` 和 `simp` 计算 `(2 * N + 1) % 2 = 1`。\n-/\n\ntheorem ex4_8 : ¬ TendsTo (fun n ↦ if n % 2 = 0 then 0 else 1) 0 := by\n  sorry\n\n/-!\n## 4.4 与 Mathlib 接轨\n\nMathlib 用更一般的**滤子**（filter）语言描述极限：\n`Filter.Tendsto a Filter.atTop (nhds L)`，读作\"当 $n$ 趋于无穷时 $a_n$ 趋于 $L$\"。\n下面的定理说明它与我们的定义完全一致。之后的章节中，\n当我们需要 Mathlib 里更深的定理时，就通过它来\"翻译\"。\n-/\n\ntheorem tendsTo_iff_tendsto (a : ℕ → ℝ) (L : ℝ) :\n    TendsTo a L ↔ Filter.Tendsto a Filter.atTop (nhds L) := by\n  rw [Metric.tendsto_atTop]\n  simp only [Real.dist_eq, TendsTo]\n\n/-!\n## 本章小结\n\n* 极限的定义是一个 $\\varepsilon$-$N$ 游戏：拿到 $\\varepsilon$，构造 $N$；\n* 先在草稿上倒推出 $N$ 应满足的条件，再写正式证明；\n* 多个条件同时成立：取 $N = \\max(N_1, N_2)$；\n* 证明\"任意接近\"时，阿基米德性质是找 $N$ 的标准工具。\n-/\n\nend Ch04\n","blocks":[{"t":"p","html":"\u003cp>终于来到了分析的核心概念：\u003cstrong>极限\u003c/strong>。\u003c/p>\n\u003cp>一个实数数列 \u003cspan class=\"math\" data-tex=\"a_0, a_1, a_2, \\ldots\">\u003ci>a\u003c/i>\u003csub>0\u003c/sub>, \u003ci>a\u003c/i>\u003csub>1\u003c/sub>, \u003ci>a\u003c/i>\u003csub>2\u003c/sub>, …\u003c/span> 就是一个函数 \u003cspan class=\"math\" data-tex=\"a : \\mathbb{N} \\to \\mathbb{R}\">\u003ci>a\u003c/i> : ℕ → ℝ\u003c/span>，在 Lean 中它的类型是 \u003ccode>ℕ → ℝ\u003c/code>，第 \u003cspan class=\"math\" data-tex=\"n\">\u003ci>n\u003c/i>\u003c/span> 项写作 \u003ccode>a n\u003c/code>。（注意：本书的数列从第 \u003cspan class=\"math\" data-tex=\"0\">0\u003c/span> 项开始。）\u003c/p>\n\u003ch2 id=\"ch04-s1\">4.1 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>-\u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span> 定义\u003c/h2>\n\u003cblockquote class=\"callout callout-def\">\u003cp>\u003cstrong>定义 4.1\u003c/strong>　称数列 \u003cspan class=\"math\" data-tex=\"(a_n)\">(\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>)\u003c/span> \u003cstrong>收敛\u003c/strong>到 \u003cspan class=\"math\" data-tex=\"L\">\u003ci>L\u003c/i>\u003c/span>，记作 \u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>，如果\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"\\forall \\varepsilon &gt; 0,\\ \\exists N \\in \\mathbb{N},\\ \\forall n \\ge N,\\ |a_n - L| &lt; \\varepsilon.\">∀ ε &gt; 0, ∃ \u003ci>N\u003c/i> ∈ ℕ, ∀ \u003ci>n\u003c/i> ≥ \u003ci>N\u003c/i>, |\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>L\u003c/i>| &lt; ε.\u003c/span>\u003c/div>\u003c/blockquote>\n\u003cp>可以把这个定义理解为一个\u003cstrong>游戏\u003c/strong>：\u003c/p>\n\u003col>\u003cli>对手先给出一个误差范围 \u003cspan class=\"math\" data-tex=\"\\varepsilon &gt; 0\">ε &gt; 0\u003c/span>（可能非常小）；\u003c/li>\u003cli>你需要找到一个 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span>；\u003c/li>\u003cli>然后对手可以任选 \u003cspan class=\"math\" data-tex=\"n \\ge N\">\u003ci>n\u003c/i> ≥ \u003ci>N\u003c/i>\u003c/span>，而你必须保证 \u003cspan class=\"math\" data-tex=\"|a_n - L| &lt; \\varepsilon\">|\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>L\u003c/i>| &lt; ε\u003c/span>。\u003c/li>\u003c/ol>\n\u003cp>如果无论对手给出什么 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>，你总能赢，那么 \u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>。证明的关键永远是第 2 步：\u003cstrong>根据 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span> 构造 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span>\u003c/strong>。\u003c/p>\n\u003cdiv class=\"widget\" data-widget=\"eps-n\">\u003c/div>"},{"t":"c","code":"/-- 数列 `a` 收敛到 `L`。 -/\ndef TendsTo (a : ℕ → ℝ) (L : ℝ) : Prop :=\n  ∀ ε > 0, ∃ N : ℕ, ∀ n ≥ N, |a n - L| \u003c ε","upto":844},{"t":"p","html":"\u003cp>\u003ccode>TendsTo a L\u003c/code> 的证明总是以 \u003ccode>intro ε hε\u003c/code> 开始（接受对手的 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>），然后 \u003ccode>use N\u003c/code>（给出你的 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span>），再 \u003ccode>intro n hn\u003c/code>（接受对手的 \u003cspan class=\"math\" data-tex=\"n\">\u003ci>n\u003c/i>\u003c/span>），最后估计不等式。\u003c/p>\n\u003ch2 id=\"ch04-s2\">4.2 第一个例子：\u003cspan class=\"math\" data-tex=\"\\frac{1}{n+1} \\to 0\">1/(\u003ci>n\u003c/i>+1) → 0\u003c/span>\u003c/h2>\n\u003cblockquote class=\"callout callout-example\">\u003cp>\u003cstrong>例 4.2\u003c/strong>　\u003cspan class=\"math\" data-tex=\"\\lim\\limits_{n \\to \\infty} \\frac{1}{n + 1} = 0\">lim\\limits\u003csub>\u003ci>n\u003c/i> → ∞\u003c/sub> 1/(\u003ci>n\u003c/i> + 1) = 0\u003c/span>。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>草稿\u003c/strong>（找 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span>）：我们需要 \u003cspan class=\"math\" data-tex=\"\\frac{1}{n+1} &lt; \\varepsilon\">1/(\u003ci>n\u003c/i>+1) &lt; ε\u003c/span>，即 \u003cspan class=\"math\" data-tex=\"n + 1 &gt; \\frac{1}{\\varepsilon}\">\u003ci>n\u003c/i> + 1 &gt; 1/ε\u003c/span>。由阿基米德性质，取自然数 \u003cspan class=\"math\" data-tex=\"N &gt; \\frac{1}{\\varepsilon}\">\u003ci>N\u003c/i> &gt; 1/ε\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"n \\ge N\">\u003ci>n\u003c/i> ≥ \u003ci>N\u003c/i>\u003c/span> 时 \u003cspan class=\"math\" data-tex=\"n + 1 &gt; N &gt; \\frac{1}{\\varepsilon}\">\u003ci>n\u003c/i> + 1 &gt; \u003ci>N\u003c/i> &gt; 1/ε\u003c/span>。\u003c/p>\n\u003cp>\u003cstrong>证明\u003c/strong>：下面每一步都与草稿对应。\u003ccode>exists_nat_gt\u003c/code> 是 Mathlib 中的阿基米德性质，\u003ccode>exact_mod_cast\u003c/code> 把自然数的不等式 \u003ccode>N ≤ n\u003c/code> 转化为实数的不等式。\u003c/p>"},{"t":"c","code":"theorem tendsTo_one_div : TendsTo (fun n ↦ 1 / ((n : ℝ) + 1)) 0 := by\n  intro ε hε\n  obtain ⟨N, hN⟩ := exists_nat_gt (1 / ε)\n  use N\n  intro n hn\n  have hn' : (N : ℝ) ≤ n := by exact_mod_cast hn\n  have hpos : (0 : ℝ) \u003c n + 1 := by positivity\n  show |1 / ((n : ℝ) + 1) - 0| \u003c ε\n  rw [sub_zero, abs_of_pos (by positivity), div_lt_iff₀ hpos]\n  -- 目标：1 \u003c ε * (n + 1)\n  have h1 : 1 / ε \u003c n + 1 := by linarith\n  rw [div_lt_iff₀ hε] at h1\n  linarith","upto":1788},{"t":"p","html":"\u003ch2 id=\"ch04-s3\">4.3 极限的唯一性\u003c/h2>\n\u003cblockquote class=\"callout callout-thm\">\u003cp>\u003cstrong>定理 4.3\u003c/strong>　收敛数列的极限是唯一的：若 \u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span> 且 \u003cspan class=\"math\" data-tex=\"a_n \\to M\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>M\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"L = M\">\u003ci>L\u003c/i> = \u003ci>M\u003c/i>\u003c/span>。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>证明\u003c/strong>：反证，设 \u003cspan class=\"math\" data-tex=\"L \\ne M\">\u003ci>L\u003c/i> ≠ \u003ci>M\u003c/i>\u003c/span>，令 \u003cspan class=\"math\" data-tex=\"\\varepsilon = \\frac{|L - M|}{2} &gt; 0\">ε = (|\u003ci>L\u003c/i> − \u003ci>M\u003c/i>|)/2 &gt; 0\u003c/span>。取 \u003cspan class=\"math\" data-tex=\"N_1\">\u003ci>N\u003c/i>\u003csub>1\u003c/sub>\u003c/span>、\u003cspan class=\"math\" data-tex=\"N_2\">\u003ci>N\u003c/i>\u003csub>2\u003c/sub>\u003c/span> 分别对应两个极限，令 \u003cspan class=\"math\" data-tex=\"n = \\max(N_1, N_2)\">\u003ci>n\u003c/i> = max(\u003ci>N\u003c/i>\u003csub>1\u003c/sub>, \u003ci>N\u003c/i>\u003csub>2\u003c/sub>)\u003c/span>，则\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"|L - M| \\le |L - a_n| + |a_n - M| &lt; \\varepsilon + \\varepsilon = |L - M|,\">|\u003ci>L\u003c/i> − \u003ci>M\u003c/i>| ≤ |\u003ci>L\u003c/i> − \u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>| + |\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>M\u003c/i>| &lt; ε + ε = |\u003ci>L\u003c/i> − \u003ci>M\u003c/i>|,\u003c/span>\u003c/div>\n\u003cp>矛盾。直观上：\u003cspan class=\"math\" data-tex=\"a_n\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>\u003c/span> 不可能同时离两个不同的点都很近。\u003c/p>"},{"t":"c","code":"theorem tendsTo_unique {a : ℕ → ℝ} {L M : ℝ} (hL : TendsTo a L) (hM : TendsTo a M) :\n    L = M := by\n  by_contra hne\n  have hpos : 0 \u003c |L - M| := abs_pos.mpr (sub_ne_zero.mpr hne)\n  obtain ⟨N₁, hN₁⟩ := hL (|L - M| / 2) (by positivity)\n  obtain ⟨N₂, hN₂⟩ := hM (|L - M| / 2) (by positivity)\n  let n := max N₁ N₂\n  have h1 : |a n - L| \u003c |L - M| / 2 := hN₁ n (le_max_left _ _)\n  have h2 : |a n - M| \u003c |L - M| / 2 := hN₂ n (le_max_right _ _)\n  have h3 : |L - M| ≤ |a n - L| + |a n - M| := by\n    calc |L - M| = |(L - a n) + (a n - M)| := by congr 1; ring\n      _ ≤ |L - a n| + |a n - M| := abs_add_le _ _\n      _ = |a n - L| + |a n - M| := by rw [abs_sub_comm L]\n  linarith","upto":2765},{"t":"p","html":"\u003cp>这里的 \u003ccode>max N₁ N₂\u003c/code> 是一个反复出现的技巧：\u003cstrong>同时满足多个&quot;充分大&quot;的条件\u003c/strong>，只需取各个 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span> 的最大值。\u003ccode>le_max_left a b : a ≤ max a b\u003c/code>。\u003c/p>\n\u003ch2 id=\"ch04-s4\">练习\u003c/h2>\n\u003ch3 id=\"ch04-s5\">练习 4.1　常数列\u003c/h3>\n\u003cp>常数列 \u003cspan class=\"math\" data-tex=\"c, c, c, \\ldots\">\u003ci>c\u003c/i>, \u003ci>c\u003c/i>, \u003ci>c\u003c/i>, …\u003c/span> 收敛到 \u003cspan class=\"math\" data-tex=\"c\">\u003ci>c\u003c/i>\u003c/span>。任何 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span> 都可以！\u003c/p>\n\u003cp>提示：\u003ccode>intro ε hε\u003c/code>，\u003ccode>use 0\u003c/code>，\u003ccode>intro n _\u003c/code>，然后 \u003ccode>simp\u003c/code>（它知道 \u003cspan class=\"math\" data-tex=\"|c - c| = 0\">|\u003ci>c\u003c/i> − \u003ci>c\u003c/i>| = 0\u003c/span>），可能还需要 \u003ccode>exact hε\u003c/code> 或 \u003ccode>simpa using hε\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem tendsTo_const (c : ℝ) : TendsTo (fun _ ↦ c) c := by\n  sorry","upto":3106,"ex":{"id":"ch04:tendsTo_const","name":"tendsTo_const","solution":"theorem tendsTo_const (c : ℝ) : TendsTo (fun _ ↦ c) c := by\n  intro ε hε\n  use 0\n  intro n _\n  simpa using hε"}},{"t":"p","html":"\u003ch3 id=\"ch04-s6\">练习 4.2　加上常数\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"a_n + c \\to L + c\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> + \u003ci>c\u003c/i> → \u003ci>L\u003c/i> + \u003ci>c\u003c/i>\u003c/span>。\u003c/p>\n\u003cp>提示：用 \u003ccode>obtain ⟨N, hN⟩ := h ε hε\u003c/code> 取出 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span>。注意 \u003cspan class=\"math\" data-tex=\"a_n + c - (L + c) = a_n - L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> + \u003ci>c\u003c/i> − (\u003ci>L\u003c/i> + \u003ci>c\u003c/i>) = \u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>L\u003c/i>\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem tendsTo_add_const {a : ℕ → ℝ} {L : ℝ} (c : ℝ) (h : TendsTo a L) :\n    TendsTo (fun n ↦ a n + c) (L + c) := by\n  sorry","upto":3369,"ex":{"id":"ch04:tendsTo_add_const","name":"tendsTo_add_const","solution":"theorem tendsTo_add_const {a : ℕ → ℝ} {L : ℝ} (c : ℝ) (h : TendsTo a L) :\n    TendsTo (fun n ↦ a n + c) (L + c) := by\n  intro ε hε\n  obtain ⟨N, hN⟩ := h ε hε\n  use N\n  intro n hn\n  show |a n + c - (L + c)| \u003c ε\n  rw [show a n + c - (L + c) = a n - L by ring]\n  exact hN n hn"}},{"t":"p","html":"\u003ch3 id=\"ch04-s7\">练习 4.3　取负\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"-a_n \\to -L\">−\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → −\u003ci>L\u003c/i>\u003c/span>。\u003c/p>\n\u003cp>提示：\u003cspan class=\"math\" data-tex=\"|-x| = |x|\">|−\u003ci>x\u003c/i>| = |\u003ci>x\u003c/i>|\u003c/span> 在 Mathlib 中叫 \u003ccode>abs_neg\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem tendsTo_neg {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) :\n    TendsTo (fun n ↦ -a n) (-L) := by\n  sorry","upto":3570,"ex":{"id":"ch04:tendsTo_neg","name":"tendsTo_neg","solution":"theorem tendsTo_neg {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) :\n    TendsTo (fun n ↦ -a n) (-L) := by\n  intro ε hε\n  obtain ⟨N, hN⟩ := h ε hε\n  use N\n  intro n hn\n  show |-a n - -L| \u003c ε\n  rw [show -a n - -L = -(a n - L) by ring, abs_neg]\n  exact hN n hn"}},{"t":"p","html":"\u003ch3 id=\"ch04-s8\">练习 4.4　平移不改变极限\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>，则对任意固定的 \u003cspan class=\"math\" data-tex=\"k\">\u003ci>k\u003c/i>\u003c/span>，\u003cspan class=\"math\" data-tex=\"a_{n+k} \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>+\u003ci>k\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>。（去掉有限项不影响收敛性。）\u003c/p>\n\u003cp>提示：\u003ccode>omega\u003c/code> 策略可以自动证明自然数之间的线性不等式，如 \u003ccode>n + k ≥ N\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem tendsTo_shift {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) (k : ℕ) :\n    TendsTo (fun n ↦ a (n + k)) L := by\n  sorry","upto":3820,"ex":{"id":"ch04:tendsTo_shift","name":"tendsTo_shift","solution":"theorem tendsTo_shift {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) (k : ℕ) :\n    TendsTo (fun n ↦ a (n + k)) L := by\n  intro ε hε\n  obtain ⟨N, hN⟩ := h ε hε\n  use N\n  intro n hn\n  exact hN (n + k) (by omega)"}},{"t":"p","html":"\u003ch3 id=\"ch04-s9\">练习 4.5　综合运用\u003c/h3>\n\u003cp>利用例 4.2 和练习 4.2，证明 \u003cspan class=\"math\" data-tex=\"\\frac{1}{n+1} + 3 \\to 3\">1/(\u003ci>n\u003c/i>+1) + 3 → 3\u003c/span>。\u003c/p>\n\u003cp>提示：\u003ccode>have h := tendsTo_add_const 3 tendsTo_one_div\u003c/code> 得到的极限是 \u003ccode>0 + 3\u003c/code>，用 \u003ccode>simpa using h\u003c/code> 化简。\u003c/p>"},{"t":"c","code":"theorem ex4_5 : TendsTo (fun n ↦ 1 / ((n : ℝ) + 1) + 3) 3 := by\n  sorry","upto":4053,"ex":{"id":"ch04:ex4_5","name":"ex4_5","solution":"theorem ex4_5 : TendsTo (fun n ↦ 1 / ((n : ℝ) + 1) + 3) 3 := by\n  have h := tendsTo_add_const 3 tendsTo_one_div\n  simpa using h"}},{"t":"p","html":"\u003ch3 id=\"ch04-s10\">练习 4.6　极限为零的等价刻画\u003c/h3>\n\u003cp>\u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span> 当且仅当 \u003cspan class=\"math\" data-tex=\"a_n - L \\to 0\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>L\u003c/i> → 0\u003c/span>。\u003c/p>\n\u003cp>提示：\u003ccode>constructor\u003c/code> 分两个方向。每个方向里都是&quot;同一个 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span> 就行&quot;。\u003c/p>"},{"t":"c","code":"theorem tendsTo_iff_sub {a : ℕ → ℝ} {L : ℝ} :\n    TendsTo a L ↔ TendsTo (fun n ↦ a n - L) 0 := by\n  sorry","upto":4268,"ex":{"id":"ch04:tendsTo_iff_sub","name":"tendsTo_iff_sub","solution":"theorem tendsTo_iff_sub {a : ℕ → ℝ} {L : ℝ} :\n    TendsTo a L ↔ TendsTo (fun n ↦ a n - L) 0 := by\n  constructor\n  · intro h ε hε\n    obtain ⟨N, hN⟩ := h ε hε\n    use N\n    intro n hn\n    simpa using hN n hn\n  · intro h ε hε\n    obtain ⟨N, hN⟩ := h ε hε\n    use N\n    intro n hn\n    simpa using hN n hn"}},{"t":"p","html":"\u003ch3 id=\"ch04-s11\">练习 4.7 ★　绝对值的极限\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"|a_n| \\to |L|\">|\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>| → |\u003ci>L\u003c/i>|\u003c/span>。反过来对吗？（想一想 \u003cspan class=\"math\" data-tex=\"a_n = (-1)^n\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> = (−1)\u003csup>\u003ci>n\u003c/i>\u003c/sup>\u003c/span>。）\u003c/p>\n\u003cp>提示：Mathlib 中的 \u003ccode>abs_abs_sub_abs_le_abs_sub x y : |(|x| - |y|)| ≤ |x - y|\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem tendsTo_abs {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) :\n    TendsTo (fun n ↦ |a n|) |L| := by\n  sorry","upto":4538,"ex":{"id":"ch04:tendsTo_abs","name":"tendsTo_abs","solution":"theorem tendsTo_abs {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) :\n    TendsTo (fun n ↦ |a n|) |L| := by\n  intro ε hε\n  obtain ⟨N, hN⟩ := h ε hε\n  use N\n  intro n hn\n  show |(|a n| - |L|)| \u003c ε\n  exact lt_of_le_of_lt (abs_abs_sub_abs_le_abs_sub (a n) L) (hN n hn)"}},{"t":"p","html":"\u003ch3 id=\"ch04-s12\">练习 4.8 ★　发散数列\u003c/h3>\n\u003cp>数列 \u003cspan class=\"math\" data-tex=\"0, 1, 0, 1, \\ldots\">0, 1, 0, 1, …\u003c/span> 不收敛到 \u003cspan class=\"math\" data-tex=\"0\">0\u003c/span>。\u003c/p>\n\u003cp>提示：取 \u003cspan class=\"math\" data-tex=\"\\varepsilon = \\frac12\">ε = \\frac12\u003c/span>。对手给出 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span> 之后，考虑奇数项 \u003cspan class=\"math\" data-tex=\"n = 2N + 1\">\u003ci>n\u003c/i> = 2\u003ci>N\u003c/i> + 1\u003c/span>，它 \u003cspan class=\"math\" data-tex=\"\\ge N\">≥ \u003ci>N\u003c/i>\u003c/span> 且值为 \u003cspan class=\"math\" data-tex=\"1\">1\u003c/span>。\u003ccode>Nat.odd_iff\u003c/code>、\u003ccode>Nat.add_mod\u003c/code> 等可能有用，不过最简单的是用 \u003ccode>show\u003c/code> 和 \u003ccode>simp\u003c/code> 计算 \u003ccode>(2 * N + 1) % 2 = 1\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem ex4_8 : ¬ TendsTo (fun n ↦ if n % 2 = 0 then 0 else 1) 0 := by\n  sorry","upto":4844,"ex":{"id":"ch04:ex4_8","name":"ex4_8","solution":"theorem ex4_8 : ¬ TendsTo (fun n ↦ if n % 2 = 0 then 0 else 1) 0 := by\n  intro h\n  obtain ⟨N, hN⟩ := h (1 / 2) (by norm_num)\n  have h1 := hN (2 * N + 1) (by omega)\n  have h2 : (2 * N + 1) % 2 = 1 := by omega\n  simp only [h2] at h1\n  norm_num at h1"}},{"t":"p","html":"\u003ch2 id=\"ch04-s13\">4.4 与 Mathlib 接轨\u003c/h2>\n\u003cp>Mathlib 用更一般的\u003cstrong>滤子\u003c/strong>（filter）语言描述极限：\u003ccode>Filter.Tendsto a Filter.atTop (nhds L)\u003c/code>，读作&quot;当 \u003cspan class=\"math\" data-tex=\"n\">\u003ci>n\u003c/i>\u003c/span> 趋于无穷时 \u003cspan class=\"math\" data-tex=\"a_n\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>\u003c/span> 趋于 \u003cspan class=\"math\" data-tex=\"L\">\u003ci>L\u003c/i>\u003c/span>&quot;。下面的定理说明它与我们的定义完全一致。之后的章节中，当我们需要 Mathlib 里更深的定理时，就通过它来&quot;翻译&quot;。\u003c/p>"},{"t":"c","code":"theorem tendsTo_iff_tendsto (a : ℕ → ℝ) (L : ℝ) :\n    TendsTo a L ↔ Filter.Tendsto a Filter.atTop (nhds L) := by\n  rw [Metric.tendsto_atTop]\n  simp only [Real.dist_eq, TendsTo]","upto":5217},{"t":"p","html":"\u003ch2 id=\"ch04-s14\">本章小结\u003c/h2>\n\u003cul>\u003cli>极限的定义是一个 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>-\u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span> 游戏：拿到 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>，构造 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span>；\u003c/li>\u003cli>先在草稿上倒推出 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span> 应满足的条件，再写正式证明；\u003c/li>\u003cli>多个条件同时成立：取 \u003cspan class=\"math\" data-tex=\"N = \\max(N_1, N_2)\">\u003ci>N\u003c/i> = max(\u003ci>N\u003c/i>\u003csub>1\u003c/sub>, \u003ci>N\u003c/i>\u003csub>2\u003c/sub>)\u003c/span>；\u003c/li>\u003cli>证明&quot;任意接近&quot;时，阿基米德性质是找 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span> 的标准工具。\u003c/li>\u003c/ul>"}]},{"id":"ch05","num":5,"title":"极限的运算法则与夹逼定理","summary":"和、积的极限，收敛数列有界，夹逼定理与保序性。","file":"Analysis/Ch05_LimitLaws.lean","exercises":6,"source":"import Mathlib\n\n/-!\n# 第 5 章　极限的运算法则与夹逼定理\n\n逐个用 $\\varepsilon$-$N$ 定义验证极限是很累的。本章证明一组**运算法则**：\n和、差、数乘、乘积的极限等于极限的和、差、数乘、乘积。有了它们，\n复杂数列的极限就可以由简单数列\"组装\"出来。\n\n## 5.0 预备：上一章的定义与结论\n\n每一章都是一个独立的 Lean 文件，所以我们先把需要的定义和定理复制过来。\n（它们的证明就是上一章练习的参考答案。）\n-/\n\nnamespace Ch05\n\n/-- 数列 `a` 收敛到 `L`。 -/\ndef TendsTo (a : ℕ → ℝ) (L : ℝ) : Prop :=\n  ∀ ε > 0, ∃ N : ℕ, ∀ n ≥ N, |a n - L| \u003c ε\n\ntheorem tendsTo_const (c : ℝ) : TendsTo (fun _ ↦ c) c := by\n  intro ε hε\n  use 0\n  intro n _\n  simpa using hε\n\ntheorem tendsTo_one_div : TendsTo (fun n ↦ 1 / ((n : ℝ) + 1)) 0 := by\n  intro ε hε\n  obtain ⟨N, hN⟩ := exists_nat_gt (1 / ε)\n  use N\n  intro n hn\n  have hn' : (N : ℝ) ≤ n := by exact_mod_cast hn\n  have hpos : (0 : ℝ) \u003c n + 1 := by positivity\n  show |1 / ((n : ℝ) + 1) - 0| \u003c ε\n  rw [sub_zero, abs_of_pos (by positivity), div_lt_iff₀ hpos]\n  have h1 : 1 / ε \u003c n + 1 := by linarith\n  rw [div_lt_iff₀ hε] at h1\n  linarith\n\n/-!\n## 5.1 和的极限：$\\frac{\\varepsilon}{2}$ 技巧\n\n> **定理 5.1**　若 $a_n \\to L$，$b_n \\to M$，则 $a_n + b_n \\to L + M$。\n\n**草稿**：由三角不等式\n$$|(a_n + b_n) - (L + M)| \\le |a_n - L| + |b_n - M|.$$\n只要让右边两项**各自**小于 $\\frac{\\varepsilon}{2}$ 即可。所以对 $a$ 和 $b$ 分别使用\n$\\frac{\\varepsilon}{2}$ 得到 $N_1, N_2$，再取 $N = \\max(N_1, N_2)$。\n\n这就是著名的 **$\\frac{\\varepsilon}{2}$ 技巧**：对手给你 $\\varepsilon$，\n你把它\"分给\"两个子问题。\n-/\n\ntheorem tendsTo_add {a b : ℕ → ℝ} {L M : ℝ} (ha : TendsTo a L) (hb : TendsTo b M) :\n    TendsTo (fun n ↦ a n + b n) (L + M) := by\n  intro ε hε\n  obtain ⟨N₁, hN₁⟩ := ha (ε / 2) (by positivity)\n  obtain ⟨N₂, hN₂⟩ := hb (ε / 2) (by positivity)\n  use max N₁ N₂\n  intro n hn\n  have h1 := hN₁ n (le_of_max_le_left hn)\n  have h2 := hN₂ n (le_of_max_le_right hn)\n  calc |a n + b n - (L + M)| = |(a n - L) + (b n - M)| := by congr 1; ring\n    _ ≤ |a n - L| + |b n - M| := abs_add_le _ _\n    _ \u003c ε / 2 + ε / 2 := by linarith\n    _ = ε := by ring\n\n/-!\n## 5.2 收敛数列有界\n\n> **定义 5.2**　数列 $(a_n)$ **有界**，如果存在 $C > 0$ 使得对所有 $n$，$|a_n| \\le C$。\n\n> **定理 5.3**　收敛数列必有界。\n\n**证明**：取 $\\varepsilon = 1$ 得到 $N$。当 $n \\ge N$ 时 $|a_n| \\le |a_n - L| + |L| \u003c 1 + |L|$。\n前面只有有限项 $a_0, \\ldots, a_{N-1}$，它们的绝对值之和也是有限的。令\n$$C = |a_0| + |a_1| + \\cdots + |a_{N-1}| + |L| + 1,$$\n则所有项都满足 $|a_n| \\le C$。\n\n在 Lean 中，有限和 $\\sum_{i \u003c N} |a_i|$ 写作 `∑ i ∈ Finset.range N, |a i|`。\n`Finset.single_le_sum` 说的是：非负项的和不小于其中任何一项。\n-/\n\n/-- 数列 `a` 有界。 -/\ndef SeqBounded (a : ℕ → ℝ) : Prop :=\n  ∃ C, 0 \u003c C ∧ ∀ n, |a n| ≤ C\n\ntheorem bounded_of_tendsTo {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) : SeqBounded a := by\n  obtain ⟨N, hN⟩ := h 1 one_pos\n  have hsum : 0 ≤ ∑ i ∈ Finset.range N, |a i| :=\n    Finset.sum_nonneg (fun i _ ↦ abs_nonneg (a i))\n  refine ⟨(∑ i ∈ Finset.range N, |a i|) + |L| + 1, by positivity, ?_⟩\n  intro n\n  rcases lt_or_ge n N with hn | hn\n  · -- 情形 n \u003c N：|a n| 是有限和中的一项\n    have : |a n| ≤ ∑ i ∈ Finset.range N, |a i| :=\n      Finset.single_le_sum (f := fun i ↦ |a i|) (fun i _ ↦ abs_nonneg (a i))\n        (Finset.mem_range.mpr hn)\n    linarith [abs_nonneg L]\n  · -- 情形 n ≥ N：|a n| ≤ |a n - L| + |L| \u003c 1 + |L|\n    have h1 := hN n hn\n    have h2 : |a n| ≤ |a n - L| + |L| := by\n      calc |a n| = |(a n - L) + L| := by congr 1; ring\n        _ ≤ |a n - L| + |L| := abs_add_le _ _\n    linarith\n\n/-!\n## 5.3 乘积的极限\n\n> **定理 5.4**　若 $a_n \\to L$，$b_n \\to M$，则 $a_n b_n \\to LM$。\n\n**草稿**：关键是\"加一项减一项\"：\n$$a_n b_n - LM = a_n(b_n - M) + M(a_n - L).$$\n由定理 5.3，$|a_n| \\le C$。于是\n$$|a_n b_n - LM| \\le C|b_n - M| + |M||a_n - L|.$$\n让 $|b_n - M| \u003c \\frac{\\varepsilon}{2C}$，$|a_n - L| \u003c \\frac{\\varepsilon}{2(|M|+1)}$\n（用 $|M| + 1$ 而不是 $|M|$，是为了避免 $M = 0$ 时除以零）。\n-/\n\ntheorem tendsTo_mul {a b : ℕ → ℝ} {L M : ℝ} (ha : TendsTo a L) (hb : TendsTo b M) :\n    TendsTo (fun n ↦ a n * b n) (L * M) := by\n  obtain ⟨C, hC, hCa⟩ := bounded_of_tendsTo ha\n  intro ε hε\n  obtain ⟨N₁, hN₁⟩ := ha (ε / (2 * (|M| + 1))) (by positivity)\n  obtain ⟨N₂, hN₂⟩ := hb (ε / (2 * C)) (by positivity)\n  use max N₁ N₂\n  intro n hn\n  have h1 := hN₁ n (le_of_max_le_left hn)\n  have h2 := hN₂ n (le_of_max_le_right hn)\n  have hM : |M| ≤ |M| + 1 := by linarith\n  calc |a n * b n - L * M| = |a n * (b n - M) + M * (a n - L)| := by congr 1; ring\n    _ ≤ |a n * (b n - M)| + |M * (a n - L)| := abs_add_le _ _\n    _ = |a n| * |b n - M| + |M| * |a n - L| := by rw [abs_mul, abs_mul]\n    _ ≤ C * |b n - M| + (|M| + 1) * |a n - L| := by gcongr; exact hCa n\n    _ \u003c C * (ε / (2 * C)) + (|M| + 1) * (ε / (2 * (|M| + 1))) := by gcongr\n    _ = ε := by field_simp; ring\n\n/-!\n`gcongr`（generalized congruence）会把形如 $x_1 y_1 + x_2 y_2 \\le x_1' y_1' + x_2' y_2'$\n的目标拆成各个因子的比较 $x_i \\le x_i'$、$y_i \\le y_i'$，并自动处理非负性条件。\n`field_simp` 负责通分化简分式。\n\n## 练习\n\n### 练习 5.1　数乘的极限\n若 $a_n \\to L$，则 $c\\, a_n \\to cL$。\n\n提示：可以直接用 `tendsTo_mul` 和 `tendsTo_const`！\n注意 `tendsTo_mul (tendsTo_const c) h` 得到的数列是 `fun n ↦ (fun _ ↦ c) n * a n`，\n和目标只差一步化简，可以用 `exact` 直接给出（Lean 会自动识别），或用 `simpa using`。\n-/\n\ntheorem tendsTo_const_mul {a : ℕ → ℝ} {L : ℝ} (c : ℝ) (h : TendsTo a L) :\n    TendsTo (fun n ↦ c * a n) (c * L) := by\n  sorry\n\n/-!\n### 练习 5.2　差的极限\n若 $a_n \\to L$，$b_n \\to M$，则 $a_n - b_n \\to L - M$。\n\n提示：可以模仿定理 5.1 的证明，也可以利用 $a_n - b_n = a_n + (-1) b_n$。\n-/\n\ntheorem tendsTo_sub {a b : ℕ → ℝ} {L M : ℝ} (ha : TendsTo a L) (hb : TendsTo b M) :\n    TendsTo (fun n ↦ a n - b n) (L - M) := by\n  sorry\n\n/-!\n### 练习 5.3　夹逼定理\n若 $a_n \\le b_n \\le c_n$，且 $a_n \\to L$，$c_n \\to L$，则 $b_n \\to L$。\n\n提示：用 `abs_lt` 把 `|a n - L| \u003c ε` 等全部拆开，剩下的交给 `linarith`。\n`rw [abs_lt] at h1 h2 ⊢` 可以同时改写多个假设和目标（`⊢` 表示目标）。\n-/\n\ntheorem squeeze {a b c : ℕ → ℝ} {L : ℝ} (ha : TendsTo a L) (hc : TendsTo c L)\n    (hab : ∀ n, a n ≤ b n) (hbc : ∀ n, b n ≤ c n) : TendsTo b L := by\n  sorry\n\n/-!\n### 练习 5.4　平方的极限\n若 $a_n \\to L$，则 $a_n^2 \\to L^2$。\n\n提示：用 `tendsTo_mul`，然后用 `simpa [sq] using ...`（`sq x : x ^ 2 = x * x`）。\n-/\n\ntheorem tendsTo_sq {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) :\n    TendsTo (fun n ↦ a n ^ 2) (L ^ 2) := by\n  sorry\n\n/-!\n### 练习 5.5 ★　保号性与保序性\n若 $a_n \\to L$，$b_n \\to M$，且对所有 $n$ 有 $a_n \\le b_n$，则 $L \\le M$。\n\n提示：反证。若 $M \u003c L$，取 $\\varepsilon = \\frac{L - M}{2}$，在足够大的 $n$ 处\n会得到 $b_n \u003c \\frac{L+M}{2} \u003c a_n$。\n-/\n\ntheorem le_of_tendsTo {a b : ℕ → ℝ} {L M : ℝ} (ha : TendsTo a L) (hb : TendsTo b M)\n    (h : ∀ n, a n ≤ b n) : L ≤ M := by\n  sorry\n\n/-!\n### 练习 5.6 ★　计算一个具体的极限\n证明 $\\displaystyle \\lim_{n \\to \\infty} \\frac{2n + 1}{n + 1} = 2$。\n\n提示：$\\frac{2n+1}{n+1} = 2 - \\frac{1}{n+1}$。先用运算法则得到\n`h : TendsTo (fun n ↦ 2 - 1 / ((n : ℝ) + 1)) (2 - 0)`，然后用 `convert h using 1` 把目标\n化为两个等式：数列相等（用 `funext n`，再 `field_simp`、`ring`）和极限相等（`norm_num`）。\n-/\n\ntheorem ex5_6 : TendsTo (fun n ↦ (2 * (n : ℝ) + 1) / ((n : ℝ) + 1)) 2 := by\n  sorry\n\n/-!\n## 本章小结\n\n* **$\\frac{\\varepsilon}{2}$ 技巧**：把误差分给几个部分；\n* **加一项减一项**：$a_n b_n - LM = a_n(b_n - M) + M(a_n - L)$；\n* 收敛数列有界，这是证明乘积法则的关键一步；\n* 夹逼定理与保序性让我们可以通过不等式来研究极限。\n-/\n\nend Ch05\n","blocks":[{"t":"p","html":"\u003cp>逐个用 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>-\u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span> 定义验证极限是很累的。本章证明一组\u003cstrong>运算法则\u003c/strong>：和、差、数乘、乘积的极限等于极限的和、差、数乘、乘积。有了它们，复杂数列的极限就可以由简单数列&quot;组装&quot;出来。\u003c/p>\n\u003ch2 id=\"ch05-s1\">5.0 预备：上一章的定义与结论\u003c/h2>\n\u003cp>每一章都是一个独立的 Lean 文件，所以我们先把需要的定义和定理复制过来。（它们的证明就是上一章练习的参考答案。）\u003c/p>"},{"t":"c","code":"/-- 数列 `a` 收敛到 `L`。 -/\ndef TendsTo (a : ℕ → ℝ) (L : ℝ) : Prop :=\n  ∀ ε > 0, ∃ N : ℕ, ∀ n ≥ N, |a n - L| \u003c ε\n\ntheorem tendsTo_const (c : ℝ) : TendsTo (fun _ ↦ c) c := by\n  intro ε hε\n  use 0\n  intro n _\n  simpa using hε\n\ntheorem tendsTo_one_div : TendsTo (fun n ↦ 1 / ((n : ℝ) + 1)) 0 := by\n  intro ε hε\n  obtain ⟨N, hN⟩ := exists_nat_gt (1 / ε)\n  use N\n  intro n hn\n  have hn' : (N : ℝ) ≤ n := by exact_mod_cast hn\n  have hpos : (0 : ℝ) \u003c n + 1 := by positivity\n  show |1 / ((n : ℝ) + 1) - 0| \u003c ε\n  rw [sub_zero, abs_of_pos (by positivity), div_lt_iff₀ hpos]\n  have h1 : 1 / ε \u003c n + 1 := by linarith\n  rw [div_lt_iff₀ hε] at h1\n  linarith","upto":889},{"t":"p","html":"\u003ch2 id=\"ch05-s2\">5.1 和的极限：\u003cspan class=\"math\" data-tex=\"\\frac{\\varepsilon}{2}\">ε/2\u003c/span> 技巧\u003c/h2>\n\u003cblockquote class=\"callout callout-thm\">\u003cp>\u003cstrong>定理 5.1\u003c/strong>　若 \u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>，\u003cspan class=\"math\" data-tex=\"b_n \\to M\">\u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>M\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"a_n + b_n \\to L + M\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> + \u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i> + \u003ci>M\u003c/i>\u003c/span>。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>草稿\u003c/strong>：由三角不等式\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"|(a_n + b_n) - (L + M)| \\le |a_n - L| + |b_n - M|.\">|(\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> + \u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>) − (\u003ci>L\u003c/i> + \u003ci>M\u003c/i>)| ≤ |\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>L\u003c/i>| + |\u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>M\u003c/i>|.\u003c/span>\u003c/div>\n\u003cp>只要让右边两项\u003cstrong>各自\u003c/strong>小于 \u003cspan class=\"math\" data-tex=\"\\frac{\\varepsilon}{2}\">ε/2\u003c/span> 即可。所以对 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> 和 \u003cspan class=\"math\" data-tex=\"b\">\u003ci>b\u003c/i>\u003c/span> 分别使用\u003cspan class=\"math\" data-tex=\"\\frac{\\varepsilon}{2}\">ε/2\u003c/span> 得到 \u003cspan class=\"math\" data-tex=\"N_1, N_2\">\u003ci>N\u003c/i>\u003csub>1\u003c/sub>, \u003ci>N\u003c/i>\u003csub>2\u003c/sub>\u003c/span>，再取 \u003cspan class=\"math\" data-tex=\"N = \\max(N_1, N_2)\">\u003ci>N\u003c/i> = max(\u003ci>N\u003c/i>\u003csub>1\u003c/sub>, \u003ci>N\u003c/i>\u003csub>2\u003c/sub>)\u003c/span>。\u003c/p>\n\u003cp>这就是著名的 \u003cstrong>\u003cspan class=\"math\" data-tex=\"\\frac{\\varepsilon}{2}\">ε/2\u003c/span> 技巧\u003c/strong>：对手给你 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>，你把它&quot;分给&quot;两个子问题。\u003c/p>"},{"t":"c","code":"theorem tendsTo_add {a b : ℕ → ℝ} {L M : ℝ} (ha : TendsTo a L) (hb : TendsTo b M) :\n    TendsTo (fun n ↦ a n + b n) (L + M) := by\n  intro ε hε\n  obtain ⟨N₁, hN₁⟩ := ha (ε / 2) (by positivity)\n  obtain ⟨N₂, hN₂⟩ := hb (ε / 2) (by positivity)\n  use max N₁ N₂\n  intro n hn\n  have h1 := hN₁ n (le_of_max_le_left hn)\n  have h2 := hN₂ n (le_of_max_le_right hn)\n  calc |a n + b n - (L + M)| = |(a n - L) + (b n - M)| := by congr 1; ring\n    _ ≤ |a n - L| + |b n - M| := abs_add_le _ _\n    _ \u003c ε / 2 + ε / 2 := by linarith\n    _ = ε := by ring","upto":1806},{"t":"p","html":"\u003ch2 id=\"ch05-s3\">5.2 收敛数列有界\u003c/h2>\n\u003cblockquote class=\"callout callout-def\">\u003cp>\u003cstrong>定义 5.2\u003c/strong>　数列 \u003cspan class=\"math\" data-tex=\"(a_n)\">(\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>)\u003c/span> \u003cstrong>有界\u003c/strong>，如果存在 \u003cspan class=\"math\" data-tex=\"C &gt; 0\">\u003ci>C\u003c/i> &gt; 0\u003c/span> 使得对所有 \u003cspan class=\"math\" data-tex=\"n\">\u003ci>n\u003c/i>\u003c/span>，\u003cspan class=\"math\" data-tex=\"|a_n| \\le C\">|\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>| ≤ \u003ci>C\u003c/i>\u003c/span>。\u003c/p>\u003c/blockquote>\n\u003cblockquote class=\"callout callout-thm\">\u003cp>\u003cstrong>定理 5.3\u003c/strong>　收敛数列必有界。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>证明\u003c/strong>：取 \u003cspan class=\"math\" data-tex=\"\\varepsilon = 1\">ε = 1\u003c/span> 得到 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span>。当 \u003cspan class=\"math\" data-tex=\"n \\ge N\">\u003ci>n\u003c/i> ≥ \u003ci>N\u003c/i>\u003c/span> 时 \u003cspan class=\"math\" data-tex=\"|a_n| \\le |a_n - L| + |L| &lt; 1 + |L|\">|\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>| ≤ |\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>L\u003c/i>| + |\u003ci>L\u003c/i>| &lt; 1 + |\u003ci>L\u003c/i>|\u003c/span>。前面只有有限项 \u003cspan class=\"math\" data-tex=\"a_0, \\ldots, a_{N-1}\">\u003ci>a\u003c/i>\u003csub>0\u003c/sub>, …, \u003ci>a\u003c/i>\u003csub>\u003ci>N\u003c/i>−1\u003c/sub>\u003c/span>，它们的绝对值之和也是有限的。令\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"C = |a_0| + |a_1| + \\cdots + |a_{N-1}| + |L| + 1,\">\u003ci>C\u003c/i> = |\u003ci>a\u003c/i>\u003csub>0\u003c/sub>| + |\u003ci>a\u003c/i>\u003csub>1\u003c/sub>| + ⋯ + |\u003ci>a\u003c/i>\u003csub>\u003ci>N\u003c/i>−1\u003c/sub>| + |\u003ci>L\u003c/i>| + 1,\u003c/span>\u003c/div>\n\u003cp>则所有项都满足 \u003cspan class=\"math\" data-tex=\"|a_n| \\le C\">|\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>| ≤ \u003ci>C\u003c/i>\u003c/span>。\u003c/p>\n\u003cp>在 Lean 中，有限和 \u003cspan class=\"math\" data-tex=\"\\sum_{i &lt; N} |a_i|\">∑\u003csub>\u003ci>i\u003c/i> &lt; \u003ci>N\u003c/i>\u003c/sub> |\u003ci>a\u003c/i>\u003csub>\u003ci>i\u003c/i>\u003c/sub>|\u003c/span> 写作 \u003ccode>∑ i ∈ Finset.range N, |a i|\u003c/code>。\u003ccode>Finset.single_le_sum\u003c/code> 说的是：非负项的和不小于其中任何一项。\u003c/p>"},{"t":"c","code":"/-- 数列 `a` 有界。 -/\ndef SeqBounded (a : ℕ → ℝ) : Prop :=\n  ∃ C, 0 \u003c C ∧ ∀ n, |a n| ≤ C\n\ntheorem bounded_of_tendsTo {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) : SeqBounded a := by\n  obtain ⟨N, hN⟩ := h 1 one_pos\n  have hsum : 0 ≤ ∑ i ∈ Finset.range N, |a i| :=\n    Finset.sum_nonneg (fun i _ ↦ abs_nonneg (a i))\n  refine ⟨(∑ i ∈ Finset.range N, |a i|) + |L| + 1, by positivity, ?_⟩\n  intro n\n  rcases lt_or_ge n N with hn | hn\n  · -- 情形 n \u003c N：|a n| 是有限和中的一项\n    have : |a n| ≤ ∑ i ∈ Finset.range N, |a i| :=\n      Finset.single_le_sum (f := fun i ↦ |a i|) (fun i _ ↦ abs_nonneg (a i))\n        (Finset.mem_range.mpr hn)\n    linarith [abs_nonneg L]\n  · -- 情形 n ≥ N：|a n| ≤ |a n - L| + |L| \u003c 1 + |L|\n    have h1 := hN n hn\n    have h2 : |a n| ≤ |a n - L| + |L| := by\n      calc |a n| = |(a n - L) + L| := by congr 1; ring\n        _ ≤ |a n - L| + |L| := abs_add_le _ _\n    linarith","upto":3116},{"t":"p","html":"\u003ch2 id=\"ch05-s4\">5.3 乘积的极限\u003c/h2>\n\u003cblockquote class=\"callout callout-thm\">\u003cp>\u003cstrong>定理 5.4\u003c/strong>　若 \u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>，\u003cspan class=\"math\" data-tex=\"b_n \\to M\">\u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>M\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"a_n b_n \\to LM\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> \u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → LM\u003c/span>。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>草稿\u003c/strong>：关键是&quot;加一项减一项&quot;：\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"a_n b_n - LM = a_n(b_n - M) + M(a_n - L).\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> \u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − LM = \u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>(\u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>M\u003c/i>) + \u003ci>M\u003c/i>(\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>L\u003c/i>).\u003c/span>\u003c/div>\n\u003cp>由定理 5.3，\u003cspan class=\"math\" data-tex=\"|a_n| \\le C\">|\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>| ≤ \u003ci>C\u003c/i>\u003c/span>。于是\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"|a_n b_n - LM| \\le C|b_n - M| + |M||a_n - L|.\">|\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> \u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − LM| ≤ \u003ci>C\u003c/i>|\u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>M\u003c/i>| + |\u003ci>M\u003c/i>||\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>L\u003c/i>|.\u003c/span>\u003c/div>\n\u003cp>让 \u003cspan class=\"math\" data-tex=\"|b_n - M| &lt; \\frac{\\varepsilon}{2C}\">|\u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>M\u003c/i>| &lt; ε/2\u003ci>C\u003c/i>\u003c/span>，\u003cspan class=\"math\" data-tex=\"|a_n - L| &lt; \\frac{\\varepsilon}{2(|M|+1)}\">|\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>L\u003c/i>| &lt; ε/(2(|\u003ci>M\u003c/i>|+1))\u003c/span>（用 \u003cspan class=\"math\" data-tex=\"|M| + 1\">|\u003ci>M\u003c/i>| + 1\u003c/span> 而不是 \u003cspan class=\"math\" data-tex=\"|M|\">|\u003ci>M\u003c/i>|\u003c/span>，是为了避免 \u003cspan class=\"math\" data-tex=\"M = 0\">\u003ci>M\u003c/i> = 0\u003c/span> 时除以零）。\u003c/p>"},{"t":"c","code":"theorem tendsTo_mul {a b : ℕ → ℝ} {L M : ℝ} (ha : TendsTo a L) (hb : TendsTo b M) :\n    TendsTo (fun n ↦ a n * b n) (L * M) := by\n  obtain ⟨C, hC, hCa⟩ := bounded_of_tendsTo ha\n  intro ε hε\n  obtain ⟨N₁, hN₁⟩ := ha (ε / (2 * (|M| + 1))) (by positivity)\n  obtain ⟨N₂, hN₂⟩ := hb (ε / (2 * C)) (by positivity)\n  use max N₁ N₂\n  intro n hn\n  have h1 := hN₁ n (le_of_max_le_left hn)\n  have h2 := hN₂ n (le_of_max_le_right hn)\n  have hM : |M| ≤ |M| + 1 := by linarith\n  calc |a n * b n - L * M| = |a n * (b n - M) + M * (a n - L)| := by congr 1; ring\n    _ ≤ |a n * (b n - M)| + |M * (a n - L)| := abs_add_le _ _\n    _ = |a n| * |b n - M| + |M| * |a n - L| := by rw [abs_mul, abs_mul]\n    _ ≤ C * |b n - M| + (|M| + 1) * |a n - L| := by gcongr; exact hCa n\n    _ \u003c C * (ε / (2 * C)) + (|M| + 1) * (ε / (2 * (|M| + 1))) := by gcongr\n    _ = ε := by field_simp; ring","upto":4326},{"t":"p","html":"\u003cp>\u003ccode>gcongr\u003c/code>（generalized congruence）会把形如 \u003cspan class=\"math\" data-tex=\"x_1 y_1 + x_2 y_2 \\le x_1' y_1' + x_2' y_2'\">\u003ci>x\u003c/i>\u003csub>1\u003c/sub> \u003ci>y\u003c/i>\u003csub>1\u003c/sub> + \u003ci>x\u003c/i>\u003csub>2\u003c/sub> \u003ci>y\u003c/i>\u003csub>2\u003c/sub> ≤ \u003ci>x\u003c/i>\u003csub>1\u003c/sub>' \u003ci>y\u003c/i>\u003csub>1\u003c/sub>' + \u003ci>x\u003c/i>\u003csub>2\u003c/sub>' \u003ci>y\u003c/i>\u003csub>2\u003c/sub>'\u003c/span>的目标拆成各个因子的比较 \u003cspan class=\"math\" data-tex=\"x_i \\le x_i'\">\u003ci>x\u003c/i>\u003csub>\u003ci>i\u003c/i>\u003c/sub> ≤ \u003ci>x\u003c/i>\u003csub>\u003ci>i\u003c/i>\u003c/sub>'\u003c/span>、\u003cspan class=\"math\" data-tex=\"y_i \\le y_i'\">\u003ci>y\u003c/i>\u003csub>\u003ci>i\u003c/i>\u003c/sub> ≤ \u003ci>y\u003c/i>\u003csub>\u003ci>i\u003c/i>\u003c/sub>'\u003c/span>，并自动处理非负性条件。\u003ccode>field_simp\u003c/code> 负责通分化简分式。\u003c/p>\n\u003ch2 id=\"ch05-s5\">练习\u003c/h2>\n\u003ch3 id=\"ch05-s6\">练习 5.1　数乘的极限\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"c\\, a_n \\to cL\">\u003ci>c\u003c/i> \u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → cL\u003c/span>。\u003c/p>\n\u003cp>提示：可以直接用 \u003ccode>tendsTo_mul\u003c/code> 和 \u003ccode>tendsTo_const\u003c/code>！注意 \u003ccode>tendsTo_mul (tendsTo_const c) h\u003c/code> 得到的数列是 \u003ccode>fun n ↦ (fun _ ↦ c) n * a n\u003c/code>，和目标只差一步化简，可以用 \u003ccode>exact\u003c/code> 直接给出（Lean 会自动识别），或用 \u003ccode>simpa using\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem tendsTo_const_mul {a : ℕ → ℝ} {L : ℝ} (c : ℝ) (h : TendsTo a L) :\n    TendsTo (fun n ↦ c * a n) (c * L) := by\n  sorry","upto":4856,"ex":{"id":"ch05:tendsTo_const_mul","name":"tendsTo_const_mul","solution":"theorem tendsTo_const_mul {a : ℕ → ℝ} {L : ℝ} (c : ℝ) (h : TendsTo a L) :\n    TendsTo (fun n ↦ c * a n) (c * L) := by\n  exact tendsTo_mul (tendsTo_const c) h"}},{"t":"p","html":"\u003ch3 id=\"ch05-s7\">练习 5.2　差的极限\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>，\u003cspan class=\"math\" data-tex=\"b_n \\to M\">\u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>M\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"a_n - b_n \\to L - M\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i> − \u003ci>M\u003c/i>\u003c/span>。\u003c/p>\n\u003cp>提示：可以模仿定理 5.1 的证明，也可以利用 \u003cspan class=\"math\" data-tex=\"a_n - b_n = a_n + (-1) b_n\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> = \u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> + (−1) \u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem tendsTo_sub {a b : ℕ → ℝ} {L M : ℝ} (ha : TendsTo a L) (hb : TendsTo b M) :\n    TendsTo (fun n ↦ a n - b n) (L - M) := by\n  sorry","upto":5125,"ex":{"id":"ch05:tendsTo_sub","name":"tendsTo_sub","solution":"theorem tendsTo_sub {a b : ℕ → ℝ} {L M : ℝ} (ha : TendsTo a L) (hb : TendsTo b M) :\n    TendsTo (fun n ↦ a n - b n) (L - M) := by\n  have h := tendsTo_add ha (tendsTo_const_mul (-1) hb)\n  simpa [sub_eq_add_neg] using h"}},{"t":"p","html":"\u003ch3 id=\"ch05-s8\">练习 5.3　夹逼定理\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"a_n \\le b_n \\le c_n\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> ≤ \u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> ≤ \u003ci>c\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>\u003c/span>，且 \u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>，\u003cspan class=\"math\" data-tex=\"c_n \\to L\">\u003ci>c\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"b_n \\to L\">\u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>。\u003c/p>\n\u003cp>提示：用 \u003ccode>abs_lt\u003c/code> 把 \u003ccode>|a n - L| &lt; ε\u003c/code> 等全部拆开，剩下的交给 \u003ccode>linarith\u003c/code>。\u003ccode>rw [abs_lt] at h1 h2 ⊢\u003c/code> 可以同时改写多个假设和目标（\u003ccode>⊢\u003c/code> 表示目标）。\u003c/p>"},{"t":"c","code":"theorem squeeze {a b c : ℕ → ℝ} {L : ℝ} (ha : TendsTo a L) (hc : TendsTo c L)\n    (hab : ∀ n, a n ≤ b n) (hbc : ∀ n, b n ≤ c n) : TendsTo b L := by\n  sorry","upto":5478,"ex":{"id":"ch05:squeeze","name":"squeeze","solution":"theorem squeeze {a b c : ℕ → ℝ} {L : ℝ} (ha : TendsTo a L) (hc : TendsTo c L)\n    (hab : ∀ n, a n ≤ b n) (hbc : ∀ n, b n ≤ c n) : TendsTo b L := by\n  intro ε hε\n  obtain ⟨N₁, hN₁⟩ := ha ε hε\n  obtain ⟨N₂, hN₂⟩ := hc ε hε\n  use max N₁ N₂\n  intro n hn\n  have h1 := hN₁ n (le_of_max_le_left hn)\n  have h2 := hN₂ n (le_of_max_le_right hn)\n  rw [abs_lt] at h1 h2 ⊢\n  have h3 := hab n\n  have h4 := hbc n\n  constructor\n  · linarith\n  · linarith"}},{"t":"p","html":"\u003ch3 id=\"ch05-s9\">练习 5.4　平方的极限\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"a_n^2 \\to L^2\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>\u003csup>2\u003c/sup> → \u003ci>L\u003c/i>\u003csup>2\u003c/sup>\u003c/span>。\u003c/p>\n\u003cp>提示：用 \u003ccode>tendsTo_mul\u003c/code>，然后用 \u003ccode>simpa [sq] using ...\u003c/code>（\u003ccode>sq x : x ^ 2 = x * x\u003c/code>）。\u003c/p>"},{"t":"c","code":"theorem tendsTo_sq {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) :\n    TendsTo (fun n ↦ a n ^ 2) (L ^ 2) := by\n  sorry","upto":5720,"ex":{"id":"ch05:tendsTo_sq","name":"tendsTo_sq","solution":"theorem tendsTo_sq {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) :\n    TendsTo (fun n ↦ a n ^ 2) (L ^ 2) := by\n  simpa [sq] using tendsTo_mul h h"}},{"t":"p","html":"\u003ch3 id=\"ch05-s10\">练习 5.5 ★　保号性与保序性\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>，\u003cspan class=\"math\" data-tex=\"b_n \\to M\">\u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>M\u003c/i>\u003c/span>，且对所有 \u003cspan class=\"math\" data-tex=\"n\">\u003ci>n\u003c/i>\u003c/span> 有 \u003cspan class=\"math\" data-tex=\"a_n \\le b_n\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> ≤ \u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"L \\le M\">\u003ci>L\u003c/i> ≤ \u003ci>M\u003c/i>\u003c/span>。\u003c/p>\n\u003cp>提示：反证。若 \u003cspan class=\"math\" data-tex=\"M &lt; L\">\u003ci>M\u003c/i> &lt; \u003ci>L\u003c/i>\u003c/span>，取 \u003cspan class=\"math\" data-tex=\"\\varepsilon = \\frac{L - M}{2}\">ε = (\u003ci>L\u003c/i> − \u003ci>M\u003c/i>)/2\u003c/span>，在足够大的 \u003cspan class=\"math\" data-tex=\"n\">\u003ci>n\u003c/i>\u003c/span> 处会得到 \u003cspan class=\"math\" data-tex=\"b_n &lt; \\frac{L+M}{2} &lt; a_n\">\u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> &lt; (\u003ci>L\u003c/i>+\u003ci>M\u003c/i>)/2 &lt; \u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem le_of_tendsTo {a b : ℕ → ℝ} {L M : ℝ} (ha : TendsTo a L) (hb : TendsTo b M)\n    (h : ∀ n, a n ≤ b n) : L ≤ M := by\n  sorry","upto":6041,"ex":{"id":"ch05:le_of_tendsTo","name":"le_of_tendsTo","solution":"theorem le_of_tendsTo {a b : ℕ → ℝ} {L M : ℝ} (ha : TendsTo a L) (hb : TendsTo b M)\n    (h : ∀ n, a n ≤ b n) : L ≤ M := by\n  by_contra hLM\n  push Not at hLM\n  obtain ⟨N₁, hN₁⟩ := ha ((L - M) / 2) (by linarith)\n  obtain ⟨N₂, hN₂⟩ := hb ((L - M) / 2) (by linarith)\n  have h1 := hN₁ (max N₁ N₂) (le_max_left _ _)\n  have h2 := hN₂ (max N₁ N₂) (le_max_right _ _)\n  rw [abs_lt] at h1 h2\n  have h3 := h (max N₁ N₂)\n  linarith [h1.1, h2.2]"}},{"t":"p","html":"\u003ch3 id=\"ch05-s11\">练习 5.6 ★　计算一个具体的极限\u003c/h3>\n\u003cp>证明 \u003cspan class=\"math\" data-tex=\"\\displaystyle \\lim_{n \\to \\infty} \\frac{2n + 1}{n + 1} = 2\">lim\u003csub>\u003ci>n\u003c/i> → ∞\u003c/sub> (2\u003ci>n\u003c/i> + 1)/(\u003ci>n\u003c/i> + 1) = 2\u003c/span>。\u003c/p>\n\u003cp>提示：\u003cspan class=\"math\" data-tex=\"\\frac{2n+1}{n+1} = 2 - \\frac{1}{n+1}\">(2\u003ci>n\u003c/i>+1)/(\u003ci>n\u003c/i>+1) = 2 − 1/(\u003ci>n\u003c/i>+1)\u003c/span>。先用运算法则得到\u003ccode>h : TendsTo (fun n ↦ 2 - 1 / ((n : ℝ) + 1)) (2 - 0)\u003c/code>，然后用 \u003ccode>convert h using 1\u003c/code> 把目标化为两个等式：数列相等（用 \u003ccode>funext n\u003c/code>，再 \u003ccode>field_simp\u003c/code>、\u003ccode>ring\u003c/code>）和极限相等（\u003ccode>norm_num\u003c/code>）。\u003c/p>"},{"t":"c","code":"theorem ex5_6 : TendsTo (fun n ↦ (2 * (n : ℝ) + 1) / ((n : ℝ) + 1)) 2 := by\n  sorry","upto":6422,"ex":{"id":"ch05:ex5_6","name":"ex5_6","solution":"theorem ex5_6 : TendsTo (fun n ↦ (2 * (n : ℝ) + 1) / ((n : ℝ) + 1)) 2 := by\n  have h := tendsTo_sub (tendsTo_const 2) tendsTo_one_div\n  convert h using 1\n  · funext n\n    have hpos : (n : ℝ) + 1 ≠ 0 := by positivity\n    field_simp\n    ring\n  · norm_num"}},{"t":"p","html":"\u003ch2 id=\"ch05-s12\">本章小结\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>\u003cspan class=\"math\" data-tex=\"\\frac{\\varepsilon}{2}\">ε/2\u003c/span> 技巧\u003c/strong>：把误差分给几个部分；\u003c/li>\u003cli>\u003cstrong>加一项减一项\u003c/strong>：\u003cspan class=\"math\" data-tex=\"a_n b_n - LM = a_n(b_n - M) + M(a_n - L)\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> \u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − LM = \u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>(\u003ci>b\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>M\u003c/i>) + \u003ci>M\u003c/i>(\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>L\u003c/i>)\u003c/span>；\u003c/li>\u003cli>收敛数列有界，这是证明乘积法则的关键一步；\u003c/li>\u003cli>夹逼定理与保序性让我们可以通过不等式来研究极限。\u003c/li>\u003c/ul>"}]},{"id":"ch06","num":6,"title":"单调收敛定理与柯西收敛准则","summary":"单调收敛定理，柯西数列与柯西收敛准则。","file":"Analysis/Ch06_Monotone.lean","exercises":5,"source":"import Mathlib\n\n/-!\n# 第 6 章　单调收敛定理与柯西收敛准则\n\n前两章中，我们总是**先知道极限 $L$ 是多少**，再去验证 $a_n \\to L$。\n但很多时候极限的值根本写不出来，例如\n$$a_n = 1 + \\frac{1}{1!} + \\frac{1}{2!} + \\cdots + \\frac{1}{n!}.$$\n我们需要一些**不依赖于极限值**就能判断收敛的准则。本章的两个准则——\n单调收敛定理与柯西准则——都是实数完备性的直接推论。\n\n## 6.0 预备\n-/\n\nnamespace Ch06\n\n/-- 数列 `a` 收敛到 `L`。 -/\ndef TendsTo (a : ℕ → ℝ) (L : ℝ) : Prop :=\n  ∀ ε > 0, ∃ N : ℕ, ∀ n ≥ N, |a n - L| \u003c ε\n\ntheorem tendsTo_neg {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) :\n    TendsTo (fun n ↦ -a n) (-L) := by\n  intro ε hε\n  obtain ⟨N, hN⟩ := h ε hε\n  use N\n  intro n hn\n  have h1 := hN n hn\n  show |-a n - -L| \u003c ε\n  rw [show -a n - -L = -(a n - L) by ring, abs_neg]\n  exact h1\n\n/-!\n## 6.1 单调数列\n\n> **定义 6.1**　数列 $(a_n)$ 称为**单调递增**的，如果对所有 $n$，$a_n \\le a_{n+1}$。\n\n定义中只比较相邻两项。由归纳法立刻得到：$m \\le n$ 时 $a_m \\le a_n$。\n-/\n\n/-- 数列 `a` 单调递增。 -/\ndef Increasing (a : ℕ → ℝ) : Prop :=\n  ∀ n, a n ≤ a (n + 1)\n\ntheorem Increasing.mono {a : ℕ → ℝ} (h : Increasing a) {m n : ℕ} (hmn : m ≤ n) :\n    a m ≤ a n := by\n  induction hmn with\n  | refl => exact le_rfl\n  | step _ ih => exact le_trans ih (h _)\n\n/-!\n这里的 `induction hmn` 是对\"$m \\le n$ 的证明\"做归纳：要么 $n = m$（`refl`），\n要么 $n = k + 1$ 且 $m \\le k$（`step`，`ih : a m ≤ a k`）。\n\n## 6.2 单调收敛定理\n\n> **定理 6.2（单调收敛定理）**　单调递增且有上界的数列必收敛，且极限就是\n> $\\sup\\{a_n\\}$。\n\n**证明**：令 $S = \\{a_n \\mid n \\in \\mathbb{N}\\}$，它非空且有上界，由确界原理有 $s = \\sup S$。\n任给 $\\varepsilon > 0$，$s - \\varepsilon$ 不是上界，故存在 $N$ 使 $a_N > s - \\varepsilon$。\n由单调性，$n \\ge N$ 时\n$$s - \\varepsilon \u003c a_N \\le a_n \\le s,$$\n从而 $|a_n - s| \u003c \\varepsilon$。\n\n我们直接使用 Mathlib 中的上确界 `sSup`：\n`le_csSup` 说 `sSup S` 是上界，`exists_lt_of_lt_csSup` 说比 `sSup S` 小的数不是上界。\n-/\n\ntheorem monotone_convergence {a : ℕ → ℝ} (h : Increasing a) (hb : ∃ M, ∀ n, a n ≤ M) :\n    ∃ L, TendsTo a L := by\n  obtain ⟨M, hM⟩ := hb\n  have hne : (Set.range a).Nonempty := ⟨a 0, 0, rfl⟩\n  have hbdd : BddAbove (Set.range a) := by\n    use M\n    rintro _ ⟨n, rfl⟩\n    exact hM n\n  refine ⟨sSup (Set.range a), ?_⟩\n  intro ε hε\n  have hlt : sSup (Set.range a) - ε \u003c sSup (Set.range a) := by linarith\n  obtain ⟨_, ⟨N, rfl⟩, hN⟩ := exists_lt_of_lt_csSup hne hlt\n  use N\n  intro n hn\n  have h1 : a N ≤ a n := h.mono hn\n  have h2 : a n ≤ sSup (Set.range a) := le_csSup hbdd ⟨n, rfl⟩\n  rw [abs_lt]\n  constructor \u003c;> linarith\n\n/-!\n`constructor \u003c;> linarith` 的意思是：`constructor` 产生的**每一个**目标都用 `linarith` 解决。\n\n## 6.3 柯西数列\n\n> **定义 6.3**　数列 $(a_n)$ 称为**柯西数列**，如果\n> $$\\forall \\varepsilon > 0,\\ \\exists N,\\ \\forall m, n \\ge N,\\ |a_m - a_n| \u003c \\varepsilon.$$\n\n柯西条件只涉及数列**自身**的项：充分靠后的项彼此任意接近。\n它不需要事先知道极限是什么。\n-/\n\n/-- 数列 `a` 是柯西数列。 -/\ndef IsCauchy (a : ℕ → ℝ) : Prop :=\n  ∀ ε > 0, ∃ N : ℕ, ∀ m ≥ N, ∀ n ≥ N, |a m - a n| \u003c ε\n\n/-!\n> **定理 6.4（柯西收敛准则）**　实数列收敛当且仅当它是柯西数列。\n\n\"收敛 ⇒ 柯西\"是练习 6.3。\"柯西 ⇒ 收敛\"正是实数完备性的另一种表述\n（在 $\\mathbb{Q}$ 中它不成立：$\\sqrt 2$ 的十进制近似 $1, 1.4, 1.41, 1.414, \\ldots$ 是柯西数列，\n但在 $\\mathbb{Q}$ 中没有极限）。它的证明较长（需要先证明柯西数列有界，再用\nBolzano–Weierstrass 定理取收敛子列），这里我们借用 Mathlib：\n`Metric.cauchySeq_iff` 把 Mathlib 的 `CauchySeq` 翻译为 $\\varepsilon$-$N$ 形式，\n`cauchySeq_tendsto_of_complete` 说完备空间中的柯西列收敛。\n-/\n\ntheorem cauchy_complete {a : ℕ → ℝ} (h : IsCauchy a) : ∃ L, TendsTo a L := by\n  have hc : CauchySeq a := by\n    rw [Metric.cauchySeq_iff]\n    intro ε hε\n    obtain ⟨N, hN⟩ := h ε hε\n    exact ⟨N, fun m hm n hn ↦ by rw [Real.dist_eq]; exact hN m hm n hn⟩\n  obtain ⟨L, hL⟩ := cauchySeq_tendsto_of_complete hc\n  refine ⟨L, ?_⟩\n  rw [Metric.tendsto_atTop] at hL\n  intro ε hε\n  obtain ⟨N, hN⟩ := hL ε hε\n  exact ⟨N, fun n hn ↦ by rw [← Real.dist_eq]; exact hN n hn⟩\n\n/-!\n## 练习\n\n### 练习 6.1　一个单调数列\n证明 $a_n = 1 - \\frac{1}{n + 1}$ 单调递增。\n\n提示：`intro n`，用 `show` 写出目标，再 `push_cast`。\n`gcongr` 可以把 `1 - 1 / x ≤ 1 - 1 / y` 化为 `x ≤ y`。\n-/\n\ntheorem ex6_1 : Increasing (fun n ↦ 1 - 1 / ((n : ℝ) + 1)) := by\n  sorry\n\n/-!\n### 练习 6.2 ★　单调递减数列\n单调递减且有下界的数列必收敛。\n\n提示：对 $-a_n$ 使用单调收敛定理，再用 `tendsTo_neg`。\n最后得到的是 `TendsTo (fun n ↦ -(-a n)) (-L)`，用 `simpa using` 化简。\n-/\n\ntheorem ex6_2 {a : ℕ → ℝ} (h : ∀ n, a (n + 1) ≤ a n) (hb : ∃ m, ∀ n, m ≤ a n) :\n    ∃ L, TendsTo a L := by\n  sorry\n\n/-!\n### 练习 6.3　收敛数列是柯西数列\n提示：$\\frac{\\varepsilon}{2}$ 技巧。$|a_m - a_n| \\le |a_m - L| + |L - a_n|$。\n-/\n\ntheorem ex6_3 {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) : IsCauchy a := by\n  sorry\n\n/-!\n### 练习 6.4 ★　柯西数列有界\n提示：取 $\\varepsilon = 1$ 得到 $N$，则 $n \\ge N$ 时 $|a_n| \\le |a_N| + 1$。\n前 $N$ 项可以用有限和处理（参考第 5 章定理 5.3 的证明），\n也可以利用\"柯西 ⇒ 收敛 ⇒ 有界\"。这里给出的有界形式比第 5 章简单：不要求 $C > 0$。\n-/\n\ntheorem ex6_4 {a : ℕ → ℝ} (h : IsCauchy a) : ∃ C, ∀ n, |a n| ≤ C := by\n  sorry\n\n/-!\n### 练习 6.5 ★★　有界单调数列的极限即上确界\n若递增数列 $a_n \\to L$，则对所有 $n$，$a_n \\le L$。\n\n提示：反证。若 $a_k > L$，取 $\\varepsilon = a_k - L$，对足够大的 $n \\ge k$，\n$a_n \\ge a_k$，与 $|a_n - L| \u003c a_k - L$ 矛盾。取 $n = \\max(N, k)$。\n-/\n\ntheorem ex6_5 {a : ℕ → ℝ} {L : ℝ} (h : Increasing a) (hL : TendsTo a L) :\n    ∀ n, a n ≤ L := by\n  sorry\n\n/-!\n## 本章小结\n\n* 单调收敛定理：单调有界 ⇒ 收敛，极限是上（下）确界；\n* 柯西准则：收敛 ⇔ 柯西，判断收敛无需知道极限；\n* 这两个定理都等价于实数的完备性，是区分 $\\mathbb{R}$ 与 $\\mathbb{Q}$ 的关键。\n\n**延伸阅读**：Bolzano–Weierstrass 定理（有界数列必有收敛子列）\n在 Mathlib 中是 `tendsto_subseq_of_bounded`。\n-/\n\nend Ch06\n","blocks":[{"t":"p","html":"\u003cp>前两章中，我们总是\u003cstrong>先知道极限 \u003cspan class=\"math\" data-tex=\"L\">\u003ci>L\u003c/i>\u003c/span> 是多少\u003c/strong>，再去验证 \u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>。但很多时候极限的值根本写不出来，例如\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"a_n = 1 + \\frac{1}{1!} + \\frac{1}{2!} + \\cdots + \\frac{1}{n!}.\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> = 1 + 1/1! + 1/2! + ⋯ + 1/\u003ci>n\u003c/i>!.\u003c/span>\u003c/div>\n\u003cp>我们需要一些\u003cstrong>不依赖于极限值\u003c/strong>就能判断收敛的准则。本章的两个准则——单调收敛定理与柯西准则——都是实数完备性的直接推论。\u003c/p>\n\u003ch2 id=\"ch06-s1\">6.0 预备\u003c/h2>"},{"t":"c","code":"/-- 数列 `a` 收敛到 `L`。 -/\ndef TendsTo (a : ℕ → ℝ) (L : ℝ) : Prop :=\n  ∀ ε > 0, ∃ N : ℕ, ∀ n ≥ N, |a n - L| \u003c ε\n\ntheorem tendsTo_neg {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) :\n    TendsTo (fun n ↦ -a n) (-L) := by\n  intro ε hε\n  obtain ⟨N, hN⟩ := h ε hε\n  use N\n  intro n hn\n  have h1 := hN n hn\n  show |-a n - -L| \u003c ε\n  rw [show -a n - -L = -(a n - L) by ring, abs_neg]\n  exact h1","upto":645},{"t":"p","html":"\u003ch2 id=\"ch06-s2\">6.1 单调数列\u003c/h2>\n\u003cblockquote class=\"callout callout-def\">\u003cp>\u003cstrong>定义 6.1\u003c/strong>　数列 \u003cspan class=\"math\" data-tex=\"(a_n)\">(\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>)\u003c/span> 称为\u003cstrong>单调递增\u003c/strong>的，如果对所有 \u003cspan class=\"math\" data-tex=\"n\">\u003ci>n\u003c/i>\u003c/span>，\u003cspan class=\"math\" data-tex=\"a_n \\le a_{n+1}\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> ≤ \u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>+1\u003c/sub>\u003c/span>。\u003c/p>\u003c/blockquote>\n\u003cp>定义中只比较相邻两项。由归纳法立刻得到：\u003cspan class=\"math\" data-tex=\"m \\le n\">\u003ci>m\u003c/i> ≤ \u003ci>n\u003c/i>\u003c/span> 时 \u003cspan class=\"math\" data-tex=\"a_m \\le a_n\">\u003ci>a\u003c/i>\u003csub>\u003ci>m\u003c/i>\u003c/sub> ≤ \u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>\u003c/span>。\u003c/p>"},{"t":"c","code":"/-- 数列 `a` 单调递增。 -/\ndef Increasing (a : ℕ → ℝ) : Prop :=\n  ∀ n, a n ≤ a (n + 1)\n\ntheorem Increasing.mono {a : ℕ → ℝ} (h : Increasing a) {m n : ℕ} (hmn : m ≤ n) :\n    a m ≤ a n := by\n  induction hmn with\n  | refl => exact le_rfl\n  | step _ ih => exact le_trans ih (h _)","upto":1049},{"t":"p","html":"\u003cp>这里的 \u003ccode>induction hmn\u003c/code> 是对&quot;\u003cspan class=\"math\" data-tex=\"m \\le n\">\u003ci>m\u003c/i> ≤ \u003ci>n\u003c/i>\u003c/span> 的证明&quot;做归纳：要么 \u003cspan class=\"math\" data-tex=\"n = m\">\u003ci>n\u003c/i> = \u003ci>m\u003c/i>\u003c/span>（\u003ccode>refl\u003c/code>），要么 \u003cspan class=\"math\" data-tex=\"n = k + 1\">\u003ci>n\u003c/i> = \u003ci>k\u003c/i> + 1\u003c/span> 且 \u003cspan class=\"math\" data-tex=\"m \\le k\">\u003ci>m\u003c/i> ≤ \u003ci>k\u003c/i>\u003c/span>（\u003ccode>step\u003c/code>，\u003ccode>ih : a m ≤ a k\u003c/code>）。\u003c/p>\n\u003ch2 id=\"ch06-s3\">6.2 单调收敛定理\u003c/h2>\n\u003cblockquote class=\"callout callout-thm\">\u003cp>\u003cstrong>定理 6.2（单调收敛定理）\u003c/strong>　单调递增且有上界的数列必收敛，且极限就是\u003cspan class=\"math\" data-tex=\"\\sup\\{a_n\\}\">sup{\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>}\u003c/span>。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>证明\u003c/strong>：令 \u003cspan class=\"math\" data-tex=\"S = \\{a_n \\mid n \\in \\mathbb{N}\\}\">\u003ci>S\u003c/i> = {\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> | \u003ci>n\u003c/i> ∈ ℕ}\u003c/span>，它非空且有上界，由确界原理有 \u003cspan class=\"math\" data-tex=\"s = \\sup S\">\u003ci>s\u003c/i> = sup \u003ci>S\u003c/i>\u003c/span>。任给 \u003cspan class=\"math\" data-tex=\"\\varepsilon &gt; 0\">ε &gt; 0\u003c/span>，\u003cspan class=\"math\" data-tex=\"s - \\varepsilon\">\u003ci>s\u003c/i> − ε\u003c/span> 不是上界，故存在 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span> 使 \u003cspan class=\"math\" data-tex=\"a_N &gt; s - \\varepsilon\">\u003ci>a\u003c/i>\u003csub>\u003ci>N\u003c/i>\u003c/sub> &gt; \u003ci>s\u003c/i> − ε\u003c/span>。由单调性，\u003cspan class=\"math\" data-tex=\"n \\ge N\">\u003ci>n\u003c/i> ≥ \u003ci>N\u003c/i>\u003c/span> 时\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"s - \\varepsilon &lt; a_N \\le a_n \\le s,\">\u003ci>s\u003c/i> − ε &lt; \u003ci>a\u003c/i>\u003csub>\u003ci>N\u003c/i>\u003c/sub> ≤ \u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> ≤ \u003ci>s\u003c/i>,\u003c/span>\u003c/div>\n\u003cp>从而 \u003cspan class=\"math\" data-tex=\"|a_n - s| &lt; \\varepsilon\">|\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>s\u003c/i>| &lt; ε\u003c/span>。\u003c/p>\n\u003cp>我们直接使用 Mathlib 中的上确界 \u003ccode>sSup\u003c/code>：\u003ccode>le_csSup\u003c/code> 说 \u003ccode>sSup S\u003c/code> 是上界，\u003ccode>exists_lt_of_lt_csSup\u003c/code> 说比 \u003ccode>sSup S\u003c/code> 小的数不是上界。\u003c/p>"},{"t":"c","code":"theorem monotone_convergence {a : ℕ → ℝ} (h : Increasing a) (hb : ∃ M, ∀ n, a n ≤ M) :\n    ∃ L, TendsTo a L := by\n  obtain ⟨M, hM⟩ := hb\n  have hne : (Set.range a).Nonempty := ⟨a 0, 0, rfl⟩\n  have hbdd : BddAbove (Set.range a) := by\n    use M\n    rintro _ ⟨n, rfl⟩\n    exact hM n\n  refine ⟨sSup (Set.range a), ?_⟩\n  intro ε hε\n  have hlt : sSup (Set.range a) - ε \u003c sSup (Set.range a) := by linarith\n  obtain ⟨_, ⟨N, rfl⟩, hN⟩ := exists_lt_of_lt_csSup hne hlt\n  use N\n  intro n hn\n  have h1 : a N ≤ a n := h.mono hn\n  have h2 : a n ≤ sSup (Set.range a) := le_csSup hbdd ⟨n, rfl⟩\n  rw [abs_lt]\n  constructor \u003c;> linarith","upto":2209},{"t":"p
