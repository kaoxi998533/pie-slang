","html":"\u003cp>\u003ccode>constructor &lt;;&gt; linarith\u003c/code> 的意思是：\u003ccode>constructor\u003c/code> 产生的\u003cstrong>每一个\u003c/strong>目标都用 \u003ccode>linarith\u003c/code> 解决。\u003c/p>\n\u003ch2 id=\"ch06-s4\">6.3 柯西数列\u003c/h2>\n\u003cblockquote class=\"callout callout-def\">\u003cp>\u003cstrong>定义 6.3\u003c/strong>　数列 \u003cspan class=\"math\" data-tex=\"(a_n)\">(\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>)\u003c/span> 称为\u003cstrong>柯西数列\u003c/strong>，如果\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"\\forall \\varepsilon &gt; 0,\\ \\exists N,\\ \\forall m, n \\ge N,\\ |a_m - a_n| &lt; \\varepsilon.\">∀ ε &gt; 0, ∃ \u003ci>N\u003c/i>, ∀ \u003ci>m\u003c/i>, \u003ci>n\u003c/i> ≥ \u003ci>N\u003c/i>, |\u003ci>a\u003c/i>\u003csub>\u003ci>m\u003c/i>\u003c/sub> − \u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>| &lt; ε.\u003c/span>\u003c/div>\u003c/blockquote>\n\u003cp>柯西条件只涉及数列\u003cstrong>自身\u003c/strong>的项：充分靠后的项彼此任意接近。它不需要事先知道极限是什么。\u003c/p>"},{"t":"c","code":"/-- 数列 `a` 是柯西数列。 -/\ndef IsCauchy (a : ℕ → ℝ) : Prop :=\n  ∀ ε > 0, ∃ N : ℕ, ∀ m ≥ N, ∀ n ≥ N, |a m - a n| \u003c ε","upto":2596},{"t":"p","html":"\u003cblockquote class=\"callout callout-thm\">\u003cp>\u003cstrong>定理 6.4（柯西收敛准则）\u003c/strong>　实数列收敛当且仅当它是柯西数列。\u003c/p>\u003c/blockquote>\n\u003cp>&quot;收敛 ⇒ 柯西&quot;是练习 6.3。&quot;柯西 ⇒ 收敛&quot;正是实数完备性的另一种表述（在 \u003cspan class=\"math\" data-tex=\"\\mathbb{Q}\">ℚ\u003c/span> 中它不成立：\u003cspan class=\"math\" data-tex=\"\\sqrt 2\">\\sqrt 2\u003c/span> 的十进制近似 \u003cspan class=\"math\" data-tex=\"1, 1.4, 1.41, 1.414, \\ldots\">1, 1.4, 1.41, 1.414, …\u003c/span> 是柯西数列，但在 \u003cspan class=\"math\" data-tex=\"\\mathbb{Q}\">ℚ\u003c/span> 中没有极限）。它的证明较长（需要先证明柯西数列有界，再用Bolzano–Weierstrass 定理取收敛子列），这里我们借用 Mathlib：\u003ccode>Metric.cauchySeq_iff\u003c/code> 把 Mathlib 的 \u003ccode>CauchySeq\u003c/code> 翻译为 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>-\u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span> 形式，\u003ccode>cauchySeq_tendsto_of_complete\u003c/code> 说完备空间中的柯西列收敛。\u003c/p>"},{"t":"c","code":"theorem cauchy_complete {a : ℕ → ℝ} (h : IsCauchy a) : ∃ L, TendsTo a L := by\n  have hc : CauchySeq a := by\n    rw [Metric.cauchySeq_iff]\n    intro ε hε\n    obtain ⟨N, hN⟩ := h ε hε\n    exact ⟨N, fun m hm n hn ↦ by rw [Real.dist_eq]; exact hN m hm n hn⟩\n  obtain ⟨L, hL⟩ := cauchySeq_tendsto_of_complete hc\n  refine ⟨L, ?_⟩\n  rw [Metric.tendsto_atTop] at hL\n  intro ε hε\n  obtain ⟨N, hN⟩ := hL ε hε\n  exact ⟨N, fun n hn ↦ by rw [← Real.dist_eq]; exact hN n hn⟩","upto":3430},{"t":"p","html":"\u003ch2 id=\"ch06-s5\">练习\u003c/h2>\n\u003ch3 id=\"ch06-s6\">练习 6.1　一个单调数列\u003c/h3>\n\u003cp>证明 \u003cspan class=\"math\" data-tex=\"a_n = 1 - \\frac{1}{n + 1}\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> = 1 − 1/(\u003ci>n\u003c/i> + 1)\u003c/span> 单调递增。\u003c/p>\n\u003cp>提示：\u003ccode>intro n\u003c/code>，用 \u003ccode>show\u003c/code> 写出目标，再 \u003ccode>push_cast\u003c/code>。\u003ccode>gcongr\u003c/code> 可以把 \u003ccode>1 - 1 / x ≤ 1 - 1 / y\u003c/code> 化为 \u003ccode>x ≤ y\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem ex6_1 : Increasing (fun n ↦ 1 - 1 / ((n : ℝ) + 1)) := by\n  sorry","upto":3666,"ex":{"id":"ch06:ex6_1","name":"ex6_1","solution":"theorem ex6_1 : Increasing (fun n ↦ 1 - 1 / ((n : ℝ) + 1)) := by\n  intro n\n  show 1 - 1 / ((n : ℝ) + 1) ≤ 1 - 1 / (((n + 1 : ℕ) : ℝ) + 1)\n  push_cast\n  gcongr\n  linarith"}},{"t":"p","html":"\u003ch3 id=\"ch06-s7\">练习 6.2 ★　单调递减数列\u003c/h3>\n\u003cp>单调递减且有下界的数列必收敛。\u003c/p>\n\u003cp>提示：对 \u003cspan class=\"math\" data-tex=\"-a_n\">−\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>\u003c/span> 使用单调收敛定理，再用 \u003ccode>tendsTo_neg\u003c/code>。最后得到的是 \u003ccode>TendsTo (fun n ↦ -(-a n)) (-L)\u003c/code>，用 \u003ccode>simpa using\u003c/code> 化简。\u003c/p>"},{"t":"c","code":"theorem ex6_2 {a : ℕ → ℝ} (h : ∀ n, a (n + 1) ≤ a n) (hb : ∃ m, ∀ n, m ≤ a n) :\n    ∃ L, TendsTo a L := by\n  sorry","upto":3926,"ex":{"id":"ch06:ex6_2","name":"ex6_2","solution":"theorem ex6_2 {a : ℕ → ℝ} (h : ∀ n, a (n + 1) ≤ a n) (hb : ∃ m, ∀ n, m ≤ a n) :\n    ∃ L, TendsTo a L := by\n  obtain ⟨m, hm⟩ := hb\n  have hinc : Increasing (fun n ↦ -a n) := by\n    intro n\n    show -a n ≤ -a (n + 1)\n    linarith [h n]\n  have hbdd : ∃ M, ∀ n, (fun n ↦ -a n) n ≤ M := by\n    use -m\n    intro n\n    show -a n ≤ -m\n    linarith [hm n]\n  obtain ⟨L, hL⟩ := monotone_convergence hinc hbdd\n  use -L\n  simpa using tendsTo_neg hL"}},{"t":"p","html":"\u003ch3 id=\"ch06-s8\">练习 6.3　收敛数列是柯西数列\u003c/h3>\n\u003cp>提示：\u003cspan class=\"math\" data-tex=\"\\frac{\\varepsilon}{2}\">ε/2\u003c/span> 技巧。\u003cspan class=\"math\" data-tex=\"|a_m - a_n| \\le |a_m - L| + |L - a_n|\">|\u003ci>a\u003c/i>\u003csub>\u003ci>m\u003c/i>\u003c/sub> − \u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>| ≤ |\u003ci>a\u003c/i>\u003csub>\u003ci>m\u003c/i>\u003c/sub> − \u003ci>L\u003c/i>| + |\u003ci>L\u003c/i> − \u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>|\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem ex6_3 {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) : IsCauchy a := by\n  sorry","upto":4106,"ex":{"id":"ch06:ex6_3","name":"ex6_3","solution":"theorem ex6_3 {a : ℕ → ℝ} {L : ℝ} (h : TendsTo a L) : IsCauchy a := by\n  intro ε hε\n  obtain ⟨N, hN⟩ := h (ε / 2) (by positivity)\n  use N\n  intro m hm n hn\n  have h1 := hN m hm\n  have h2 := hN n hn\n  calc |a m - a n| = |(a m - L) + (L - a n)| := by congr 1; ring\n    _ ≤ |a m - L| + |L - a n| := abs_add_le _ _\n    _ = |a m - L| + |a n - L| := by rw [abs_sub_comm L]\n    _ \u003c ε / 2 + ε / 2 := by linarith\n    _ = ε := by ring"}},{"t":"p","html":"\u003ch3 id=\"ch06-s9\">练习 6.4 ★　柯西数列有界\u003c/h3>\n\u003cp>提示：取 \u003cspan class=\"math\" data-tex=\"\\varepsilon = 1\">ε = 1\u003c/span> 得到 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"n \\ge N\">\u003ci>n\u003c/i> ≥ \u003ci>N\u003c/i>\u003c/span> 时 \u003cspan class=\"math\" data-tex=\"|a_n| \\le |a_N| + 1\">|\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>| ≤ |\u003ci>a\u003c/i>\u003csub>\u003ci>N\u003c/i>\u003c/sub>| + 1\u003c/span>。前 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span> 项可以用有限和处理（参考第 5 章定理 5.3 的证明），也可以利用&quot;柯西 ⇒ 收敛 ⇒ 有界&quot;。这里给出的有界形式比第 5 章简单：不要求 \u003cspan class=\"math\" data-tex=\"C &gt; 0\">\u003ci>C\u003c/i> &gt; 0\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem ex6_4 {a : ℕ → ℝ} (h : IsCauchy a) : ∃ C, ∀ n, |a n| ≤ C := by\n  sorry","upto":4368,"ex":{"id":"ch06:ex6_4","name":"ex6_4","solution":"theorem ex6_4 {a : ℕ → ℝ} (h : IsCauchy a) : ∃ C, ∀ n, |a n| ≤ C := by\n  obtain ⟨N, hN⟩ := h 1 one_pos\n  use (∑ i ∈ Finset.range N, |a i|) + |a N| + 1\n  intro n\n  have hsum : 0 ≤ ∑ i ∈ Finset.range N, |a i| :=\n    Finset.sum_nonneg (fun i _ ↦ abs_nonneg (a i))\n  rcases lt_or_ge n N with hn | hn\n  · have : |a n| ≤ ∑ i ∈ Finset.range N, |a i| :=\n      Finset.single_le_sum (f := fun i ↦ |a i|) (fun i _ ↦ abs_nonneg (a i))\n        (Finset.mem_range.mpr hn)\n    linarith [abs_nonneg (a N)]\n  · have h1 := hN n hn N le_rfl\n    have h2 : |a n| ≤ |a n - a N| + |a N| := by\n      calc |a n| = |(a n - a N) + a N| := by congr 1; ring\n        _ ≤ |a n - a N| + |a N| := abs_add_le _ _\n    linarith"}},{"t":"p","html":"\u003ch3 id=\"ch06-s10\">练习 6.5 ★★　有界单调数列的极限即上确界\u003c/h3>\n\u003cp>若递增数列 \u003cspan class=\"math\" data-tex=\"a_n \\to L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>L\u003c/i>\u003c/span>，则对所有 \u003cspan class=\"math\" data-tex=\"n\">\u003ci>n\u003c/i>\u003c/span>，\u003cspan class=\"math\" data-tex=\"a_n \\le L\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> ≤ \u003ci>L\u003c/i>\u003c/span>。\u003c/p>\n\u003cp>提示：反证。若 \u003cspan class=\"math\" data-tex=\"a_k &gt; L\">\u003ci>a\u003c/i>\u003csub>\u003ci>k\u003c/i>\u003c/sub> &gt; \u003ci>L\u003c/i>\u003c/span>，取 \u003cspan class=\"math\" data-tex=\"\\varepsilon = a_k - L\">ε = \u003ci>a\u003c/i>\u003csub>\u003ci>k\u003c/i>\u003c/sub> − \u003ci>L\u003c/i>\u003c/span>，对足够大的 \u003cspan class=\"math\" data-tex=\"n \\ge k\">\u003ci>n\u003c/i> ≥ \u003ci>k\u003c/i>\u003c/span>，\u003cspan class=\"math\" data-tex=\"a_n \\ge a_k\">\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> ≥ \u003ci>a\u003c/i>\u003csub>\u003ci>k\u003c/i>\u003c/sub>\u003c/span>，与 \u003cspan class=\"math\" data-tex=\"|a_n - L| &lt; a_k - L\">|\u003ci>a\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> − \u003ci>L\u003c/i>| &lt; \u003ci>a\u003c/i>\u003csub>\u003ci>k\u003c/i>\u003c/sub> − \u003ci>L\u003c/i>\u003c/span> 矛盾。取 \u003cspan class=\"math\" data-tex=\"n = \\max(N, k)\">\u003ci>n\u003c/i> = max(\u003ci>N\u003c/i>, \u003ci>k\u003c/i>)\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem ex6_5 {a : ℕ → ℝ} {L : ℝ} (h : Increasing a) (hL : TendsTo a L) :\n    ∀ n, a n ≤ L := by\n  sorry","upto":4673,"ex":{"id":"ch06:ex6_5","name":"ex6_5","solution":"theorem ex6_5 {a : ℕ → ℝ} {L : ℝ} (h : Increasing a) (hL : TendsTo a L) :\n    ∀ n, a n ≤ L := by\n  intro k\n  by_contra hk\n  push Not at hk\n  obtain ⟨N, hN⟩ := hL (a k - L) (by linarith)\n  have h1 := hN (max N k) (le_max_left _ _)\n  have h2 : a k ≤ a (max N k) := h.mono (le_max_right _ _)\n  rw [abs_lt] at h1\n  linarith [h1.2]"}},{"t":"p","html":"\u003ch2 id=\"ch06-s11\">本章小结\u003c/h2>\n\u003cul>\u003cli>单调收敛定理：单调有界 ⇒ 收敛，极限是上（下）确界；\u003c/li>\u003cli>柯西准则：收敛 ⇔ 柯西，判断收敛无需知道极限；\u003c/li>\u003cli>这两个定理都等价于实数的完备性，是区分 \u003cspan class=\"math\" data-tex=\"\\mathbb{R}\">ℝ\u003c/span> 与 \u003cspan class=\"math\" data-tex=\"\\mathbb{Q}\">ℚ\u003c/span> 的关键。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>延伸阅读\u003c/strong>：Bolzano–Weierstrass 定理（有界数列必有收敛子列）在 Mathlib 中是 \u003ccode>tendsto_subseq_of_bounded\u003c/code>。\u003c/p>"}]},{"id":"ch07","num":7,"title":"函数的连续性","summary":"ε-δ 连续性，连续函数的运算，海涅定理。","file":"Analysis/Ch07_Continuity.lean","exercises":7,"source":"import Mathlib\n\n/-!\n# 第 7 章　函数的连续性\n\n直观上，连续函数的图像是\"一笔画成、没有断开\"的曲线。\n柯西和魏尔斯特拉斯把这个直观变成了精确的 $\\varepsilon$-$\\delta$ 语言。\n\n## 7.1 $\\varepsilon$-$\\delta$ 定义\n\n> **定义 7.1**　函数 $f : \\mathbb{R} \\to \\mathbb{R}$ 在点 $a$ **连续**，如果\n> $$\\forall \\varepsilon > 0,\\ \\exists \\delta > 0,\\ \\forall x,\\ |x - a| \u003c \\delta \\Rightarrow |f(x) - f(a)| \u003c \\varepsilon.$$\n\n与数列极限的游戏类似：对手给出输出端的误差 $\\varepsilon$，\n你要找到输入端的误差 $\\delta$，使得 $x$ 离 $a$ 不超过 $\\delta$ 时，\n$f(x)$ 离 $f(a)$ 不超过 $\\varepsilon$。\n\n\u003c!-- widget:eps-delta -->\n\n（网页版在这里有一个交互演示：选择函数并拖动 $\\varepsilon$。图中横向色带是\n$f(a) \\pm \\varepsilon$，纵向色带是 $a \\pm \\delta$。对符号函数，当 $\\varepsilon \\le 2$ 时\n无论 $\\delta$ 多小都会有一段图像跑出横向色带——这就是\"不连续\"。）\n-/\n\nnamespace Ch07\n\n/-- 函数 `f` 在点 `a` 处连续。 -/\ndef ContAt (f : ℝ → ℝ) (a : ℝ) : Prop :=\n  ∀ ε > 0, ∃ δ > 0, ∀ x, |x - a| \u003c δ → |f x - f a| \u003c ε\n\n/-!\n## 7.2 例子：线性函数\n\n> **例 7.2**　$f(x) = 3x + 1$ 在每一点连续。\n\n**草稿**：$|f(x) - f(a)| = 3|x - a|$。要使它 $\u003c \\varepsilon$，只需 $|x - a| \u003c \\frac{\\varepsilon}{3}$。\n所以取 $\\delta = \\frac{\\varepsilon}{3}$。\n\n`use ε / 3, by positivity` 同时给出 $\\delta$ 和 $\\delta > 0$ 的证明。\n-/\n\nexample (a : ℝ) : ContAt (fun x ↦ 3 * x + 1) a := by\n  intro ε hε\n  use ε / 3, by positivity\n  intro x hx\n  calc |3 * x + 1 - (3 * a + 1)| = 3 * |x - a| := by\n        rw [show 3 * x + 1 - (3 * a + 1) = 3 * (x - a) by ring, abs_mul]\n        norm_num\n    _ \u003c 3 * (ε / 3) := by linarith\n    _ = ε := by ring\n\n/-!\n## 7.3 例子：不连续的函数\n\n要证明 $f$ 在 $a$ **不**连续，需要写出定义的否定：\n$$\\exists \\varepsilon > 0,\\ \\forall \\delta > 0,\\ \\exists x,\\ |x - a| \u003c \\delta \\text{ 且 } |f(x) - f(a)| \\ge \\varepsilon.$$\n\n> **例 7.3**　符号函数 $f(x) = \\begin{cases} -1, & x \u003c 0 \\\\ 1, & x \\ge 0 \\end{cases}$ 在 $0$ 处不连续。\n\n**证明**：取 $\\varepsilon = 1$。无论 $\\delta$ 多小，$x = -\\frac{\\delta}{2}$ 都满足 $|x| \u003c \\delta$，\n但 $|f(x) - f(0)| = |-1 - 1| = 2 \\ge 1$。\n-/\n\nexample : ¬ ContAt (fun x ↦ if x \u003c 0 then (-1 : ℝ) else 1) 0 := by\n  intro h\n  obtain ⟨δ, hδ, hδ'⟩ := h 1 one_pos\n  have hx : -δ / 2 \u003c 0 := by linarith\n  have h1 := hδ' (-δ / 2) (by rw [sub_zero, abs_lt]; constructor \u003c;> linarith)\n  simp [hx] at h1\n  norm_num at h1\n\n/-!\n## 7.4 连续性与数列极限\n\n连续性也可以用数列来刻画（**海涅定理**）：$f$ 在 $a$ 连续当且仅当\n对每个收敛到 $a$ 的数列 $x_n$，都有 $f(x_n) \\to f(a)$。练习 7.6 证明其中一个方向。\n为此我们需要数列极限的定义。\n-/\n\n/-- 数列 `a` 收敛到 `L`。 -/\ndef TendsTo (a : ℕ → ℝ) (L : ℝ) : Prop :=\n  ∀ ε > 0, ∃ N : ℕ, ∀ n ≥ N, |a n - L| \u003c ε\n\n/-!\n## 练习\n\n### 练习 7.1　常值函数连续\n提示：任何 $\\delta > 0$ 都可以，比如 `use 1, one_pos`。\n-/\n\ntheorem contAt_const (c a : ℝ) : ContAt (fun _ ↦ c) a := by\n  sorry\n\n/-!\n### 练习 7.2　恒等函数连续\n提示：取 $\\delta = \\varepsilon$。\n-/\n\ntheorem contAt_id (a : ℝ) : ContAt (fun x ↦ x) a := by\n  sorry\n\n/-!\n### 练习 7.3　连续函数之和连续\n提示：$\\frac{\\varepsilon}{2}$ 技巧，取 $\\delta = \\min(\\delta_1, \\delta_2)$。\n`lt_min : a \u003c b → a \u003c c → a \u003c min b c`，\n`min_le_left a b : min a b ≤ a`，`min_le_right a b : min a b ≤ b`。\n-/\n\ntheorem contAt_add {f g : ℝ → ℝ} {a : ℝ} (hf : ContAt f a) (hg : ContAt g a) :\n    ContAt (fun x ↦ f x + g x) a := by\n  sorry\n\n/-!\n### 练习 7.4　复合函数连续\n若 $f$ 在 $a$ 连续，$g$ 在 $f(a)$ 连续，则 $g \\circ f$ 在 $a$ 连续。\n\n提示：先对 $g$ 用 $\\varepsilon$ 得到 $\\eta$，再对 $f$ 用 $\\eta$ 得到 $\\delta$。\n-/\n\ntheorem contAt_comp {f g : ℝ → ℝ} {a : ℝ} (hf : ContAt f a) (hg : ContAt g (f a)) :\n    ContAt (fun x ↦ g (f x)) a := by\n  sorry\n\n/-!\n### 练习 7.5 ★　平方函数连续\n**草稿**：$|x^2 - a^2| = |x - a| \\cdot |x + a|$。若 $|x - a| \u003c 1$，\n则 $|x + a| \\le |x - a| + 2|a| \u003c 2|a| + 1$。所以取\n$$\\delta = \\min\\left(1, \\frac{\\varepsilon}{2|a| + 1}\\right).$$\n这是\"先限制 $\\delta \\le 1$，控制住其余因子\"的经典技巧。\n\n提示：`lt_of_lt_of_le hx (min_le_left _ _)` 得到 `|x - a| \u003c 1`。\n最后一步 `ε / (2 * |a| + 1) * (2 * |a| + 1) = ε` 可以用 `field_simp`。\n-/\n\ntheorem contAt_sq (a : ℝ) : ContAt (fun x ↦ x ^ 2) a := by\n  sorry\n\n/-!\n### 练习 7.6　连续性的序列刻画\n若 $f$ 在 $a$ 连续且 $x_n \\to a$，则 $f(x_n) \\to f(a)$。\n\n提示：对 $f$ 用 $\\varepsilon$ 得到 $\\delta$，再对数列用 $\\delta$ 得到 $N$。\n-/\n\ntheorem contAt_seq {f : ℝ → ℝ} {a : ℝ} {x : ℕ → ℝ} (hf : ContAt f a) (hx : TendsTo x a) :\n    TendsTo (fun n ↦ f (x n)) (f a) := by\n  sorry\n\n/-!\n### 练习 7.7 ★　数乘\n若 $f$ 在 $a$ 连续，则 $c f$ 在 $a$ 连续。\n\n提示：对 $f$ 使用 $\\frac{\\varepsilon}{|c| + 1}$。\n-/\n\ntheorem contAt_const_mul {f : ℝ → ℝ} {a : ℝ} (c : ℝ) (hf : ContAt f a) :\n    ContAt (fun x ↦ c * f x) a := by\n  sorry\n\n/-!\n## 7.5 与 Mathlib 接轨\n\nMathlib 中 $f$ 在 $a$ 连续写作 `ContinuousAt f a`，在每一点连续写作 `Continuous f`。\n`Metric.continuousAt_iff` 把它翻译成 $\\varepsilon$-$\\delta$ 语言（用 `dist x a` 表示 $|x - a|$）。\n-/\n\ntheorem contAt_iff_continuousAt (f : ℝ → ℝ) (a : ℝ) : ContAt f a ↔ ContinuousAt f a := by\n  rw [Metric.continuousAt_iff]\n  simp only [Real.dist_eq, ContAt]\n\n/-!\nMathlib 还提供了自动证明连续性的策略 `fun_prop`：对由连续函数通过加、乘、复合等\n构造出来的函数，它会自动完成证明。下一章我们会大量使用它。\n-/\n\nexample : Continuous (fun x : ℝ ↦ x ^ 3 - 2 * x + 1) := by\n  fun_prop\n\n/-!\n## 本章小结\n\n* $\\varepsilon$-$\\delta$：根据输出误差 $\\varepsilon$ 构造输入误差 $\\delta$；\n* 多个条件同时成立时，取 $\\delta = \\min(\\delta_1, \\delta_2)$；\n* 非线性函数：先限制 $\\delta \\le 1$ 控制其余因子；\n* 连续 ⇔ 保持数列极限（海涅定理）。\n-/\n\nend Ch07\n","blocks":[{"t":"p","html":"\u003cp>直观上，连续函数的图像是&quot;一笔画成、没有断开&quot;的曲线。柯西和魏尔斯特拉斯把这个直观变成了精确的 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>-\u003cspan class=\"math\" data-tex=\"\\delta\">δ\u003c/span> 语言。\u003c/p>\n\u003ch2 id=\"ch07-s1\">7.1 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>-\u003cspan class=\"math\" data-tex=\"\\delta\">δ\u003c/span> 定义\u003c/h2>\n\u003cblockquote class=\"callout callout-def\">\u003cp>\u003cstrong>定义 7.1\u003c/strong>　函数 \u003cspan class=\"math\" data-tex=\"f : \\mathbb{R} \\to \\mathbb{R}\">\u003ci>f\u003c/i> : ℝ → ℝ\u003c/span> 在点 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> \u003cstrong>连续\u003c/strong>，如果\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"\\forall \\varepsilon &gt; 0,\\ \\exists \\delta &gt; 0,\\ \\forall x,\\ |x - a| &lt; \\delta \\Rightarrow |f(x) - f(a)| &lt; \\varepsilon.\">∀ ε &gt; 0, ∃ δ &gt; 0, ∀ \u003ci>x\u003c/i>, |\u003ci>x\u003c/i> − \u003ci>a\u003c/i>| &lt; δ ⇒ |\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) − \u003ci>f\u003c/i>(\u003ci>a\u003c/i>)| &lt; ε.\u003c/span>\u003c/div>\u003c/blockquote>\n\u003cp>与数列极限的游戏类似：对手给出输出端的误差 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>，你要找到输入端的误差 \u003cspan class=\"math\" data-tex=\"\\delta\">δ\u003c/span>，使得 \u003cspan class=\"math\" data-tex=\"x\">\u003ci>x\u003c/i>\u003c/span> 离 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> 不超过 \u003cspan class=\"math\" data-tex=\"\\delta\">δ\u003c/span> 时，\u003cspan class=\"math\" data-tex=\"f(x)\">\u003ci>f\u003c/i>(\u003ci>x\u003c/i>)\u003c/span> 离 \u003cspan class=\"math\" data-tex=\"f(a)\">\u003ci>f\u003c/i>(\u003ci>a\u003c/i>)\u003c/span> 不超过 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>。\u003c/p>\n\u003cdiv class=\"widget\" data-widget=\"eps-delta\">\u003c/div>"},{"t":"c","code":"/-- 函数 `f` 在点 `a` 处连续。 -/\ndef ContAt (f : ℝ → ℝ) (a : ℝ) : Prop :=\n  ∀ ε > 0, ∃ δ > 0, ∀ x, |x - a| \u003c δ → |f x - f a| \u003c ε","upto":787},{"t":"p","html":"\u003ch2 id=\"ch07-s2\">7.2 例子：线性函数\u003c/h2>\n\u003cblockquote class=\"callout callout-example\">\u003cp>\u003cstrong>例 7.2\u003c/strong>　\u003cspan class=\"math\" data-tex=\"f(x) = 3x + 1\">\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) = 3\u003ci>x\u003c/i> + 1\u003c/span> 在每一点连续。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>草稿\u003c/strong>：\u003cspan class=\"math\" data-tex=\"|f(x) - f(a)| = 3|x - a|\">|\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) − \u003ci>f\u003c/i>(\u003ci>a\u003c/i>)| = 3|\u003ci>x\u003c/i> − \u003ci>a\u003c/i>|\u003c/span>。要使它 \u003cspan class=\"math\" data-tex=\"&lt; \\varepsilon\">&lt; ε\u003c/span>，只需 \u003cspan class=\"math\" data-tex=\"|x - a| &lt; \\frac{\\varepsilon}{3}\">|\u003ci>x\u003c/i> − \u003ci>a\u003c/i>| &lt; ε/3\u003c/span>。所以取 \u003cspan class=\"math\" data-tex=\"\\delta = \\frac{\\varepsilon}{3}\">δ = ε/3\u003c/span>。\u003c/p>\n\u003cp>\u003ccode>use ε / 3, by positivity\u003c/code> 同时给出 \u003cspan class=\"math\" data-tex=\"\\delta\">δ\u003c/span> 和 \u003cspan class=\"math\" data-tex=\"\\delta &gt; 0\">δ &gt; 0\u003c/span> 的证明。\u003c/p>"},{"t":"c","code":"example (a : ℝ) : ContAt (fun x ↦ 3 * x + 1) a := by\n  intro ε hε\n  use ε / 3, by positivity\n  intro x hx\n  calc |3 * x + 1 - (3 * a + 1)| = 3 * |x - a| := by\n        rw [show 3 * x + 1 - (3 * a + 1) = 3 * (x - a) by ring, abs_mul]\n        norm_num\n    _ \u003c 3 * (ε / 3) := by linarith\n    _ = ε := by ring","upto":1346},{"t":"p","html":"\u003ch2 id=\"ch07-s3\">7.3 例子：不连续的函数\u003c/h2>\n\u003cp>要证明 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> \u003cstrong>不\u003c/strong>连续，需要写出定义的否定：\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"\\exists \\varepsilon &gt; 0,\\ \\forall \\delta &gt; 0,\\ \\exists x,\\ |x - a| &lt; \\delta \\text{ 且 } |f(x) - f(a)| \\ge \\varepsilon.\">∃ ε &gt; 0, ∀ δ &gt; 0, ∃ \u003ci>x\u003c/i>, |\u003ci>x\u003c/i> − \u003ci>a\u003c/i>| &lt; δ 且 |\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) − \u003ci>f\u003c/i>(\u003ci>a\u003c/i>)| ≥ ε.\u003c/span>\u003c/div>\n\u003cblockquote class=\"callout callout-example\">\u003cp>\u003cstrong>例 7.3\u003c/strong>　符号函数 \u003cspan class=\"math\" data-tex=\"f(x) = \\begin{cases} -1, &amp; x &lt; 0 \\\\ 1, &amp; x \\ge 0 \\end{cases}\">\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) = −1, \u003ci>x\u003c/i> &lt; 0；1, \u003ci>x\u003c/i> ≥ 0\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"0\">0\u003c/span> 处不连续。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>证明\u003c/strong>：取 \u003cspan class=\"math\" data-tex=\"\\varepsilon = 1\">ε = 1\u003c/span>。无论 \u003cspan class=\"math\" data-tex=\"\\delta\">δ\u003c/span> 多小，\u003cspan class=\"math\" data-tex=\"x = -\\frac{\\delta}{2}\">\u003ci>x\u003c/i> = −δ/2\u003c/span> 都满足 \u003cspan class=\"math\" data-tex=\"|x| &lt; \\delta\">|\u003ci>x\u003c/i>| &lt; δ\u003c/span>，但 \u003cspan class=\"math\" data-tex=\"|f(x) - f(0)| = |-1 - 1| = 2 \\ge 1\">|\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) − \u003ci>f\u003c/i>(0)| = |−1 − 1| = 2 ≥ 1\u003c/span>。\u003c/p>"},{"t":"c","code":"example : ¬ ContAt (fun x ↦ if x \u003c 0 then (-1 : ℝ) else 1) 0 := by\n  intro h\n  obtain ⟨δ, hδ, hδ'⟩ := h 1 one_pos\n  have hx : -δ / 2 \u003c 0 := by linarith\n  have h1 := hδ' (-δ / 2) (by rw [sub_zero, abs_lt]; constructor \u003c;> linarith)\n  simp [hx] at h1\n  norm_num at h1","upto":2014},{"t":"p","html":"\u003ch2 id=\"ch07-s4\">7.4 连续性与数列极限\u003c/h2>\n\u003cp>连续性也可以用数列来刻画（\u003cstrong>海涅定理\u003c/strong>）：\u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> 连续当且仅当对每个收敛到 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> 的数列 \u003cspan class=\"math\" data-tex=\"x_n\">\u003ci>x\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>\u003c/span>，都有 \u003cspan class=\"math\" data-tex=\"f(x_n) \\to f(a)\">\u003ci>f\u003c/i>(\u003ci>x\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>) → \u003ci>f\u003c/i>(\u003ci>a\u003c/i>)\u003c/span>。练习 7.6 证明其中一个方向。为此我们需要数列极限的定义。\u003c/p>"},{"t":"c","code":"/-- 数列 `a` 收敛到 `L`。 -/\ndef TendsTo (a : ℕ → ℝ) (L : ℝ) : Prop :=\n  ∀ ε > 0, ∃ N : ℕ, ∀ n ≥ N, |a n - L| \u003c ε","upto":2262},{"t":"p","html":"\u003ch2 id=\"ch07-s5\">练习\u003c/h2>\n\u003ch3 id=\"ch07-s6\">练习 7.1　常值函数连续\u003c/h3>\n\u003cp>提示：任何 \u003cspan class=\"math\" data-tex=\"\\delta &gt; 0\">δ &gt; 0\u003c/span> 都可以，比如 \u003ccode>use 1, one_pos\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem contAt_const (c a : ℝ) : ContAt (fun _ ↦ c) a := by\n  sorry","upto":2408,"ex":{"id":"ch07:contAt_const","name":"contAt_const","solution":"theorem contAt_const (c a : ℝ) : ContAt (fun _ ↦ c) a := by\n  intro ε hε\n  use 1, one_pos\n  intro x _\n  simpa using hε"}},{"t":"p","html":"\u003ch3 id=\"ch07-s7\">练习 7.2　恒等函数连续\u003c/h3>\n\u003cp>提示：取 \u003cspan class=\"math\" data-tex=\"\\delta = \\varepsilon\">δ = ε\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem contAt_id (a : ℝ) : ContAt (fun x ↦ x) a := by\n  sorry","upto":2527,"ex":{"id":"ch07:contAt_id","name":"contAt_id","solution":"theorem contAt_id (a : ℝ) : ContAt (fun x ↦ x) a := by\n  intro ε hε\n  use ε, hε\n  intro x hx\n  exact hx"}},{"t":"p","html":"\u003ch3 id=\"ch07-s8\">练习 7.3　连续函数之和连续\u003c/h3>\n\u003cp>提示：\u003cspan class=\"math\" data-tex=\"\\frac{\\varepsilon}{2}\">ε/2\u003c/span> 技巧，取 \u003cspan class=\"math\" data-tex=\"\\delta = \\min(\\delta_1, \\delta_2)\">δ = min(δ\u003csub>1\u003c/sub>, δ\u003csub>2\u003c/sub>)\u003c/span>。\u003ccode>lt_min : a &lt; b → a &lt; c → a &lt; min b c\u003c/code>，\u003ccode>min_le_left a b : min a b ≤ a\u003c/code>，\u003ccode>min_le_right a b : min a b ≤ b\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem contAt_add {f g : ℝ → ℝ} {a : ℝ} (hf : ContAt f a) (hg : ContAt g a) :\n    ContAt (fun x ↦ f x + g x) a := by\n  sorry","upto":2857,"ex":{"id":"ch07:contAt_add","name":"contAt_add","solution":"theorem contAt_add {f g : ℝ → ℝ} {a : ℝ} (hf : ContAt f a) (hg : ContAt g a) :\n    ContAt (fun x ↦ f x + g x) a := by\n  intro ε hε\n  obtain ⟨δ₁, hδ₁, h₁⟩ := hf (ε / 2) (by positivity)\n  obtain ⟨δ₂, hδ₂, h₂⟩ := hg (ε / 2) (by positivity)\n  refine ⟨min δ₁ δ₂, lt_min hδ₁ hδ₂, fun x hx ↦ ?_⟩\n  have hx₁ := h₁ x (lt_of_lt_of_le hx (min_le_left _ _))\n  have hx₂ := h₂ x (lt_of_lt_of_le hx (min_le_right _ _))\n  calc |f x + g x - (f a + g a)| = |(f x - f a) + (g x - g a)| := by congr 1; ring\n    _ ≤ |f x - f a| + |g x - g a| := abs_add_le _ _\n    _ \u003c ε / 2 + ε / 2 := by linarith\n    _ = ε := by ring"}},{"t":"p","html":"\u003ch3 id=\"ch07-s9\">练习 7.4　复合函数连续\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> 连续，\u003cspan class=\"math\" data-tex=\"g\">\u003ci>g\u003c/i>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"f(a)\">\u003ci>f\u003c/i>(\u003ci>a\u003c/i>)\u003c/span> 连续，则 \u003cspan class=\"math\" data-tex=\"g \\circ f\">\u003ci>g\u003c/i> ∘ \u003ci>f\u003c/i>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> 连续。\u003c/p>\n\u003cp>提示：先对 \u003cspan class=\"math\" data-tex=\"g\">\u003ci>g\u003c/i>\u003c/span> 用 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span> 得到 \u003cspan class=\"math\" data-tex=\"\\eta\">η\u003c/span>，再对 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 用 \u003cspan class=\"math\" data-tex=\"\\eta\">η\u003c/span> 得到 \u003cspan class=\"math\" data-tex=\"\\delta\">δ\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem contAt_comp {f g : ℝ → ℝ} {a : ℝ} (hf : ContAt f a) (hg : ContAt g (f a)) :\n    ContAt (fun x ↦ g (f x)) a := by\n  sorry","upto":3134,"ex":{"id":"ch07:contAt_comp","name":"contAt_comp","solution":"theorem contAt_comp {f g : ℝ → ℝ} {a : ℝ} (hf : ContAt f a) (hg : ContAt g (f a)) :\n    ContAt (fun x ↦ g (f x)) a := by\n  intro ε hε\n  obtain ⟨η, hη, hg'⟩ := hg ε hε\n  obtain ⟨δ, hδ, hf'⟩ := hf η hη\n  refine ⟨δ, hδ, fun x hx ↦ ?_⟩\n  exact hg' (f x) (hf' x hx)"}},{"t":"p","html":"\u003ch3 id=\"ch07-s10\">练习 7.5 ★　平方函数连续\u003c/h3>\n\u003cp>\u003cstrong>草稿\u003c/strong>：\u003cspan class=\"math\" data-tex=\"|x^2 - a^2| = |x - a| \\cdot |x + a|\">|\u003ci>x\u003c/i>\u003csup>2\u003c/sup> − \u003ci>a\u003c/i>\u003csup>2\u003c/sup>| = |\u003ci>x\u003c/i> − \u003ci>a\u003c/i>| · |\u003ci>x\u003c/i> + \u003ci>a\u003c/i>|\u003c/span>。若 \u003cspan class=\"math\" data-tex=\"|x - a| &lt; 1\">|\u003ci>x\u003c/i> − \u003ci>a\u003c/i>| &lt; 1\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"|x + a| \\le |x - a| + 2|a| &lt; 2|a| + 1\">|\u003ci>x\u003c/i> + \u003ci>a\u003c/i>| ≤ |\u003ci>x\u003c/i> − \u003ci>a\u003c/i>| + 2|\u003ci>a\u003c/i>| &lt; 2|\u003ci>a\u003c/i>| + 1\u003c/span>。所以取\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"\\delta = \\min\\left(1, \\frac{\\varepsilon}{2|a| + 1}\\right).\">δ = min(1, ε/(2|\u003ci>a\u003c/i>| + 1)).\u003c/span>\u003c/div>\n\u003cp>这是&quot;先限制 \u003cspan class=\"math\" data-tex=\"\\delta \\le 1\">δ ≤ 1\u003c/span>，控制住其余因子&quot;的经典技巧。\u003c/p>\n\u003cp>提示：\u003ccode>lt_of_lt_of_le hx (min_le_left _ _)\u003c/code> 得到 \u003ccode>|x - a| &lt; 1\u003c/code>。最后一步 \u003ccode>ε / (2 * |a| + 1) * (2 * |a| + 1) = ε\u003c/code> 可以用 \u003ccode>field_simp\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem contAt_sq (a : ℝ) : ContAt (fun x ↦ x ^ 2) a := by\n  sorry","upto":3561,"ex":{"id":"ch07:contAt_sq","name":"contAt_sq","solution":"theorem contAt_sq (a : ℝ) : ContAt (fun x ↦ x ^ 2) a := by\n  intro ε hε\n  have hpos : 0 \u003c 2 * |a| + 1 := by positivity\n  refine ⟨min 1 (ε / (2 * |a| + 1)), lt_min one_pos (by positivity), fun x hx ↦ ?_⟩\n  have h1 : |x - a| \u003c 1 := lt_of_lt_of_le hx (min_le_left _ _)\n  have h2 : |x - a| \u003c ε / (2 * |a| + 1) := lt_of_lt_of_le hx (min_le_right _ _)\n  have h3 : |x + a| ≤ 2 * |a| + 1 := by\n    calc |x + a| = |(x - a) + 2 * a| := by congr 1; ring\n      _ ≤ |x - a| + |2 * a| := abs_add_le _ _\n      _ = |x - a| + 2 * |a| := by rw [abs_mul]; norm_num\n      _ ≤ 2 * |a| + 1 := by linarith\n  calc |x ^ 2 - a ^ 2| = |x - a| * |x + a| := by rw [← abs_mul]; congr 1; ring\n    _ ≤ |x - a| * (2 * |a| + 1) := by gcongr\n    _ \u003c ε / (2 * |a| + 1) * (2 * |a| + 1) := by gcongr\n    _ = ε := by field_simp"}},{"t":"p","html":"\u003ch3 id=\"ch07-s11\">练习 7.6　连续性的序列刻画\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> 连续且 \u003cspan class=\"math\" data-tex=\"x_n \\to a\">\u003ci>x\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub> → \u003ci>a\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"f(x_n) \\to f(a)\">\u003ci>f\u003c/i>(\u003ci>x\u003c/i>\u003csub>\u003ci>n\u003c/i>\u003c/sub>) → \u003ci>f\u003c/i>(\u003ci>a\u003c/i>)\u003c/span>。\u003c/p>\n\u003cp>提示：对 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 用 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span> 得到 \u003cspan class=\"math\" data-tex=\"\\delta\">δ\u003c/span>，再对数列用 \u003cspan class=\"math\" data-tex=\"\\delta\">δ\u003c/span> 得到 \u003cspan class=\"math\" data-tex=\"N\">\u003ci>N\u003c/i>\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem contAt_seq {f : ℝ → ℝ} {a : ℝ} {x : ℕ → ℝ} (hf : ContAt f a) (hx : TendsTo x a) :\n    TendsTo (fun n ↦ f (x n)) (f a) := by\n  sorry","upto":3840,"ex":{"id":"ch07:contAt_seq","name":"contAt_seq","solution":"theorem contAt_seq {f : ℝ → ℝ} {a : ℝ} {x : ℕ → ℝ} (hf : ContAt f a) (hx : TendsTo x a) :\n    TendsTo (fun n ↦ f (x n)) (f a) := by\n  intro ε hε\n  obtain ⟨δ, hδ, hf'⟩ := hf ε hε\n  obtain ⟨N, hN⟩ := hx δ hδ\n  use N\n  intro n hn\n  exact hf' (x n) (hN n hn)"}},{"t":"p","html":"\u003ch3 id=\"ch07-s12\">练习 7.7 ★　数乘\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> 连续，则 \u003cspan class=\"math\" data-tex=\"c f\">\u003ci>c\u003c/i> \u003ci>f\u003c/i>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> 连续。\u003c/p>\n\u003cp>提示：对 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 使用 \u003cspan class=\"math\" data-tex=\"\\frac{\\varepsilon}{|c| + 1}\">ε/(|\u003ci>c\u003c/i>| + 1)\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem contAt_const_mul {f : ℝ → ℝ} {a : ℝ} (c : ℝ) (hf : ContAt f a) :\n    ContAt (fun x ↦ c * f x) a := by\n  sorry","upto":4060,"ex":{"id":"ch07:contAt_const_mul","name":"contAt_const_mul","solution":"theorem contAt_const_mul {f : ℝ → ℝ} {a : ℝ} (c : ℝ) (hf : ContAt f a) :\n    ContAt (fun x ↦ c * f x) a := by\n  intro ε hε\n  have hc : 0 \u003c |c| + 1 := by positivity\n  obtain ⟨δ, hδ, hf'⟩ := hf (ε / (|c| + 1)) (by positivity)\n  refine ⟨δ, hδ, fun x hx ↦ ?_⟩\n  have h1 := hf' x hx\n  calc |c * f x - c * f a| = |c| * |f x - f a| := by rw [← mul_sub, abs_mul]\n    _ ≤ (|c| + 1) * |f x - f a| := by gcongr; linarith\n    _ \u003c (|c| + 1) * (ε / (|c| + 1)) := by gcongr\n    _ = ε := by field_simp"}},{"t":"p","html":"\u003ch2 id=\"ch07-s13\">7.5 与 Mathlib 接轨\u003c/h2>\n\u003cp>Mathlib 中 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> 连续写作 \u003ccode>ContinuousAt f a\u003c/code>，在每一点连续写作 \u003ccode>Continuous f\u003c/code>。\u003ccode>Metric.continuousAt_iff\u003c/code> 把它翻译成 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>-\u003cspan class=\"math\" data-tex=\"\\delta\">δ\u003c/span> 语言（用 \u003ccode>dist x a\u003c/code> 表示 \u003cspan class=\"math\" data-tex=\"|x - a|\">|\u003ci>x\u003c/i> − \u003ci>a\u003c/i>|\u003c/span>）。\u003c/p>"},{"t":"c","code":"theorem contAt_iff_continuousAt (f : ℝ → ℝ) (a : ℝ) : ContAt f a ↔ ContinuousAt f a := by\n  rw [Metric.continuousAt_iff]\n  simp only [Real.dist_eq, ContAt]","upto":4401},{"t":"p","html":"\u003cp>Mathlib 还提供了自动证明连续性的策略 \u003ccode>fun_prop\u003c/code>：对由连续函数通过加、乘、复合等构造出来的函数，它会自动完成证明。下一章我们会大量使用它。\u003c/p>"},{"t":"c","code":"example : Continuous (fun x : ℝ ↦ x ^ 3 - 2 * x + 1) := by\n  fun_prop","upto":4560},{"t":"p","html":"\u003ch2 id=\"ch07-s14\">本章小结\u003c/h2>\n\u003cul>\u003cli>\u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>-\u003cspan class=\"math\" data-tex=\"\\delta\">δ\u003c/span>：根据输出误差 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span> 构造输入误差 \u003cspan class=\"math\" data-tex=\"\\delta\">δ\u003c/span>；\u003c/li>\u003cli>多个条件同时成立时，取 \u003cspan class=\"math\" data-tex=\"\\delta = \\min(\\delta_1, \\delta_2)\">δ = min(δ\u003csub>1\u003c/sub>, δ\u003csub>2\u003c/sub>)\u003c/span>；\u003c/li>\u003cli>非线性函数：先限制 \u003cspan class=\"math\" data-tex=\"\\delta \\le 1\">δ ≤ 1\u003c/span> 控制其余因子；\u003c/li>\u003cli>连续 ⇔ 保持数列极限（海涅定理）。\u003c/li>\u003c/ul>"}]},{"id":"ch08","num":8,"title":"闭区间上连续函数的性质","summary":"介值定理、最值定理与不动点定理。","file":"Analysis/Ch08_IVT.lean","exercises":5,"source":"import Mathlib\n\n/-!\n# 第 8 章　闭区间上连续函数的性质\n\n上一章研究的是函数在**一点**附近的性质。本章研究连续函数在**整个闭区间**上的\n整体性质。这些定理在直观上\"显而易见\"，但它们的证明都离不开实数的完备性：\n在 $\\mathbb{Q}$ 上，函数 $x^2 - 2$ 在 $[1, 2]$ 上连续，两端异号，却没有零点！\n\n本章我们学习**如何使用 Mathlib 中的定理**。这是形式化数学中非常重要的一项技能：\n读懂定理的陈述，检查它需要的条件，再把它应用到具体问题上。\n\n## 8.1 记号\n\n* `Set.Icc a b` 是闭区间 $[a, b]$，`Set.Ioo a b` 是开区间 $(a, b)$；\n* `ContinuousOn f s` 表示 $f$ 在集合 $s$ 上连续；\n* `f '' s` 表示像集 $f(s) = \\{f(x) \\mid x \\in s\\}$；\n* `x ∈ Set.Icc a b` 展开后就是 `a ≤ x ∧ x ≤ b`（定理 `Set.mem_Icc`）。\n\n对于多项式这类由基本运算组合出来的函数，连续性可以用 `fun_prop` 自动证明。\n-/\n\nnamespace Ch08\n\nopen Set\n\nexample : ContinuousOn (fun x : ℝ ↦ x ^ 3 + x - 1) (Icc 0 1) := by\n  fun_prop\n\n/-!\n## 8.2 介值定理\n\n> **定理 8.1（介值定理）**　设 $f$ 在 $[a, b]$ 上连续，则 $f$ 取到 $f(a)$ 与 $f(b)$\n> 之间的每一个值。\n\nMathlib 中的陈述是：\n\n```text\nintermediate_value_Icc  : a ≤ b → ContinuousOn f (Icc a b) → Icc (f a) (f b) ⊆ f '' Icc a b\nintermediate_value_Icc' : a ≤ b → ContinuousOn f (Icc a b) → Icc (f b) (f a) ⊆ f '' Icc a b\n```\n\n第一个适用于 $f(a) \\le f(b)$ 的情形，第二个适用于 $f(a) \\ge f(b)$ 的情形。\n\n> **例 8.2**　存在 $x \\in [1, 2]$ 使得 $x^2 = 2$。也就是说，$\\sqrt{2}$ 存在！\n\n**证明**：$f(x) = x^2$ 在 $[1,2]$ 上连续，$f(1) = 1 \\le 2 \\le 4 = f(2)$。\n-/\n\nexample : ∃ x ∈ Icc (1 : ℝ) 2, x ^ 2 = 2 := by\n  have hcont : ContinuousOn (fun x : ℝ ↦ x ^ 2) (Icc 1 2) := by fun_prop\n  have hivt := intermediate_value_Icc (by norm_num : (1 : ℝ) ≤ 2) hcont\n  -- hivt : Icc (1 ^ 2) (2 ^ 2) ⊆ (fun x ↦ x ^ 2) '' Icc 1 2\n  have h2 : (2 : ℝ) ∈ Icc ((1 : ℝ) ^ 2) ((2 : ℝ) ^ 2) := by\n    rw [mem_Icc]\n    norm_num\n  obtain ⟨x, hx, hx2⟩ := hivt h2\n  exact ⟨x, hx, hx2⟩\n\n/-!\n`hivt h2` 的意思是：`hivt` 是一个包含关系 $A \\subseteq B$，作用在 `h2 : 2 ∈ A` 上\n就得到 `2 ∈ B`，即\"存在 $x \\in [1,2]$ 使 $x^2 = 2$\"。\n\n## 8.3 最值定理\n\n> **定理 8.3（最值定理）**　闭区间上的连续函数一定能取到最大值和最小值。\n\n在 Mathlib 中，这个定理是对**紧集**陈述的：`isCompact_Icc` 说闭区间是紧的，\n`IsCompact.exists_isMaxOn` 说紧集上的连续函数有最大值点。\n`IsMaxOn f s c` 的意思是 $c$ 是 $f$ 在 $s$ 上的最大值点，\n`isMaxOn_iff` 把它展开为 `∀ x ∈ s, f x ≤ f c`。\n-/\n\ntheorem exists_max {f : ℝ → ℝ} {a b : ℝ} (hab : a ≤ b) (hf : ContinuousOn f (Icc a b)) :\n    ∃ c ∈ Icc a b, ∀ x ∈ Icc a b, f x ≤ f c := by\n  obtain ⟨c, hc, hmax⟩ := isCompact_Icc.exists_isMaxOn (nonempty_Icc.mpr hab) hf\n  exact ⟨c, hc, isMaxOn_iff.mp hmax⟩\n\n/-!\n## 练习\n\n### 练习 8.1　方程的根\n证明方程 $x^3 + x - 1 = 0$ 在 $[0, 1]$ 中有根。\n\n提示：模仿例 8.2。\n-/\n\ntheorem ex8_1 : ∃ x ∈ Icc (0 : ℝ) 1, x ^ 3 + x - 1 = 0 := by\n  sorry\n\n/-!\n### 练习 8.2　最小值\n仿照 `exists_max` 证明最小值的存在性。\n\n提示：`IsCompact.exists_isMinOn` 与 `isMinOn_iff`。\n-/\n\ntheorem exists_min {f : ℝ → ℝ} {a b : ℝ} (hab : a ≤ b) (hf : ContinuousOn f (Icc a b)) :\n    ∃ c ∈ Icc a b, ∀ x ∈ Icc a b, f c ≤ f x := by\n  sorry\n\n/-!\n### 练习 8.3　闭区间上的连续函数有界\n提示：用 `exists_max` 和 `exists_min` 得到最大值 $f(c_1)$ 和最小值 $f(c_2)$，\n取 $M = |f(c_1)| + |f(c_2)|$。用 `abs_le` 拆开绝对值，再配合 `le_abs_self`、`neg_abs_le`。\n-/\n\ntheorem ex8_3 {f : ℝ → ℝ} {a b : ℝ} (hab : a ≤ b) (hf : ContinuousOn f (Icc a b)) :\n    ∃ M, ∀ x ∈ Icc a b, |f x| ≤ M := by\n  sorry\n\n/-!\n### 练习 8.4 ★　不动点定理\n若 $f : [0, 1] \\to [0, 1]$ 连续，则存在 $x \\in [0,1]$ 使 $f(x) = x$。\n\n提示：考虑 $g(x) = f(x) - x$，则 $g(0) \\ge 0 \\ge g(1)$。\n对 $g$ 使用 `intermediate_value_Icc'`，目标值为 $0$。\n`ContinuousOn.sub hf continuousOn_id` 给出 $g$ 的连续性（或者试试 `fun_prop`）。\n-/\n\ntheorem ex8_4 {f : ℝ → ℝ} (hf : ContinuousOn f (Icc 0 1))\n    (hmaps : ∀ x ∈ Icc (0 : ℝ) 1, f x ∈ Icc (0 : ℝ) 1) :\n    ∃ x ∈ Icc (0 : ℝ) 1, f x = x := by\n  sorry\n\n/-!\n### 练习 8.5 ★　开区间上可能取不到最大值\n最值定理中\"闭区间\"的条件不能去掉：$f(x) = x$ 在 $(0, 1)$ 上没有最大值。\n\n提示：若 $c \\in (0, 1)$ 是最大值点，考虑 $\\frac{c + 1}{2}$。`Set.mem_Ioo` 展开开区间的成员关系。\n-/\n\ntheorem ex8_5 : ¬ ∃ c ∈ Ioo (0 : ℝ) 1, ∀ x ∈ Ioo (0 : ℝ) 1, x ≤ c := by\n  sorry\n\n/-!\n## 本章小结\n\n* 介值定理：`intermediate_value_Icc`（及其反向版本 `intermediate_value_Icc'`）；\n* 最值定理：`IsCompact.exists_isMaxOn` / `exists_isMinOn` 配合 `isCompact_Icc`；\n* 连续性的自动证明：`fun_prop`；\n* 使用库中定理时，关键是逐条核对它的**前提条件**。\n\n**延伸阅读**：闭区间上的连续函数还是**一致连续**的（Cantor 定理），\n在 Mathlib 中为 `IsCompact.uniformContinuousOn_of_continuous`。\n-/\n\nend Ch08\n","blocks":[{"t":"p","html":"\u003cp>上一章研究的是函数在\u003cstrong>一点\u003c/strong>附近的性质。本章研究连续函数在\u003cstrong>整个闭区间\u003c/strong>上的整体性质。这些定理在直观上&quot;显而易见&quot;，但它们的证明都离不开实数的完备性：在 \u003cspan class=\"math\" data-tex=\"\\mathbb{Q}\">ℚ\u003c/span> 上，函数 \u003cspan class=\"math\" data-tex=\"x^2 - 2\">\u003ci>x\u003c/i>\u003csup>2\u003c/sup> − 2\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"[1, 2]\">[1, 2]\u003c/span> 上连续，两端异号，却没有零点！\u003c/p>\n\u003cp>本章我们学习\u003cstrong>如何使用 Mathlib 中的定理\u003c/strong>。这是形式化数学中非常重要的一项技能：读懂定理的陈述，检查它需要的条件，再把它应用到具体问题上。\u003c/p>\n\u003ch2 id=\"ch08-s1\">8.1 记号\u003c/h2>\n\u003cul>\u003cli>\u003ccode>Set.Icc a b\u003c/code> 是闭区间 \u003cspan class=\"math\" data-tex=\"[a, b]\">[\u003ci>a\u003c/i>, \u003ci>b\u003c/i>]\u003c/span>，\u003ccode>Set.Ioo a b\u003c/code> 是开区间 \u003cspan class=\"math\" data-tex=\"(a, b)\">(\u003ci>a\u003c/i>, \u003ci>b\u003c/i>)\u003c/span>；\u003c/li>\u003cli>\u003ccode>ContinuousOn f s\u003c/code> 表示 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 在集合 \u003cspan class=\"math\" data-tex=\"s\">\u003ci>s\u003c/i>\u003c/span> 上连续；\u003c/li>\u003cli>\u003ccode>f '' s\u003c/code> 表示像集 \u003cspan class=\"math\" data-tex=\"f(s) = \\{f(x) \\mid x \\in s\\}\">\u003ci>f\u003c/i>(\u003ci>s\u003c/i>) = {\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) | \u003ci>x\u003c/i> ∈ \u003ci>s\u003c/i>}\u003c/span>；\u003c/li>\u003cli>\u003ccode>x ∈ Set.Icc a b\u003c/code> 展开后就是 \u003ccode>a ≤ x ∧ x ≤ b\u003c/code>（定理 \u003ccode>Set.mem_Icc\u003c/code>）。\u003c/li>\u003c/ul>\n\u003cp>对于多项式这类由基本运算组合出来的函数，连续性可以用 \u003ccode>fun_prop\u003c/code> 自动证明。\u003c/p>"},{"t":"c","code":"example : ContinuousOn (fun x : ℝ ↦ x ^ 3 + x - 1) (Icc 0 1) := by\n  fun_prop","upto":632},{"t":"p","html":"\u003ch2 id=\"ch08-s2\">8.2 介值定理\u003c/h2>\n\u003cblockquote class=\"callout callout-thm\">\u003cp>\u003cstrong>定理 8.1（介值定理）\u003c/strong>　设 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"[a, b]\">[\u003ci>a\u003c/i>, \u003ci>b\u003c/i>]\u003c/span> 上连续，则 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 取到 \u003cspan class=\"math\" data-tex=\"f(a)\">\u003ci>f\u003c/i>(\u003ci>a\u003c/i>)\u003c/span> 与 \u003cspan class=\"math\" data-tex=\"f(b)\">\u003ci>f\u003c/i>(\u003ci>b\u003c/i>)\u003c/span>之间的每一个值。\u003c/p>\u003c/blockquote>\n\u003cp>Mathlib 中的陈述是：\u003c/p>\n\u003cpre class=\"snippet\">\u003ccode>intermediate_value_Icc  : a ≤ b → ContinuousOn f (Icc a b) → Icc (f a) (f b) ⊆ f '' Icc a b\nintermediate_value_Icc' : a ≤ b → ContinuousOn f (Icc a b) → Icc (f b) (f a) ⊆ f '' Icc a b\u003c/code>\u003c/pre>\n\u003cp>第一个适用于 \u003cspan class=\"math\" data-tex=\"f(a) \\le f(b)\">\u003ci>f\u003c/i>(\u003ci>a\u003c/i>) ≤ \u003ci>f\u003c/i>(\u003ci>b\u003c/i>)\u003c/span> 的情形，第二个适用于 \u003cspan class=\"math\" data-tex=\"f(a) \\ge f(b)\">\u003ci>f\u003c/i>(\u003ci>a\u003c/i>) ≥ \u003ci>f\u003c/i>(\u003ci>b\u003c/i>)\u003c/span> 的情形。\u003c/p>\n\u003cblockquote class=\"callout callout-example\">\u003cp>\u003cstrong>例 8.2\u003c/strong>　存在 \u003cspan class=\"math\" data-tex=\"x \\in [1, 2]\">\u003ci>x\u003c/i> ∈ [1, 2]\u003c/span> 使得 \u003cspan class=\"math\" data-tex=\"x^2 = 2\">\u003ci>x\u003c/i>\u003csup>2\u003c/sup> = 2\u003c/span>。也就是说，\u003cspan class=\"math\" data-tex=\"\\sqrt{2}\">√2\u003c/span> 存在！\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>证明\u003c/strong>：\u003cspan class=\"math\" data-tex=\"f(x) = x^2\">\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) = \u003ci>x\u003c/i>\u003csup>2\u003c/sup>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"[1,2]\">[1,2]\u003c/span> 上连续，\u003cspan class=\"math\" data-tex=\"f(1) = 1 \\le 2 \\le 4 = f(2)\">\u003ci>f\u003c/i>(1) = 1 ≤ 2 ≤ 4 = \u003ci>f\u003c/i>(2)\u003c/span>。\u003c/p>"},{"t":"c","code":"example : ∃ x ∈ Icc (1 : ℝ) 2, x ^ 2 = 2 := by\n  have hcont : ContinuousOn (fun x : ℝ ↦ x ^ 2) (Icc 1 2) := by fun_prop\n  have hivt := intermediate_value_Icc (by norm_num : (1 : ℝ) ≤ 2) hcont\n  -- hivt : Icc (1 ^ 2) (2 ^ 2) ⊆ (fun x ↦ x ^ 2) '' Icc 1 2\n  have h2 : (2 : ℝ) ∈ Icc ((1 : ℝ) ^ 2) ((2 : ℝ) ^ 2) := by\n    rw [mem_Icc]\n    norm_num\n  obtain ⟨x, hx, hx2⟩ := hivt h2\n  exact ⟨x, hx, hx2⟩","upto":1526},{"t":"p","html":"\u003cp>\u003ccode>hivt h2\u003c/code> 的意思是：\u003ccode>hivt\u003c/code> 是一个包含关系 \u003cspan class=\"math\" data-tex=\"A \\subseteq B\">\u003ci>A\u003c/i> ⊆ \u003ci>B\u003c/i>\u003c/span>，作用在 \u003ccode>h2 : 2 ∈ A\u003c/code> 上就得到 \u003ccode>2 ∈ B\u003c/code>，即&quot;存在 \u003cspan class=\"math\" data-tex=\"x \\in [1,2]\">\u003ci>x\u003c/i> ∈ [1,2]\u003c/span> 使 \u003cspan class=\"math\" data-tex=\"x^2 = 2\">\u003ci>x\u003c/i>\u003csup>2\u003c/sup> = 2\u003c/span>&quot;。\u003c/p>\n\u003ch2 id=\"ch08-s3\">8.3 最值定理\u003c/h2>\n\u003cblockquote class=\"callout callout-thm\">\u003cp>\u003cstrong>定理 8.3（最值定理）\u003c/strong>　闭区间上的连续函数一定能取到最大值和最小值。\u003c/p>\u003c/blockquote>\n\u003cp>在 Mathlib 中，这个定理是对\u003cstrong>紧集\u003c/strong>陈述的：\u003ccode>isCompact_Icc\u003c/code> 说闭区间是紧的，\u003ccode>IsCompact.exists_isMaxOn\u003c/code> 说紧集上的连续函数有最大值点。\u003ccode>IsMaxOn f s c\u003c/code> 的意思是 \u003cspan class=\"math\" data-tex=\"c\">\u003ci>c\u003c/i>\u003c/span> 是 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"s\">\u003ci>s\u003c/i>\u003c/span> 上的最大值点，\u003ccode>isMaxOn_iff\u003c/code> 把它展开为 \u003ccode>∀ x ∈ s, f x ≤ f c\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem exists_max {f : ℝ → ℝ} {a b : ℝ} (hab : a ≤ b) (hf : ContinuousOn f (Icc a b)) :\n    ∃ c ∈ Icc a b, ∀ x ∈ Icc a b, f x ≤ f c := by\n  obtain ⟨c, hc, hmax⟩ := isCompact_Icc.exists_isMaxOn (nonempty_Icc.mpr hab) hf\n  exact ⟨c, hc, isMaxOn_iff.mp hmax⟩","upto":2142},{"t":"p","html":"\u003ch2 id=\"ch08-s4\">练习\u003c/h2>\n\u003ch3 id=\"ch08-s5\">练习 8.1　方程的根\u003c/h3>\n\u003cp>证明方程 \u003cspan class=\"math\" data-tex=\"x^3 + x - 1 = 0\">\u003ci>x\u003c/i>\u003csup>3\u003c/sup> + \u003ci>x\u003c/i> − 1 = 0\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"[0, 1]\">[0, 1]\u003c/span> 中有根。\u003c/p>\n\u003cp>提示：模仿例 8.2。\u003c/p>"},{"t":"c","code":"theorem ex8_1 : ∃ x ∈ Icc (0 : ℝ) 1, x ^ 3 + x - 1 = 0 := by\n  sorry","upto":2295,"ex":{"id":"ch08:ex8_1","name":"ex8_1","solution":"theorem ex8_1 : ∃ x ∈ Icc (0 : ℝ) 1, x ^ 3 + x - 1 = 0 := by\n  have hcont : ContinuousOn (fun x : ℝ ↦ x ^ 3 + x - 1) (Icc 0 1) := by fun_prop\n  have hivt := intermediate_value_Icc (by norm_num : (0 : ℝ) ≤ 1) hcont\n  have h0 : (0 : ℝ) ∈ Icc ((0 : ℝ) ^ 3 + 0 - 1) ((1 : ℝ) ^ 3 + 1 - 1) := by\n    rw [mem_Icc]\n    norm_num\n  obtain ⟨x, hx, hx0⟩ := hivt h0\n  exact ⟨x, hx, hx0⟩"}},{"t":"p","html":"\u003ch3 id=\"ch08-s6\">练习 8.2　最小值\u003c/h3>\n\u003cp>仿照 \u003ccode>exists_max\u003c/code> 证明最小值的存在性。\u003c/p>\n\u003cp>提示：\u003ccode>IsCompact.exists_isMinOn\u003c/code> 与 \u003ccode>isMinOn_iff\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem exists_min {f : ℝ → ℝ} {a b : ℝ} (hab : a ≤ b) (hf : ContinuousOn f (Icc a b)) :\n    ∃ c ∈ Icc a b, ∀ x ∈ Icc a b, f c ≤ f x := by\n  sorry","upto":2541,"ex":{"id":"ch08:exists_min","name":"exists_min","solution":"theorem exists_min {f : ℝ → ℝ} {a b : ℝ} (hab : a ≤ b) (hf : ContinuousOn f (Icc a b)) :\n    ∃ c ∈ Icc a b, ∀ x ∈ Icc a b, f c ≤ f x := by\n  obtain ⟨c, hc, hmin⟩ := isCompact_Icc.exists_isMinOn (nonempty_Icc.mpr hab) hf\n  exact ⟨c, hc, isMinOn_iff.mp hmin⟩"}},{"t":"p","html":"\u003ch3 id=\"ch08-s7\">练习 8.3　闭区间上的连续函数有界\u003c/h3>\n\u003cp>提示：用 \u003ccode>exists_max\u003c/code> 和 \u003ccode>exists_min\u003c/code> 得到最大值 \u003cspan class=\"math\" data-tex=\"f(c_1)\">\u003ci>f\u003c/i>(\u003ci>c\u003c/i>\u003csub>1\u003c/sub>)\u003c/span> 和最小值 \u003cspan class=\"math\" data-tex=\"f(c_2)\">\u003ci>f\u003c/i>(\u003ci>c\u003c/i>\u003csub>2\u003c/sub>)\u003c/span>，取 \u003cspan class=\"math\" data-tex=\"M = |f(c_1)| + |f(c_2)|\">\u003ci>M\u003c/i> = |\u003ci>f\u003c/i>(\u003ci>c\u003c/i>\u003csub>1\u003c/sub>)| + |\u003ci>f\u003c/i>(\u003ci>c\u003c/i>\u003csub>2\u003c/sub>)|\u003c/span>。用 \u003ccode>abs_le\u003c/code> 拆开绝对值，再配合 \u003ccode>le_abs_self\u003c/code>、\u003ccode>neg_abs_le\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem ex8_3 {f : ℝ → ℝ} {a b : ℝ} (hab : a ≤ b) (hf : ContinuousOn f (Icc a b)) :\n    ∃ M, ∀ x ∈ Icc a b, |f x| ≤ M := by\n  sorry","upto":2845,"ex":{"id":"ch08:ex8_3","name":"ex8_3","solution":"theorem ex8_3 {f : ℝ → ℝ} {a b : ℝ} (hab : a ≤ b) (hf : ContinuousOn f (Icc a b)) :\n    ∃ M, ∀ x ∈ Icc a b, |f x| ≤ M := by\n  obtain ⟨c₁, _, hc₁⟩ := exists_max hab hf\n  obtain ⟨c₂, _, hc₂⟩ := exists_min hab hf\n  use |f c₁| + |f c₂|\n  intro x hx\n  have h1 := hc₁ x hx\n  have h2 := hc₂ x hx\n  rw [abs_le]\n  constructor\n  · linarith [neg_abs_le (f c₂), abs_nonneg (f c₁)]\n  · linarith [le_abs_self (f c₁), abs_nonneg (f c₂)]"}},{"t":"p","html":"\u003ch3 id=\"ch08-s8\">练习 8.4 ★　不动点定理\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"f : [0, 1] \\to [0, 1]\">\u003ci>f\u003c/i> : [0, 1] → [0, 1]\u003c/span> 连续，则存在 \u003cspan class=\"math\" data-tex=\"x \\in [0,1]\">\u003ci>x\u003c/i> ∈ [0,1]\u003c/span> 使 \u003cspan class=\"math\" data-tex=\"f(x) = x\">\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) = \u003ci>x\u003c/i>\u003c/span>。\u003c/p>\n\u003cp>提示：考虑 \u003cspan class=\"math\" data-tex=\"g(x) = f(x) - x\">\u003ci>g\u003c/i>(\u003ci>x\u003c/i>) = \u003ci>f\u003c/i>(\u003ci>x\u003c/i>) − \u003ci>x\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"g(0) \\ge 0 \\ge g(1)\">\u003ci>g\u003c/i>(0) ≥ 0 ≥ \u003ci>g\u003c/i>(1)\u003c/span>。对 \u003cspan class=\"math\" data-tex=\"g\">\u003ci>g\u003c/i>\u003c/span> 使用 \u003ccode>intermediate_value_Icc'\u003c/code>，目标值为 \u003cspan class=\"math\" data-tex=\"0\">0\u003c/span>。\u003ccode>ContinuousOn.sub hf continuousOn_id\u003c/code> 给出 \u003cspan class=\"math\" data-tex=\"g\">\u003ci>g\u003c/i>\u003c/span> 的连续性（或者试试 \u003ccode>fun_prop\u003c/code>）。\u003c/p>"},{"t":"c","code":"theorem ex8_4 {f : ℝ → ℝ} (hf : ContinuousOn f (Icc 0 1))\n    (hmaps : ∀ x ∈ Icc (0 : ℝ) 1, f x ∈ Icc (0 : ℝ) 1) :\n    ∃ x ∈ Icc (0 : ℝ) 1, f x = x := by\n  sorry","upto":3259,"ex":{"id":"ch08:ex8_4","name":"ex8_4","solution":"theorem ex8_4 {f : ℝ → ℝ} (hf : ContinuousOn f (Icc 0 1))\n    (hmaps : ∀ x ∈ Icc (0 : ℝ) 1, f x ∈ Icc (0 : ℝ) 1) :\n    ∃ x ∈ Icc (0 : ℝ) 1, f x = x := by\n  have hg : ContinuousOn (fun x ↦ f x - x) (Icc 0 1) := hf.sub continuousOn_id\n  have hivt := intermediate_value_Icc' (by norm_num : (0 : ℝ) ≤ 1) hg\n  have h0 := hmaps 0 (by rw [mem_Icc]; norm_num)\n  have h1 := hmaps 1 (by rw [mem_Icc]; norm_num)\n  rw [mem_Icc] at h0 h1\n  have hmem : (0 : ℝ) ∈ Icc (f 1 - 1) (f 0 - 0) := by\n    rw [mem_Icc]\n    constructor\n    · linarith\n    · linarith\n  obtain ⟨x, hx, hx0⟩ := hivt hmem\n  refine ⟨x, hx, ?_⟩\n  have : f x - x = 0 := hx0\n  linarith"}},{"t":"p","html":"\u003ch3 id=\"ch08-s9\">练习 8.5 ★　开区间上可能取不到最大值\u003c/h3>\n\u003cp>最值定理中&quot;闭区间&quot;的条件不能去掉：\u003cspan class=\"math\" data-tex=\"f(x) = x\">\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) = \u003ci>x\u003c/i>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"(0, 1)\">(0, 1)\u003c/span> 上没有最大值。\u003c/p>\n\u003cp>提示：若 \u003cspan class=\"math\" data-tex=\"c \\in (0, 1)\">\u003ci>c\u003c/i> ∈ (0, 1)\u003c/span> 是最大值点，考虑 \u003cspan class=\"math\" data-tex=\"\\frac{c + 1}{2}\">(\u003ci>c\u003c/i> + 1)/2\u003c/span>。\u003ccode>Set.mem_Ioo\u003c/code> 展开开区间的成员关系。\u003c/p>"},{"t":"c","code":"theorem ex8_5 : ¬ ∃ c ∈ Ioo (0 : ℝ) 1, ∀ x ∈ Ioo (0 : ℝ) 1, x ≤ c := by\n  sorry","upto":3496,"ex":{"id":"ch08:ex8_5","name":"ex8_5","solution":"theorem ex8_5 : ¬ ∃ c ∈ Ioo (0 : ℝ) 1, ∀ x ∈ Ioo (0 : ℝ) 1, x ≤ c := by\n  rintro ⟨c, hc, hmax⟩\n  rw [mem_Ioo] at hc\n  have hmem : (c + 1) / 2 ∈ Ioo (0 : ℝ) 1 := by\n    rw [mem_Ioo]\n    constructor\n    · linarith\n    · linarith\n  have h1 := hmax ((c + 1) / 2) hmem\n  linarith"}},{"t":"p","html":"\u003ch2 id=\"ch08-s10\">本章小结\u003c/h2>\n\u003cul>\u003cli>介值定理：\u003ccode>intermediate_value_Icc\u003c/code>（及其反向版本 \u003ccode>intermediate_value_Icc'\u003c/code>）；\u003c/li>\u003cli>最值定理：\u003ccode>IsCompact.exists_isMaxOn\u003c/code> / \u003ccode>exists_isMinOn\u003c/code> 配合 \u003ccode>isCompact_Icc\u003c/code>；\u003c/li>\u003cli>连续性的自动证明：\u003ccode>fun_prop\u003c/code>；\u003c/li>\u003cli>使用库中定理时，关键是逐条核对它的\u003cstrong>前提条件\u003c/strong>。\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>延伸阅读\u003c/strong>：闭区间上的连续函数还是\u003cstrong>一致连续\u003c/strong>的（Cantor 定理），在 Mathlib 中为 \u003ccode>IsCompact.uniformContinuousOn_of_continuous\u003c/code>。\u003c/p>"}]},{"id":"ch09","num":9,"title":"导数与中值定理","summary":"导数的线性逼近定义，可导必连续，拉格朗日中值定理。","file":"Analysis/Ch09_Derivative.lean","exercises":6,"source":"import Mathlib\n\n/-!\n# 第 9 章　导数与中值定理\n\n导数描述函数的**瞬时变化率**。经典的定义是差商的极限：\n$$f'(a) = \\lim_{x \\to a} \\frac{f(x) - f(a)}{x - a}.$$\n\n## 9.1 不用除法的定义\n\n差商定义中有除法，并且要求 $x \\ne a$，在形式化时有些麻烦。\n我们采用一个等价的、更适合估计的形式：$f'(a)$ 是使得\n$$f(x) = f(a) + f'(a)(x - a) + \\text{（比 } |x - a| \\text{ 更小的误差）}$$\n成立的那个数。也就是说，$f$ 在 $a$ 附近可以用直线 $f(a) + f'(a)(x-a)$ 来**线性逼近**。\n\n> **定义 9.1**　称 $f$ 在 $a$ 处可导且导数为 $f'$，如果\n> $$\\forall \\varepsilon > 0,\\ \\exists \\delta > 0,\\ \\forall x,\\ |x - a| \u003c \\delta \\Rightarrow\n> |f(x) - f(a) - f'\\cdot(x - a)| \\le \\varepsilon |x - a|.$$\n\n对 $x \\ne a$，两边除以 $|x - a|$，就得到 $\\left|\\frac{f(x) - f(a)}{x - a} - f'\\right| \\le \\varepsilon$，\n这正是差商极限的定义。\n-/\n\nnamespace Ch09\n\n/-- `f` 在 `a` 处可导，导数为 `f'`。 -/\ndef HasDeriv (f : ℝ → ℝ) (f' a : ℝ) : Prop :=\n  ∀ ε > 0, ∃ δ > 0, ∀ x, |x - a| \u003c δ → |f x - f a - f' * (x - a)| ≤ ε * |x - a|\n\n/-!\n## 9.2 例子：$(x^2)' = 2x$\n\n> **例 9.2**　$f(x) = x^2$ 在 $a$ 处的导数为 $2a$。\n\n**草稿**：误差项为\n$$x^2 - a^2 - 2a(x - a) = (x - a)^2,$$\n所以 $|{\\text{误差}}| = |x - a| \\cdot |x - a|$。只要 $|x - a| \u003c \\varepsilon$，\n误差就 $\\le \\varepsilon |x - a|$。取 $\\delta = \\varepsilon$。\n-/\n\nexample (a : ℝ) : HasDeriv (fun x ↦ x ^ 2) (2 * a) a := by\n  intro ε hε\n  refine ⟨ε, hε, fun x hx ↦ ?_⟩\n  show |x ^ 2 - a ^ 2 - 2 * a * (x - a)| ≤ ε * |x - a|\n  have h : x ^ 2 - a ^ 2 - 2 * a * (x - a) = (x - a) * (x - a) := by ring\n  rw [h, abs_mul]\n  exact mul_le_mul_of_nonneg_right hx.le (abs_nonneg _)\n\n/-!\n## 9.3 可导必连续\n\n为了陈述\"可导必连续\"，我们再次引入连续的定义。\n-/\n\n/-- 函数 `f` 在点 `a` 处连续。 -/\ndef ContAt (f : ℝ → ℝ) (a : ℝ) : Prop :=\n  ∀ ε > 0, ∃ δ > 0, ∀ x, |x - a| \u003c δ → |f x - f a| \u003c ε\n\n/-!\n## 练习（一）：用定义计算导数\n\n### 练习 9.1　常数的导数为零\n提示：取 $\\delta = 1$。`simp` 可以化简误差项，剩下的目标可以用 `positivity`。\n-/\n\ntheorem hasDeriv_const (c a : ℝ) : HasDeriv (fun _ ↦ c) 0 a := by\n  sorry\n\n/-!\n### 练习 9.2　线性函数的导数\n$(mx + b)' = m$。误差项恒等于零！\n-/\n\ntheorem hasDeriv_linear (m b a : ℝ) : HasDeriv (fun x ↦ m * x + b) m a := by\n  sorry\n\n/-!\n### 练习 9.3 ★　和的求导法则\n$(f + g)' = f' + g'$。\n\n提示：$\\frac{\\varepsilon}{2}$ 技巧与 $\\delta = \\min(\\delta_1, \\delta_2)$。\n误差项可以拆成 $f$ 的误差加上 $g$ 的误差。\n-/\n\ntheorem hasDeriv_add {f g : ℝ → ℝ} {f' g' a : ℝ} (hf : HasDeriv f f' a) (hg : HasDeriv g g' a) :\n    HasDeriv (fun x ↦ f x + g x) (f' + g') a := by\n  sorry\n\n/-!\n### 练习 9.4 ★★　可导必连续\n**草稿**：取定义中 $\\varepsilon = 1$ 得到 $\\delta_0$。当 $|x - a| \u003c \\delta_0$ 时\n$$|f(x) - f(a)| \\le |f(x) - f(a) - f'(x - a)| + |f'||x - a| \\le (1 + |f'|)|x - a|.$$\n因此取 $\\delta = \\min\\left(\\delta_0, \\frac{\\varepsilon}{1 + |f'|}\\right)$。\n\n提示：最后一步需要 $(1 + |f'|) \\cdot |x - a| \u003c (1 + |f'|) \\cdot \\frac{\\varepsilon}{1 + |f'|} = \\varepsilon$，\n`mul_lt_mul_of_pos_left` 和 `field_simp` 会有帮助。\n-/\n\ntheorem contAt_of_hasDeriv {f : ℝ → ℝ} {f' a : ℝ} (hf : HasDeriv f f' a) : ContAt f a := by\n  sorry\n\n/-!\n## 9.4 Mathlib 中的导数\n\nMathlib 中 `HasDerivAt f f' a` 表示 $f$ 在 $a$ 处的导数为 $f'$，\n`deriv f a` 是导数的值，`Differentiable ℝ f` 表示 $f$ 处处可导。\nMathlib 提供了完整的求导法则，例如 `HasDerivAt.add`、`HasDerivAt.mul`、`hasDerivAt_pow`。\n\n组合使用这些法则，就可以求出具体函数的导数。`hasDerivAt_pow 2 x` 给出\n$(x^2)' = 2x^{2-1}$，`simpa` 把它化简成 $2x$；`HasDerivAt.const_mul` 处理常数倍；\n`h1.add h2` 是和的求导法则；最后 `.deriv` 从 `HasDerivAt` 得到 `deriv` 的值。\n-/\n\nexample (x : ℝ) : deriv (fun x : ℝ ↦ x ^ 2 + 3 * x) x = 2 * x + 3 := by\n  have h1 : HasDerivAt (fun x : ℝ ↦ x ^ 2) (2 * x) x := by\n    simpa using hasDerivAt_pow 2 x\n  have h2 : HasDerivAt (fun x : ℝ ↦ 3 * x) 3 x := by\n    simpa using (hasDerivAt_id x).const_mul 3\n  exact (h1.add h2).deriv\n\n/-!\n## 9.5 微分中值定理\n\n> **定理 9.3（拉格朗日中值定理）**　若 $f$ 在 $[a, b]$ 上连续、在 $(a, b)$ 内可导，\n> 则存在 $c \\in (a, b)$ 使得\n> $$f'(c) = \\frac{f(b) - f(a)}{b - a}.$$\n\n几何意义：曲线上总有一点的切线平行于两端点的连线。Mathlib 中的陈述为\n\n```text\nexists_deriv_eq_slope (f : ℝ → ℝ) (hab : a \u003c b) (hfc : ContinuousOn f (Icc a b))\n    (hfd : DifferentiableOn ℝ f (Ioo a b)) : ∃ c ∈ Ioo a b, deriv f c = (f b - f a) / (b - a)\n```\n\n中值定理是联系**导数**（局部信息）与**函数值**（整体信息）的桥梁。\n\n> **例 9.4**　若 $f' \\equiv 0$，则 $f$ 是常数。\n\n**证明**：对任意 $x \u003c y$，由中值定理存在 $c$ 使 $0 = f'(c) = \\frac{f(y) - f(x)}{y - x}$，\n所以 $f(y) = f(x)$。\n-/\n\ntheorem const_of_deriv_zero {f : ℝ → ℝ} (hf : Differentiable ℝ f) (h : ∀ x, deriv f x = 0)\n    {x y : ℝ} (hxy : x \u003c y) : f x = f y := by\n  obtain ⟨c, _, hc⟩ := exists_deriv_eq_slope f hxy hf.continuous.continuousOn\n    hf.differentiableOn\n  rw [h c, eq_comm, div_eq_zero_iff] at hc\n  rcases hc with hc | hc\n  · linarith\n  · linarith\n\n/-!\n`div_eq_zero_iff : a / b = 0 ↔ a = 0 ∨ b = 0`。第二种情形 $y - x = 0$ 与 $x \u003c y$ 矛盾。\n\n## 练习（二）：中值定理的应用\n\n### 练习 9.5 ★　导数非负则函数递增\n若 $f$ 处处可导且 $f' \\ge 0$，则 $a \u003c b$ 时 $f(a) \\le f(b)$。\n\n提示：模仿例 9.4。得到 `hc : 0 ≤ (f b - f a) / (b - a)` 后，\n`div_nonneg_iff` 或 `le_div_iff₀ (hc : 0 \u003c c) : a ≤ b / c ↔ a * c ≤ b` 可以去分母。\n-/\n\ntheorem ex9_5 {f : ℝ → ℝ} (hf : Differentiable ℝ f) (h : ∀ x, 0 ≤ deriv f x)\n    {a b : ℝ} (hab : a \u003c b) : f a ≤ f b := by\n  sorry\n\n/-!\n### 练习 9.6 ★★　导数有界则函数利普希茨\n若 $|f'| \\le M$，则 $a \u003c b$ 时 $|f(b) - f(a)| \\le M (b - a)$。\n\n提示：由中值定理，$\\frac{f(b) - f(a)}{b - a} = f'(c)$，于是\n$f(b) - f(a) = f'(c) (b - a)$（`div_eq_iff`），再用 `abs_mul`。\n-/\n\ntheorem ex9_6 {f : ℝ → ℝ} {M : ℝ} (hf : Differentiable ℝ f) (h : ∀ x, |deriv f x| ≤ M)\n    {a b : ℝ} (hab : a \u003c b) : |f b - f a| ≤ M * (b - a) := by\n  sorry\n\n/-!\n## 本章小结\n\n* 导数的线性逼近定义：误差 $\\le \\varepsilon |x - a|$；\n* 可导必连续，求导法则可以用 $\\varepsilon$-$\\delta$ 严格证明；\n* 拉格朗日中值定理 `exists_deriv_eq_slope` 把导数的信息转化为函数值的信息。\n\n## 全书结语\n\n恭喜你完成了本书！你已经亲手用 Lean 严格证明了数学分析入门的核心定理：\n极限的唯一性与运算法则、夹逼定理、单调收敛定理、连续函数的运算、\n介值定理与最值定理的应用、可导必连续以及中值定理的应用。\n\n接下来可以继续探索：\n\n* [Mathematics in Lean](https://leanprover-community.github.io/mathematics_in_lean/)：Lean 官方的数学教程；\n* [Mathlib 文档](https://leanprover-community.github.io/mathlib4_docs/)：查找定理；\n* 尝试用本书的方法形式化积分、级数与一致收敛。\n-/\n\nend Ch09\n","blocks":[{"t":"p","html":"\u003cp>导数描述函数的\u003cstrong>瞬时变化率\u003c/strong>。经典的定义是差商的极限：\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"f'(a) = \\lim_{x \\to a} \\frac{f(x) - f(a)}{x - a}.\">\u003ci>f\u003c/i>'(\u003ci>a\u003c/i>) = lim\u003csub>\u003ci>x\u003c/i> → \u003ci>a\u003c/i>\u003c/sub> (\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) − \u003ci>f\u003c/i>(\u003ci>a\u003c/i>))/(\u003ci>x\u003c/i> − \u003ci>a\u003c/i>).\u003c/span>\u003c/div>\n\u003ch2 id=\"ch09-s1\">9.1 不用除法的定义\u003c/h2>\n\u003cp>差商定义中有除法，并且要求 \u003cspan class=\"math\" data-tex=\"x \\ne a\">\u003ci>x\u003c/i> ≠ \u003ci>a\u003c/i>\u003c/span>，在形式化时有些麻烦。我们采用一个等价的、更适合估计的形式：\u003cspan class=\"math\" data-tex=\"f'(a)\">\u003ci>f\u003c/i>'(\u003ci>a\u003c/i>)\u003c/span> 是使得\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"f(x) = f(a) + f'(a)(x - a) + \\text{（比 } |x - a| \\text{ 更小的误差）}\">\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) = \u003ci>f\u003c/i>(\u003ci>a\u003c/i>) + \u003ci>f\u003c/i>'(\u003ci>a\u003c/i>)(\u003ci>x\u003c/i> − \u003ci>a\u003c/i>) + （比 |\u003ci>x\u003c/i> − \u003ci>a\u003c/i>| 更小的误差）\u003c/span>\u003c/div>\n\u003cp>成立的那个数。也就是说，\u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> 附近可以用直线 \u003cspan class=\"math\" data-tex=\"f(a) + f'(a)(x-a)\">\u003ci>f\u003c/i>(\u003ci>a\u003c/i>) + \u003ci>f\u003c/i>'(\u003ci>a\u003c/i>)(\u003ci>x\u003c/i>−\u003ci>a\u003c/i>)\u003c/span> 来\u003cstrong>线性逼近\u003c/strong>。\u003c/p>\n\u003cblockquote class=\"callout callout-def\">\u003cp>\u003cstrong>定义 9.1\u003c/strong>　称 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> 处可导且导数为 \u003cspan class=\"math\" data-tex=\"f'\">\u003ci>f\u003c/i>'\u003c/span>，如果\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"\\forall \\varepsilon &gt; 0,\\ \\exists \\delta &gt; 0,\\ \\forall x,\\ |x - a| &lt; \\delta \\Rightarrow\n|f(x) - f(a) - f'\\cdot(x - a)| \\le \\varepsilon |x - a|.\">∀ ε &gt; 0, ∃ δ &gt; 0, ∀ \u003ci>x\u003c/i>, |\u003ci>x\u003c/i> − \u003ci>a\u003c/i>| &lt; δ ⇒ |\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) − \u003ci>f\u003c/i>(\u003ci>a\u003c/i>) − \u003ci>f\u003c/i>'·(\u003ci>x\u003c/i> − \u003ci>a\u003c/i>)| ≤ ε |\u003ci>x\u003c/i> − \u003ci>a\u003c/i>|.\u003c/span>\u003c/div>\u003c/blockquote>\n\u003cp>对 \u003cspan class=\"math\" data-tex=\"x \\ne a\">\u003ci>x\u003c/i> ≠ \u003ci>a\u003c/i>\u003c/span>，两边除以 \u003cspan class=\"math\" data-tex=\"|x - a|\">|\u003ci>x\u003c/i> − \u003ci>a\u003c/i>|\u003c/span>，就得到 \u003cspan class=\"math\" data-tex=\"\\left|\\frac{f(x) - f(a)}{x - a} - f'\\right| \\le \\varepsilon\">|(\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) − \u003ci>f\u003c/i>(\u003ci>a\u003c/i>))/(\u003ci>x\u003c/i> − \u003ci>a\u003c/i>) − \u003ci>f\u003c/i>'| ≤ ε\u003c/span>，这正是差商极限的定义。\u003c/p>"},{"t":"c","code":"/-- `f` 在 `a` 处可导，导数为 `f'`。 -/\ndef HasDeriv (f : ℝ → ℝ) (f' a : ℝ) : Prop :=\n  ∀ ε > 0, ∃ δ > 0, ∀ x, |x - a| \u003c δ → |f x - f a - f' * (x - a)| ≤ ε * |x - a|","upto":811},{"t":"p","html":"\u003ch2 id=\"ch09-s2\">9.2 例子：\u003cspan class=\"math\" data-tex=\"(x^2)' = 2x\">(\u003ci>x\u003c/i>\u003csup>2\u003c/sup>)' = 2\u003ci>x\u003c/i>\u003c/span>\u003c/h2>\n\u003cblockquote class=\"callout callout-example\">\u003cp>\u003cstrong>例 9.2\u003c/strong>　\u003cspan class=\"math\" data-tex=\"f(x) = x^2\">\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) = \u003ci>x\u003c/i>\u003csup>2\u003c/sup>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> 处的导数为 \u003cspan class=\"math\" data-tex=\"2a\">2\u003ci>a\u003c/i>\u003c/span>。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>草稿\u003c/strong>：误差项为\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"x^2 - a^2 - 2a(x - a) = (x - a)^2,\">\u003ci>x\u003c/i>\u003csup>2\u003c/sup> − \u003ci>a\u003c/i>\u003csup>2\u003c/sup> − 2\u003ci>a\u003c/i>(\u003ci>x\u003c/i> − \u003ci>a\u003c/i>) = (\u003ci>x\u003c/i> − \u003ci>a\u003c/i>)\u003csup>2\u003c/sup>,\u003c/span>\u003c/div>\n\u003cp>所以 \u003cspan class=\"math\" data-tex=\"|{\\text{误差}}| = |x - a| \\cdot |x - a|\">|误差| = |\u003ci>x\u003c/i> − \u003ci>a\u003c/i>| · |\u003ci>x\u003c/i> − \u003ci>a\u003c/i>|\u003c/span>。只要 \u003cspan class=\"math\" data-tex=\"|x - a| &lt; \\varepsilon\">|\u003ci>x\u003c/i> − \u003ci>a\u003c/i>| &lt; ε\u003c/span>，误差就 \u003cspan class=\"math\" data-tex=\"\\le \\varepsilon |x - a|\">≤ ε |\u003ci>x\u003c/i> − \u003ci>a\u003c/i>|\u003c/span>。取 \u003cspan class=\"math\" data-tex=\"\\delta = \\varepsilon\">δ = ε\u003c/span>。\u003c/p>"},{"t":"c","code":"example (a : ℝ) : HasDeriv (fun x ↦ x ^ 2) (2 * a) a := by\n  intro ε hε\n  refine ⟨ε, hε, fun x hx ↦ ?_⟩\n  show |x ^ 2 - a ^ 2 - 2 * a * (x - a)| ≤ ε * |x - a|\n  have h : x ^ 2 - a ^ 2 - 2 * a * (x - a) = (x - a) * (x - a) := by ring\n  rw [h, abs_mul]\n  exact mul_le_mul_of_nonneg_right hx.le (abs_nonneg _)","upto":1374},{"t":"p","html":"\u003ch2 id=\"ch09-s3\">9.3 可导必连续\u003c/h2>\n\u003cp>为了陈述&quot;可导必连续&quot;，我们再次引入连续的定义。\u003c/p>"},{"t":"c","code":"/-- 函数 `f` 在点 `a` 处连续。 -/\ndef ContAt (f : ℝ → ℝ) (a : ℝ) : Prop :=\n  ∀ ε > 0, ∃ δ > 0, ∀ x, |x - a| \u003c δ → |f x - f a| \u003c ε","upto":1544},{"t":"p","html":"\u003ch2 id=\"ch09-s4\">练习（一）：用定义计算导数\u003c/h2>\n\u003ch3 id=\"ch09-s5\">练习 9.1　常数的导数为零\u003c/h3>\n\u003cp>提示：取 \u003cspan class=\"math\" data-tex=\"\\delta = 1\">δ = 1\u003c/span>。\u003ccode>simp\u003c/code> 可以化简误差项，剩下的目标可以用 \u003ccode>positivity\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem hasDeriv_const (c a : ℝ) : HasDeriv (fun _ ↦ c) 0 a := by\n  sorry","upto":1720,"ex":{"id":"ch09:hasDeriv_const","name":"hasDeriv_const","solution":"theorem hasDeriv_const (c a : ℝ) : HasDeriv (fun _ ↦ c) 0 a := by\n  intro ε hε\n  refine ⟨1, one_pos, fun x _ ↦ ?_⟩\n  simp\n  positivity"}},{"t":"p","html":"\u003ch3 id=\"ch09-s6\">练习 9.2　线性函数的导数\u003c/h3>\n\u003cp>\u003cspan class=\"math\" data-tex=\"(mx + b)' = m\">(mx + \u003ci>b\u003c/i>)' = \u003ci>m\u003c/i>\u003c/span>。误差项恒等于零！\u003c/p>"},{"t":"c","code":"theorem hasDeriv_linear (m b a : ℝ) : HasDeriv (fun x ↦ m * x + b) m a := by\n  sorry","upto":1858,"ex":{"id":"ch09:hasDeriv_linear","name":"hasDeriv_linear","solution":"theorem hasDeriv_linear (m b a : ℝ) : HasDeriv (fun x ↦ m * x + b) m a := by\n  intro ε hε\n  refine ⟨1, one_pos, fun x _ ↦ ?_⟩\n  show |m * x + b - (m * a + b) - m * (x - a)| ≤ ε * |x - a|\n  rw [show m * x + b - (m * a + b) - m * (x - a) = 0 by ring, abs_zero]\n  positivity"}},{"t":"p","html":"\u003ch3 id=\"ch09-s7\">练习 9.3 ★　和的求导法则\u003c/h3>\n\u003cp>\u003cspan class=\"math\" data-tex=\"(f + g)' = f' + g'\">(\u003ci>f\u003c/i> + \u003ci>g\u003c/i>)' = \u003ci>f\u003c/i>' + \u003ci>g\u003c/i>'\u003c/span>。\u003c/p>\n\u003cp>提示：\u003cspan class=\"math\" data-tex=\"\\frac{\\varepsilon}{2}\">ε/2\u003c/span> 技巧与 \u003cspan class=\"math\" data-tex=\"\\delta = \\min(\\delta_1, \\delta_2)\">δ = min(δ\u003csub>1\u003c/sub>, δ\u003csub>2\u003c/sub>)\u003c/span>。误差项可以拆成 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 的误差加上 \u003cspan class=\"math\" data-tex=\"g\">\u003ci>g\u003c/i>\u003c/span> 的误差。\u003c/p>"},{"t":"c","code":"theorem hasDeriv_add {f g : ℝ → ℝ} {f' g' a : ℝ} (hf : HasDeriv f f' a) (hg : HasDeriv g g' a) :\n    HasDeriv (fun x ↦ f x + g x) (f' + g') a := by\n  sorry","upto":2161,"ex":{"id":"ch09:hasDeriv_add","name":"hasDeriv_add","solution":"theorem hasDeriv_add {f g : ℝ → ℝ} {f' g' a : ℝ} (hf : HasDeriv f f' a) (hg : HasDeriv g g' a) :\n    HasDeriv (fun x ↦ f x + g x) (f' + g') a := by\n  intro ε hε\n  obtain ⟨δ₁, hδ₁, h₁⟩ := hf (ε / 2) (by positivity)\n  obtain ⟨δ₂, hδ₂, h₂⟩ := hg (ε / 2) (by positivity)\n  refine ⟨min δ₁ δ₂, lt_min hδ₁ hδ₂, fun x hx ↦ ?_⟩\n  have hx₁ := h₁ x (lt_of_lt_of_le hx (min_le_left _ _))\n  have hx₂ := h₂ x (lt_of_lt_of_le hx (min_le_right _ _))\n  calc |f x + g x - (f a + g a) - (f' + g') * (x - a)|\n      = |(f x - f a - f' * (x - a)) + (g x - g a - g' * (x - a))| := by congr 1; ring\n    _ ≤ |f x - f a - f' * (x - a)| + |g x - g a - g' * (x - a)| := abs_add_le _ _\n    _ ≤ ε / 2 * |x - a| + ε / 2 * |x - a| := add_le_add hx₁ hx₂\n    _ = ε * |x - a| := by ring"}},{"t":"p","html":"\u003ch3 id=\"ch09-s8\">练习 9.4 ★★　可导必连续\u003c/h3>\n\u003cp>\u003cstrong>草稿\u003c/strong>：取定义中 \u003cspan class=\"math\" data-tex=\"\\varepsilon = 1\">ε = 1\u003c/span> 得到 \u003cspan class=\"math\" data-tex=\"\\delta_0\">δ\u003csub>0\u003c/sub>\u003c/span>。当 \u003cspan class=\"math\" data-tex=\"|x - a| &lt; \\delta_0\">|\u003ci>x\u003c/i> − \u003ci>a\u003c/i>| &lt; δ\u003csub>0\u003c/sub>\u003c/span> 时\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"|f(x) - f(a)| \\le |f(x) - f(a) - f'(x - a)| + |f'||x - a| \\le (1 + |f'|)|x - a|.\">|\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) − \u003ci>f\u003c/i>(\u003ci>a\u003c/i>)| ≤ |\u003ci>f\u003c/i>(\u003ci>x\u003c/i>) − \u003ci>f\u003c/i>(\u003ci>a\u003c/i>) − \u003ci>f\u003c/i>'(\u003ci>x\u003c/i> − \u003ci>a\u003c/i>)| + |\u003ci>f\u003c/i>'||\u003ci>x\u003c/i> − \u003ci>a\u003c/i>| ≤ (1 + |\u003ci>f\u003c/i>'|)|\u003ci>x\u003c/i> − \u003ci>a\u003c/i>|.\u003c/span>\u003c/div>\n\u003cp>因此取 \u003cspan class=\"math\" data-tex=\"\\delta = \\min\\left(\\delta_0, \\frac{\\varepsilon}{1 + |f'|}\\right)\">δ = min(δ\u003csub>0\u003c/sub>, ε/(1 + |\u003ci>f\u003c/i>'|))\u003c/span>。\u003c/p>\n\u003cp>提示：最后一步需要 \u003cspan class=\"math\" data-tex=\"(1 + |f'|) \\cdot |x - a| &lt; (1 + |f'|) \\cdot \\frac{\\varepsilon}{1 + |f'|} = \\varepsilon\">(1 + |\u003ci>f\u003c/i>'|) · |\u003ci>x\u003c/i> − \u003ci>a\u003c/i>| &lt; (1 + |\u003ci>f\u003c/i>'|) · ε/(1 + |\u003ci>f\u003c/i>'|) = ε\u003c/span>，\u003ccode>mul_lt_mul_of_pos_left\u003c/code> 和 \u003ccode>field_simp\u003c/code> 会有帮助。\u003c/p>"},{"t":"c","code":"theorem contAt_of_hasDeriv {f : ℝ → ℝ} {f' a : ℝ} (hf : HasDeriv f f' a) : ContAt f a := by\n  sorry","upto":2663,"ex":{"id":"ch09:contAt_of_hasDeriv","name":"contAt_of_hasDeriv","solution":"theorem contAt_of_hasDeriv {f : ℝ → ℝ} {f' a : ℝ} (hf : HasDeriv f f' a) : ContAt f a := by\n  intro ε hε\n  obtain ⟨δ₀, hδ₀, h₀⟩ := hf 1 one_pos\n  have hK : 0 \u003c 1 + |f'| := by positivity\n  refine ⟨min δ₀ (ε / (1 + |f'|)), lt_min hδ₀ (by positivity), fun x hx ↦ ?_⟩\n  have hx₀ : |x - a| \u003c δ₀ := lt_of_lt_of_le hx (min_le_left _ _)\n  have hx₁ : |x - a| \u003c ε / (1 + |f'|) := lt_of_lt_of_le hx (min_le_right _ _)\n  have h1 := h₀ x hx₀\n  calc |f x - f a| = |(f x - f a - f' * (x - a)) + f' * (x - a)| := by congr 1; ring\n    _ ≤ |f x - f a - f' * (x - a)| + |f' * (x - a)| := abs_add_le _ _\n    _ ≤ 1 * |x - a| + |f'| * |x - a| := by rw [abs_mul]; linarith\n    _ = (1 + |f'|) * |x - a| := by ring\n    _ \u003c (1 + |f'|) * (ε / (1 + |f'|)) := mul_lt_mul_of_pos_left hx₁ hK\n    _ = ε := by field_simp"}},{"t":"p","html":"\u003ch2 id=\"ch09-s9\">9.4 Mathlib 中的导数\u003c/h2>\n\u003cp>Mathlib 中 \u003ccode>HasDerivAt f f' a\u003c/code> 表示 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"a\">\u003ci>a\u003c/i>\u003c/span> 处的导数为 \u003cspan class=\"math\" data-tex=\"f'\">\u003ci>f\u003c/i>'\u003c/span>，\u003ccode>deriv f a\u003c/code> 是导数的值，\u003ccode>Differentiable ℝ f\u003c/code> 表示 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 处处可导。Mathlib 提供了完整的求导法则，例如 \u003ccode>HasDerivAt.add\u003c/code>、\u003ccode>HasDerivAt.mul\u003c/code>、\u003ccode>hasDerivAt_pow\u003c/code>。\u003c/p>\n\u003cp>组合使用这些法则，就可以求出具体函数的导数。\u003ccode>hasDerivAt_pow 2 x\u003c/code> 给出\u003cspan class=\"math\" data-tex=\"(x^2)' = 2x^{2-1}\">(\u003ci>x\u003c/i>\u003csup>2\u003c/sup>)' = 2\u003ci>x\u003c/i>\u003csup>2−1\u003c/sup>\u003c/span>，\u003ccode>simpa\u003c/code> 把它化简成 \u003cspan class=\"math\" data-tex=\"2x\">2\u003ci>x\u003c/i>\u003c/span>；\u003ccode>HasDerivAt.const_mul\u003c/code> 处理常数倍；\u003ccode>h1.add h2\u003c/code> 是和的求导法则；最后 \u003ccode>.deriv\u003c/code> 从 \u003ccode>HasDerivAt\u003c/code> 得到 \u003ccode>deriv\u003c/code> 的值。\u003c/p>"},{"t":"c","code":"example (x : ℝ) : deriv (fun x : ℝ ↦ x ^ 2 + 3 * x) x = 2 * x + 3 := by\n  have h1 : HasDerivAt (fun x : ℝ ↦ x ^ 2) (2 * x) x := by\n    simpa using hasDerivAt_pow 2 x\n  have h2 : HasDerivAt (fun x : ℝ ↦ 3 * x) 3 x := by\n    simpa using (hasDerivAt_id x).const_mul 3\n  exact (h1.add h2).deriv","upto":3343},{"t":"p","html":"\u003ch2 id=\"ch09-s10\">9.5 微分中值定理\u003c/h2>\n\u003cblockquote class=\"callout callout-thm\">\u003cp>\u003cstrong>定理 9.3（拉格朗日中值定理）\u003c/strong>　若 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 在 \u003cspan class=\"math\" data-tex=\"[a, b]\">[\u003ci>a\u003c/i>, \u003ci>b\u003c/i>]\u003c/span> 上连续、在 \u003cspan class=\"math\" data-tex=\"(a, b)\">(\u003ci>a\u003c/i>, \u003ci>b\u003c/i>)\u003c/span> 内可导，则存在 \u003cspan class=\"math\" data-tex=\"c \\in (a, b)\">\u003ci>c\u003c/i> ∈ (\u003ci>a\u003c/i>, \u003ci>b\u003c/i>)\u003c/span> 使得\u003c/p>\n\u003cdiv class=\"math-block\">\u003cspan class=\"math\" data-display=\"1\" data-tex=\"f'(c) = \\frac{f(b) - f(a)}{b - a}.\">\u003ci>f\u003c/i>'(\u003ci>c\u003c/i>) = (\u003ci>f\u003c/i>(\u003ci>b\u003c/i>) − \u003ci>f\u003c/i>(\u003ci>a\u003c/i>))/(\u003ci>b\u003c/i> − \u003ci>a\u003c/i>).\u003c/span>\u003c/div>\u003c/blockquote>\n\u003cp>几何意义：曲线上总有一点的切线平行于两端点的连线。Mathlib 中的陈述为\u003c/p>\n\u003cpre class=\"snippet\">\u003ccode>exists_deriv_eq_slope (f : ℝ → ℝ) (hab : a &lt; b) (hfc : ContinuousOn f (Icc a b))\n    (hfd : DifferentiableOn ℝ f (Ioo a b)) : ∃ c ∈ Ioo a b, deriv f c = (f b - f a) / (b - a)\u003c/code>\u003c/pre>\n\u003cp>中值定理是联系\u003cstrong>导数\u003c/strong>（局部信息）与\u003cstrong>函数值\u003c/strong>（整体信息）的桥梁。\u003c/p>\n\u003cblockquote class=\"callout callout-example\">\u003cp>\u003cstrong>例 9.4\u003c/strong>　若 \u003cspan class=\"math\" data-tex=\"f' \\equiv 0\">\u003ci>f\u003c/i>' ≡ 0\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 是常数。\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>证明\u003c/strong>：对任意 \u003cspan class=\"math\" data-tex=\"x &lt; y\">\u003ci>x\u003c/i> &lt; \u003ci>y\u003c/i>\u003c/span>，由中值定理存在 \u003cspan class=\"math\" data-tex=\"c\">\u003ci>c\u003c/i>\u003c/span> 使 \u003cspan class=\"math\" data-tex=\"0 = f'(c) = \\frac{f(y) - f(x)}{y - x}\">0 = \u003ci>f\u003c/i>'(\u003ci>c\u003c/i>) = (\u003ci>f\u003c/i>(\u003ci>y\u003c/i>) − \u003ci>f\u003c/i>(\u003ci>x\u003c/i>))/(\u003ci>y\u003c/i> − \u003ci>x\u003c/i>)\u003c/span>，所以 \u003cspan class=\"math\" data-tex=\"f(y) = f(x)\">\u003ci>f\u003c/i>(\u003ci>y\u003c/i>) = \u003ci>f\u003c/i>(\u003ci>x\u003c/i>)\u003c/span>。\u003c/p>"},{"t":"c","code":"theorem const_of_deriv_zero {f : ℝ → ℝ} (hf : Differentiable ℝ f) (h : ∀ x, deriv f x = 0)\n    {x y : ℝ} (hxy : x \u003c y) : f x = f y := by\n  obtain ⟨c, _, hc⟩ := exists_deriv_eq_slope f hxy hf.continuous.continuousOn\n    hf.differentiableOn\n  rw [h c, eq_comm, div_eq_zero_iff] at hc\n  rcases hc with hc | hc\n  · linarith\n  · linarith","upto":4225},{"t":"p","html":"\u003cp>\u003ccode>div_eq_zero_iff : a / b = 0 ↔ a = 0 ∨ b = 0\u003c/code>。第二种情形 \u003cspan class=\"math\" data-tex=\"y - x = 0\">\u003ci>y\u003c/i> − \u003ci>x\u003c/i> = 0\u003c/span> 与 \u003cspan class=\"math\" data-tex=\"x &lt; y\">\u003ci>x\u003c/i> &lt; \u003ci>y\u003c/i>\u003c/span> 矛盾。\u003c/p>\n\u003ch2 id=\"ch09-s11\">练习（二）：中值定理的应用\u003c/h2>\n\u003ch3 id=\"ch09-s12\">练习 9.5 ★　导数非负则函数递增\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"f\">\u003ci>f\u003c/i>\u003c/span> 处处可导且 \u003cspan class=\"math\" data-tex=\"f' \\ge 0\">\u003ci>f\u003c/i>' ≥ 0\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"a &lt; b\">\u003ci>a\u003c/i> &lt; \u003ci>b\u003c/i>\u003c/span> 时 \u003cspan class=\"math\" data-tex=\"f(a) \\le f(b)\">\u003ci>f\u003c/i>(\u003ci>a\u003c/i>) ≤ \u003ci>f\u003c/i>(\u003ci>b\u003c/i>)\u003c/span>。\u003c/p>\n\u003cp>提示：模仿例 9.4。得到 \u003ccode>hc : 0 ≤ (f b - f a) / (b - a)\u003c/code> 后，\u003ccode>div_nonneg_iff\u003c/code> 或 \u003ccode>le_div_iff₀ (hc : 0 &lt; c) : a ≤ b / c ↔ a * c ≤ b\u003c/code> 可以去分母。\u003c/p>"},{"t":"c","code":"theorem ex9_5 {f : ℝ → ℝ} (hf : Differentiable ℝ f) (h : ∀ x, 0 ≤ deriv f x)\n    {a b : ℝ} (hab : a \u003c b) : f a ≤ f b := by\n  sorry","upto":4665,"ex":{"id":"ch09:ex9_5","name":"ex9_5","solution":"theorem ex9_5 {f : ℝ → ℝ} (hf : Differentiable ℝ f) (h : ∀ x, 0 ≤ deriv f x)\n    {a b : ℝ} (hab : a \u003c b) : f a ≤ f b := by\n  obtain ⟨c, _, hc⟩ := exists_deriv_eq_slope f hab hf.continuous.continuousOn\n    hf.differentiableOn\n  have h1 := h c\n  rw [hc, le_div_iff₀ (by linarith)] at h1\n  linarith"}},{"t":"p","html":"\u003ch3 id=\"ch09-s13\">练习 9.6 ★★　导数有界则函数利普希茨\u003c/h3>\n\u003cp>若 \u003cspan class=\"math\" data-tex=\"|f'| \\le M\">|\u003ci>f\u003c/i>'| ≤ \u003ci>M\u003c/i>\u003c/span>，则 \u003cspan class=\"math\" data-tex=\"a &lt; b\">\u003ci>a\u003c/i> &lt; \u003ci>b\u003c/i>\u003c/span> 时 \u003cspan class=\"math\" data-tex=\"|f(b) - f(a)| \\le M (b - a)\">|\u003ci>f\u003c/i>(\u003ci>b\u003c/i>) − \u003ci>f\u003c/i>(\u003ci>a\u003c/i>)| ≤ \u003ci>M\u003c/i> (\u003ci>b\u003c/i> − \u003ci>a\u003c/i>)\u003c/span>。\u003c/p>\n\u003cp>提示：由中值定理，\u003cspan class=\"math\" data-tex=\"\\frac{f(b) - f(a)}{b - a} = f'(c)\">(\u003ci>f\u003c/i>(\u003ci>b\u003c/i>) − \u003ci>f\u003c/i>(\u003ci>a\u003c/i>))/(\u003ci>b\u003c/i> − \u003ci>a\u003c/i>) = \u003ci>f\u003c/i>'(\u003ci>c\u003c/i>)\u003c/span>，于是\u003cspan class=\"math\" data-tex=\"f(b) - f(a) = f'(c) (b - a)\">\u003ci>f\u003c/i>(\u003ci>b\u003c/i>) − \u003ci>f\u003c/i>(\u003ci>a\u003c/i>) = \u003ci>f\u003c/i>'(\u003ci>c\u003c/i>) (\u003ci>b\u003c/i> − \u003ci>a\u003c/i>)\u003c/span>（\u003ccode>div_eq_iff\u003c/code>），再用 \u003ccode>abs_mul\u003c/code>。\u003c/p>"},{"t":"c","code":"theorem ex9_6 {f : ℝ → ℝ} {M : ℝ} (hf : Differentiable ℝ f) (h : ∀ x, |deriv f x| ≤ M)\n    {a b : ℝ} (hab : a \u003c b) : |f b - f a| ≤ M * (b - a) := by\n  sorry","upto":5022,"ex":{"id":"ch09:ex9_6","name":"ex9_6","solution":"theorem ex9_6 {f : ℝ → ℝ} {M : ℝ} (hf : Differentiable ℝ f) (h : ∀ x, |deriv f x| ≤ M)\n    {a b : ℝ} (hab : a \u003c b) : |f b - f a| ≤ M * (b - a) := by\n  obtain ⟨c, _, hc⟩ := exists_deriv_eq_slope f hab hf.continuous.continuousOn\n    hf.differentiableOn\n  have hba : 0 \u003c b - a := by linarith\n  have h1 : f b - f a = deriv f c * (b - a) := by\n    rw [hc]\n    field_simp\n  rw [h1, abs_mul, abs_of_pos hba]\n  exact mul_le_mul_of_nonneg_right (h c) hba.le"}},{"t":"p","html":"\u003ch2 id=\"ch09-s14\">本章小结\u003c/h2>\n\u003cul>\u003cli>导数的线性逼近定义：误差 \u003cspan class=\"math\" data-tex=\"\\le \\varepsilon |x - a|\">≤ ε |\u003ci>x\u003c/i> − \u003ci>a\u003c/i>|\u003c/span>；\u003c/li>\u003cli>可导必连续，求导法则可以用 \u003cspan class=\"math\" data-tex=\"\\varepsilon\">ε\u003c/span>-\u003cspan class=\"math\" data-tex=\"\\delta\">δ\u003c/span> 严格证明；\u003c/li>\u003cli>拉格朗日中值定理 \u003ccode>exists_deriv_eq_slope\u003c/code> 把导数的信息转化为函数值的信息。\u003c/li>\u003c/ul>\n\u003ch2 id=\"ch09-s15\">全书结语\u003c/h2>\n\u003cp>恭喜你完成了本书！你已经亲手用 Lean 严格证明了数学分析入门的核心定理：极限的唯一性与运算法则、夹逼定理、单调收敛定理、连续函数的运算、介值定理与最值定理的应用、可导必连续以及中值定理的应用。\u003c/p>\n\u003cp>接下来可以继续探索：\u003c/p>\n\u003cul>\u003cli>\u003ca href=\"https://leanprover-community.github.io/mathematics_in_lean/\" target=\"_blank\" rel=\"noopener\">Mathematics in Lean\u003c/a>：Lean 官方的数学教程；\u003c/li>\u003cli>\u003ca href=\"https://leanprover-community.github.io/mathlib4_docs/\" target=\"_blank\" rel=\"noopener\">Mathlib 文档\u003c/a>：查找定理；\u003c/li>\u003cli>尝试用本书的方法形式化积分、级数与一致收敛。\u003c/li>\u003c/ul>"}]}],"repo":"https://github.com/kaoxi998533/pie-slang/tree/ccr-3f61a4ac-j9t5cv/lean-analysis"}</script>
<script>
(function () {
  'use strict';
  const BOOK = JSON.parse(document.getElementById('book-data').textContent);
  const CH = BOOK.chapters;
  const LIVE = 'https://live.lean-lang.org/';
  const KEY = 'lean-analysis-progress-v1';
  const view = document.getElementById('view');
  document.getElementById('repo-link').href = BOOK.repo;

  // ---------- progress (per-viewer, best effort) ----------
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { progress = {}; }
  function saveProgress() { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) { /* storage unavailable */ } }
  const exercisesOf = (ch) => ch.blocks.filter((b) => b.ex).map((b) => b.ex.id);
  const doneIn = (ch) => exercisesOf(ch).filter((id) => progress[id]).length;
  const TOTAL = CH.reduce((s, c) => s + c.exercises, 0);

  // ---------- helpers ----------
  const el = (tag, attrs, html) => {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) { if (attrs[k] != null) n.setAttribute(k, attrs[k]); }
    if (html != null) n.innerHTML = html;
    return n;
  };
  const escapeHtml = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function liveUrl(code) {
    try {
      if (window.LZString) return LIVE + '#codez=' + encodeURIComponent(LZString.compressToBase64(code).replace(/=+$/, ''));
    } catch (e) { /* fall back to plain code */ }
    return LIVE + '#code=' + encodeURIComponent(code);
  }
  // “运行”链接：先用未压缩的地址，压缩库加载后再换成更短的地址。
  let liveLinks = [];
  function liveLink(attrs, label, code) {
    const a = el('a', Object.assign({ href: liveUrl(code), target: '_blank', rel: 'noopener' }, attrs), label);
    liveLinks.push({ a, code });
    return a;
  }
  function refreshLiveLinks() { liveLinks.forEach((l) => { l.a.href = liveUrl(l.code); }); }
  function loadScript(src, onload) {
    const s = document.createElement('script');
    s.src = src; s.async = true; s.onload = onload;
    document.head.appendChild(s);
  }
  let toastTimer = null;
  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) { t = el('div', { class: 'toast', role: 'status' }); document.body.appendChild(t); }
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
  }
  function copyText(text, preEl) {
    const fallback = () => {
      if (preEl) {
        const r = document.createRange(); r.selectNodeContents(preEl);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        toast('已选中代码，请按 Ctrl+C / ⌘C 复制');
      } else toast('无法访问剪贴板');
    };
    try {
      navigator.clipboard.writeText(text).then(() => toast('已复制到剪贴板'), fallback);
    } catch (e) { fallback(); }
  }

  // ---------- Lean highlighting ----------
  const KW = new Set('theorem lemma def example abbrev instance structure inductive namespace end open section variable by fun λ have show from let in at with match calc do then else if using only where import noncomputable private protected set_option deriving this'.split(' '));
  const TAC = new Set('intro intros rintro apply exact refine use obtain rcases constructor left right linarith nlinarith positivity norm_num ring ring_nf simp simpa simp_all field_simp rw rwa rewrite unfold push push_neg push_cast by_contra by_cases specialize induction exact_mod_cast norm_cast gcongr omega congr ext funext convert rfl trivial exfalso contradiction assumption fun_prop dsimp change decide exact? apply? aesop continuity calc'.split(' '));
  const TY = new Set(['ℝ', 'ℕ', 'ℤ', 'ℚ', 'ℂ', 'Prop', 'Type', 'Set', 'True', 'False', 'Not']);
  const IDENT = /[\p{L}_][\p{L}\p{N}_'!?₀-ₜᵢ-ᵪ]*(?:\.[\p{L}_][\p{L}\p{N}_'!?₀-ₜᵢ-ᵪ]*)*/uy;
  const OPS = /[∀∃→↔∧∨¬⊢↦≤≥≠∈∉⊆⊂⟨⟩×·∑∘|:=<>+\-*/^←⁻¹]+/y;
  function highlight(code) {
    let out = '';
    let i = 0;
    let expectName = false;
    const push = (cls, s) => { out += cls ? `<span class="${cls}">${escapeHtml(s)}</span>` : escapeHtml(s); };
    while (i < code.length) {
      const c = code[i];
      if (code.startsWith('/-', i)) {
        let d = 1, j = i + 2;
        while (j < code.length && d > 0) {
          if (code.startsWith('/-', j)) { d++; j += 2; } else if (code.startsWith('-/', j)) { d--; j += 2; } else j++;
        }
        push('tk-c', code.slice(i, j)); i = j; continue;
      }
      if (code.startsWith('--', i)) {
        let j = code.indexOf('\n', i); if (j < 0) j = code.length;
        push('tk-c', code.slice(i, j)); i = j; continue;
      }
      if (c === '"') {
        let j = i + 1; while (j < code.length && code[j] !== '"') j += code[j] === '\\' ? 2 : 1;
        push('tk-s', code.slice(i, j + 1)); i = j + 1; continue;
      }
      if (/[0-9]/.test(c)) {
        const m = /[0-9]+(\.[0-9]+)?/y; m.lastIndex = i; const r = m.exec(code);
        push('tk-n', r[0]); i += r[0].length; continue;
      }
      IDENT.lastIndex = i;
      const id = IDENT.exec(code);
      if (id) {
        const w = id[0];
        let cls = null;
        if (w === 'sorry') cls = 'tk-sorry';
        else if (expectName) { cls = 'tk-nm'; expectName = false; }
        else if (KW.has(w)) { cls = 'tk-k'; if (w === 'theorem' || w === 'lemma' || w === 'def' || w === 'abbrev') expectName = true; }
        else if (TAC.has(w)) cls = 'tk-t';
        else if (TY.has(w)) cls = 'tk-ty';
