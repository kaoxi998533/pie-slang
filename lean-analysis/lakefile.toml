name = "Analysis"
version = "0.1.0"
defaultTargets = ["Analysis"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Analysis"
# 本书的章节是普通 Lean 文件（不使用 `module` 头），关闭相应的提示。
allowNonModules = true
